<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport"
   content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Super Retro Bros - Mobile & Desktop Edition</title>
  <!-- Tailwind CSS for modern responsive UI overlay -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Retro Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
   * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
   }

   html,
   body {
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background-color: #0f172a;
    font-family: 'Press Start 2P', monospace, cursive;
   }

   canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background-color: #5c94fc;
   }

   .retro-btn {
    background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
    border: 3px solid #ffffff;
    box-shadow: 0 4px 0 #991b1b;
    text-shadow: 2px 2px 0 #000;
    transition: transform 0.05s ease, box-shadow 0.05s ease;
   }

   .retro-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #991b1b;
   }

   /* Mobile Gamepad Touch Button Styling */
   .touch-pad-btn {
    touch-action: none;
    user-select: none;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.08));
    border: 2px solid rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    transition: transform 0.05s ease, background-color 0.05s ease, box-shadow 0.05s ease;
   }

   .touch-pad-btn.active,
   .touch-pad-btn:active {
    background: rgba(250, 204, 21, 0.45);
    border-color: #fde047;
    transform: scale(0.92);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
   }
  </style>
 </head>
 <body class="flex flex-col justify-between items-center w-full h-full p-2 sm:p-4 select-none"
  oncontextmenu="return false;">

  <!-- Top Retro HUD Header -->
  <header
   class="w-full max-w-4xl bg-black/85 rounded-xl px-3 py-2 border-2 border-yellow-400 flex justify-between items-center text-[10px] sm:text-xs tracking-wider text-yellow-300 z-10 shadow-xl shrink-0">
   <div>
    <div class="text-gray-400 text-[8px] sm:text-[10px]">MARIO</div>
    <div id="scoreDisplay">000000</div>
   </div>
   <div>
    <div class="text-gray-400 text-[8px] sm:text-[10px]">COINS</div>
    <div id="coinDisplay">🪙x00</div>
   </div>
   <div>
    <div class="text-gray-400 text-[8px] sm:text-[10px]">WORLD</div>
    <div>1-1</div>
   </div>
   <div>
    <div class="text-gray-400 text-[8px] sm:text-[10px]">TIME</div>
    <div id="timeDisplay">400</div>
   </div>
   <button id="soundToggleBtn"
    class="bg-gray-800 border border-yellow-400 px-2 py-1 rounded text-[9px] sm:text-[10px] hover:bg-gray-700 text-white active:scale-95 transition-transform">
    🔊 音声ON
   </button>
  </header>

  <!-- Main Game Canvas Container -->
  <main
   class="relative w-full max-w-4xl flex-grow flex justify-center items-center overflow-hidden rounded-xl border-4 border-yellow-500 bg-sky-400 my-1 sm:my-2 shadow-2xl">
   <canvas id="gameCanvas" width="800" height="448" class="w-full h-full max-h-[75vh] object-contain"></canvas>

   <!-- Start / Game Over Modal Overlay -->
   <div id="modalOverlay"
    class="absolute inset-0 bg-black/85 flex flex-col justify-center items-center p-4 sm:p-6 text-center z-20 transition-opacity duration-300">
    <h1 id="modalTitle" class="text-xl sm:text-3xl text-yellow-400 mb-3 animate-bounce tracking-widest">SUPER RETRO BROS
    </h1>
    <p id="modalSubtitle" class="text-[10px] sm:text-xs text-gray-200 mb-6 leading-relaxed max-w-md">
     📱 スマホ: 画面下のコントローラーで操作<br>
     💻 PC: 矢印/ADで移動 | Space/Zでジャンプ | Shift/Xでダッシュ
    </p>
    <button id="startBtn"
     class="retro-btn px-6 py-3 sm:px-8 sm:py-4 text-xs sm:text-sm text-white rounded-lg cursor-pointer">
     スタート !
    </button>
   </div>
  </main>

  <!-- Touch Controls for Mobile/Tablet Devices -->
  <div id="mobileControls"
   class="w-full max-w-4xl flex justify-between items-center px-3 py-1 select-none shrink-0 z-10 touch-none mb-1">
   <!-- D-Pad Left/Right Controls -->
   <div class="flex gap-3 sm:gap-4">
    <button id="btnLeft"
     class="touch-pad-btn w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-2xl font-black text-white active:scale-95">◀</button>
    <button id="btnRight"
     class="touch-pad-btn w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-2xl font-black text-white active:scale-95">▶</button>
   </div>
   <!-- Action Buttons (RUN & JUMP) -->
   <div class="flex gap-3 sm:gap-4 items-center">
    <button id="btnDash"
     class="touch-pad-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full flex items-center justify-center text-xs font-bold text-yellow-300 active:scale-95">RUN</button>
    <button id="btnJump"
     class="touch-pad-btn w-16 h-16 sm:w-20 sm:h-20 rounded-full flex items-center justify-center text-sm font-bold text-red-400 active:scale-95">JUMP</button>
   </div>
  </div>

  <script>
   class AudioEngine {
    constructor() {
     this.ctx = null;
     this.enabled = true;
     this.bgmTimer = null;
    }

    init() {
     if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
     }
     if (this.ctx.state === 'suspended') {
      this.ctx.resume();
     }
    }

    playTone(freq, type = 'square', duration = 0.1, volume = 0.1) {
     if (!this.enabled || !this.ctx) return;
     try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(volume, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start();
      osc.stop(this.ctx.currentTime + duration);
     } catch (e) { }
    }

    soundJump() {
     if (!this.enabled || !this.ctx) return;
     const now = this.ctx.currentTime;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'square';
     osc.frequency.setValueAtTime(150, now);
     osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
     gain.gain.setValueAtTime(0.12, now);
     gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start(now);
     osc.stop(now + 0.15);
    }

    soundCoin() {
     if (!this.enabled || !this.ctx) return;
     this.playTone(987.77, 'sine', 0.08, 0.15); // B5
     setTimeout(() => this.playTone(1318.51, 'sine', 0.25, 0.15), 80); // E6
    }

    soundPowerUp() {
     if (!this.enabled || !this.ctx) return;
     const notes = [330, 392, 659, 523, 587, 784];
     notes.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 'square', 0.1, 0.12), i * 60);
     });
    }

    soundStomp() {
     if (!this.enabled || !this.ctx) return;
     this.playTone(120, 'triangle', 0.12, 0.2);
    }

    soundBreak() {
     if (!this.enabled || !this.ctx) return;
     this.playTone(80, 'sawtooth', 0.15, 0.2);
    }

    soundGameOver() {
     if (!this.enabled || !this.ctx) return;
     this.stopBGM();
     const notes = [400, 350, 300, 250, 200, 150];
     notes.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 'sawtooth', 0.18, 0.15), i * 120);
     });
    }

    soundClear() {
     if (!this.enabled || !this.ctx) return;
     this.stopBGM();
     const notes = [261, 329, 392, 523, 659, 784, 1046];
     notes.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 'triangle', 0.15, 0.15), i * 100);
     });
    }

    startBGM() {
     if (!this.enabled) return;
     this.init();
     this.stopBGM();

     const melody = [
      659, 659, 0, 659, 0, 523, 659, 0, 784, 0, 0, 0, 392, 0, 0, 0,
      523, 0, 0, 392, 0, 0, 329, 0, 0, 440, 0, 493, 0, 466, 440, 0
     ];
     let index = 0;

     this.bgmTimer = setInterval(() => {
      const note = melody[index];
      if (note > 0) {
       this.playTone(note, 'square', 0.08, 0.04);
      }
      index = (index + 1) % melody.length;
     }, 130);
    }

    stopBGM() {
     if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
     }
    }
   }

   const sound = new AudioEngine();

   class InputHandler {
    constructor() {
     this.keys = {
      left: false,
      right: false,
      jump: false,
      dash: false
     };
     this.justJumped = false;

     // Keyboard Listeners
     window.addEventListener('keydown', (e) => {
      sound.init();
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) this.keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) this.keys.right = true;
      if (['ArrowUp', ' ', 'z', 'Z', 'w', 'W'].includes(e.key)) {
       if (!this.keys.jump) this.justJumped = true;
       this.keys.jump = true;
      }
      if (['Shift', 'x', 'X'].includes(e.key)) this.keys.dash = true;
     });

     window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) this.keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) this.keys.right = false;
      if (['ArrowUp', ' ', 'z', 'Z', 'w', 'W'].includes(e.key)) this.keys.jump = false;
      if (['Shift', 'x', 'X'].includes(e.key)) this.keys.dash = false;
     });

     // Setup Mobile Multi-Touch Controls
     this.setupTouch('btnLeft', 'left');
     this.setupTouch('btnRight', 'right');
     this.setupTouch('btnJump', 'jump');
     this.setupTouch('btnDash', 'dash');
    }

    setupTouch(elementId, keyName) {
     const btn = document.getElementById(elementId);
     if (!btn) return;

     const activeTouches = new Set();

     const handleTouchStart = (e) => {
      e.preventDefault();
      sound.init(); // Auto unlock Web Audio on mobile touch
      for (let i = 0; i < e.changedTouches.length; i++) {
       activeTouches.add(e.changedTouches[i].identifier);
      }
      if (keyName === 'jump' && !this.keys.jump) this.justJumped = true;
      this.keys[keyName] = true;
      btn.classList.add('active');
     };

     const handleTouchEnd = (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
       activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
       this.keys[keyName] = false;
       btn.classList.remove('active');
      }
     };

     btn.addEventListener('touchstart', handleTouchStart, { passive: false });
     btn.addEventListener('touchend', handleTouchEnd, { passive: false });
     btn.addEventListener('touchcancel', handleTouchEnd, { passive: false });

     // Mouse fallback for desktop pointer testing
     btn.addEventListener('mousedown', (e) => {
      if ('ontouchstart' in window) return;
      sound.init();
      if (keyName === 'jump' && !this.keys.jump) this.justJumped = true;
      this.keys[keyName] = true;
      btn.classList.add('active');
     });
     btn.addEventListener('mouseup', (e) => {
      if ('ontouchstart' in window) return;
      this.keys[keyName] = false;
      btn.classList.remove('active');
     });
     btn.addEventListener('mouseleave', (e) => {
      if ('ontouchstart' in window) return;
      this.keys[keyName] = false;
      btn.classList.remove('active');
     });
    }
   }

   const TILE_SIZE = 32;
   const GRAVITY = 0.5;

   class Player {
    constructor(x, y) {
     this.x = x;
     this.y = y;
     this.width = 28;
     this.height = 32;
     this.vx = 0;
     this.vy = 0;
     this.isGrounded = false;
     this.facing = 'right';
     this.isSuper = false; // Big Mario state
     this.invulnerableTimer = 0;
     this.animFrame = 0;
     this.animTimer = 0;
    }

    update(input, level) {
     const maxSpeed = input.keys.dash ? 4.5 : 3.0;
     const accel = input.keys.dash ? 0.3 : 0.2;
     const friction = 0.82;

     if (input.keys.left) {
      this.vx -= accel;
      this.facing = 'left';
     } else if (input.keys.right) {
      this.vx += accel;
      this.facing = 'right';
     } else {
      this.vx *= friction;
     }

     if (this.vx > maxSpeed) this.vx = maxSpeed;
     if (this.vx < -maxSpeed) this.vx = -maxSpeed;
     if (Math.abs(this.vx) < 0.05) this.vx = 0;

     // Jump logic
     if (input.keys.jump && this.isGrounded && input.justJumped) {
      this.vy = -11.5;
      this.isGrounded = false;
      sound.soundJump();
     }
     input.justJumped = false;

     // Apply Gravity
     this.vy += GRAVITY;
     if (this.vy > 12) this.vy = 12;

     if (this.invulnerableTimer > 0) {
      this.invulnerableTimer--;
     }

     // Horizontal movement & collision
     this.x += this.vx;
     level.checkHorizontalCollisions(this);

     // Vertical movement & collision
     this.y += this.vy;
     this.isGrounded = false;
     level.checkVerticalCollisions(this);

     // Animation Frame Cycling
     this.animTimer++;
     if (Math.abs(this.vx) > 0.5) {
      if (this.animTimer % 6 === 0) {
       this.animFrame = (this.animFrame + 1) % 3;
      }
     } else {
      this.animFrame = 0;
     }
    }

    grow() {
     if (!this.isSuper) {
      this.isSuper = true;
      this.y -= 16;
      this.height = 48;
      sound.soundPowerUp();
     }
    }

    shrink() {
     if (this.invulnerableTimer > 0) return;
     if (this.isSuper) {
      this.isSuper = false;
      this.height = 32;
      this.invulnerableTimer = 90;
      sound.soundStomp();
     } else {
      return true; // Triggers Game Over
     }
     return false;
    }

    draw(ctx, cameraX) {
     if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) {
      return; // Blink when hurt
     }

     ctx.save();
     ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

     const isRight = this.facing === 'right';
     if (!isRight) {
      ctx.scale(-1, 1);
      ctx.translate(-this.width, 0);
     }

     const hatColor = '#ef4444';
     const overallsColor = '#2563eb';
     const skinColor = '#fca5a5';
     const hairColor = '#78350f';

     if (this.isSuper) {
      // --- Super Mario ---
      ctx.fillStyle = hatColor;
      ctx.fillRect(6, 0, 18, 6);
      ctx.fillRect(4, 3, 22, 5);
      ctx.fillStyle = hairColor;
      ctx.fillRect(4, 8, 8, 8);
      ctx.fillStyle = skinColor;
      ctx.fillRect(10, 8, 14, 8);
      ctx.fillStyle = hairColor;
      ctx.fillRect(18, 10, 4, 6);
      ctx.fillStyle = hatColor;
      ctx.fillRect(4, 16, 20, 12);
      ctx.fillStyle = overallsColor;
      ctx.fillRect(6, 24, 16, 16);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(8, 28, 3, 3);
      ctx.fillRect(17, 28, 3, 3);
      ctx.fillStyle = hairColor;
      if (!this.isGrounded) {
       ctx.fillRect(2, 40, 10, 8);
       ctx.fillRect(16, 36, 10, 8);
      } else if (this.animFrame === 1) {
       ctx.fillRect(2, 40, 10, 8);
       ctx.fillRect(16, 40, 10, 8);
      } else {
       ctx.fillRect(4, 40, 9, 8);
       ctx.fillRect(15, 40, 9, 8);
      }
     } else {
      // --- Small Mario ---
      ctx.fillStyle = hatColor;
      ctx.fillRect(4, 0, 18, 5);
      ctx.fillRect(2, 3, 22, 4);
      ctx.fillStyle = skinColor;
      ctx.fillRect(4, 7, 18, 7);
      ctx.fillStyle = hairColor;
      ctx.fillRect(2, 7, 6, 6);
      ctx.fillRect(14, 9, 6, 4);
      ctx.fillStyle = overallsColor;
      ctx.fillRect(4, 14, 18, 11);
      ctx.fillStyle = hatColor;
      ctx.fillRect(2, 14, 6, 7);
      ctx.fillRect(18, 14, 6, 7);
      ctx.fillStyle = hairColor;
      if (!this.isGrounded) {
       ctx.fillRect(0, 24, 10, 8);
       ctx.fillRect(16, 20, 10, 8);
      } else if (this.animFrame === 1) {
       ctx.fillRect(0, 25, 10, 7);
       ctx.fillRect(16, 25, 10, 7);
      } else {
       ctx.fillRect(2, 25, 9, 7);
       ctx.fillRect(15, 25, 9, 7);
      }
     }

     ctx.restore();
    }
   }

   class Goomba {
    constructor(x, y) {
     this.x = x;
     this.y = y;
     this.width = 30;
     this.height = 30;
     this.vx = -1.2;
     this.vy = 0;
     this.isAlive = true;
     this.isSquished = false;
     this.squishTimer = 0;
     this.animFrame = 0;
    }

    update(level) {
     if (this.isSquished) {
      this.squishTimer++;
      return;
     }

     this.vy += GRAVITY;
     this.x += this.vx;

     let gridX = Math.floor((this.vx > 0 ? this.x + this.width : this.x) / TILE_SIZE);
     let gridY = Math.floor((this.y + 10) / TILE_SIZE);
     if (level.isSolid(gridX, gridY)) {
      this.vx *= -1;
     }

     this.y += this.vy;
     let bottomGridY = Math.floor((this.y + this.height) / TILE_SIZE);
     let feetGridX1 = Math.floor(this.x / TILE_SIZE);
     let feetGridX2 = Math.floor((this.x + this.width - 1) / TILE_SIZE);

     if (level.isSolid(feetGridX1, bottomGridY) || level.isSolid(feetGridX2, bottomGridY)) {
      this.y = bottomGridY * TILE_SIZE - this.height;
      this.vy = 0;
     }

     this.animFrame = Math.floor(Date.now() / 200) % 2;
    }

    draw(ctx, cameraX) {
     if (!this.isAlive && this.squishTimer > 20) return;

     ctx.save();
     ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

     if (this.isSquished) {
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(2, 20, 26, 10);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(6, 22, 6, 4);
      ctx.fillRect(18, 22, 6, 4);
     } else {
      ctx.fillStyle = '#9a3412';
      ctx.beginPath();
      ctx.arc(15, 14, 14, Math.PI, 0, false);
      ctx.fill();
      ctx.fillRect(3, 14, 24, 8);

      ctx.fillStyle = '#fde047';
      ctx.fillRect(8, 20, 14, 6);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(7, 10, 4, 8);
      ctx.fillRect(19, 10, 4, 8);
      ctx.fillStyle = '#000000';
      ctx.fillRect(9, 12, 2, 4);
      ctx.fillRect(19, 12, 2, 4);

      ctx.fillStyle = '#451a03';
      if (this.animFrame === 0) {
       ctx.fillRect(2, 24, 10, 6);
       ctx.fillRect(18, 24, 10, 6);
      } else {
       ctx.fillRect(4, 24, 10, 6);
       ctx.fillRect(16, 24, 10, 6);
      }
     }

     ctx.restore();
    }
   }

   class Mushroom {
    constructor(x, y) {
     this.x = x;
     this.y = y;
     this.width = 28;
     this.height = 28;
     this.vx = 1.5;
     this.vy = -2;
     this.active = true;
    }

    update(level) {
     if (!this.active) return;

     this.vy += GRAVITY;
     this.x += this.vx;

     let gridX = Math.floor((this.vx > 0 ? this.x + this.width : this.x) / TILE_SIZE);
     let gridY = Math.floor((this.y + 8) / TILE_SIZE);
     if (level.isSolid(gridX, gridY)) {
      this.vx *= -1;
     }

     this.y += this.vy;
     let bottomGridY = Math.floor((this.y + this.height) / TILE_SIZE);
     let feetGridX1 = Math.floor(this.x / TILE_SIZE);
     let feetGridX2 = Math.floor((this.x + this.width - 1) / TILE_SIZE);

     if (level.isSolid(feetGridX1, bottomGridY) || level.isSolid(feetGridX2, bottomGridY)) {
      this.y = bottomGridY * TILE_SIZE - this.height;
      this.vy = 0;
     }
    }

    draw(ctx, cameraX) {
     if (!this.active) return;
     ctx.save();
     ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

     ctx.fillStyle = '#dc2626';
     ctx.beginPath();
     ctx.arc(14, 12, 14, Math.PI, 0, false);
     ctx.fill();
     ctx.fillRect(0, 12, 28, 6);

     ctx.fillStyle = '#ffffff';
     ctx.fillRect(11, 4, 6, 6);
     ctx.fillRect(2, 11, 5, 5);
     ctx.fillRect(21, 11, 5, 5);

     ctx.fillStyle = '#fef08a';
     ctx.fillRect(6, 18, 16, 10);
     ctx.fillStyle = '#000000';
     ctx.fillRect(9, 20, 2, 4);
     ctx.fillRect(17, 20, 2, 4);

     ctx.restore();
    }
   }

   class Level {
    constructor(game) {
     this.game = game;
     this.width = 140;
     this.height = 14;
     this.grid = Array(this.height).fill(null).map(() => Array(this.width).fill(0));

     this.coins = [];
     this.enemies = [];
     this.mushrooms = [];
     this.flagPoleX = 0;

     this.buildWorld();
    }

    buildWorld() {
     for (let x = 0; x < this.width; x++) {
      if ((x >= 55 && x <= 57) || (x >= 90 && x <= 92)) {
       continue;
      }
      this.grid[12][x] = 1;
      this.grid[13][x] = 1;
     }

     const placeQuestion = (x, y, isMushroom = false) => {
      this.grid[y][x] = isMushroom ? 4 : 3;
     };

     const placeBrick = (x, y) => {
      this.grid[y][x] = 2;
     };

     const placePipe = (x, height) => {
      const baseY = 12 - height;
      this.grid[baseY][x] = 6;
      this.grid[baseY][x + 1] = 7;
      for (let h = baseY + 1; h < 12; h++) {
       this.grid[h][x] = 8;
       this.grid[h][x + 1] = 9;
      }
     };

     placeQuestion(12, 8);
     placeBrick(16, 8);
     placeQuestion(17, 8, true);
     placeBrick(18, 8);
     placeQuestion(19, 8);
     placeBrick(20, 8);
     placeQuestion(18, 4);

     placePipe(26, 2);
     placePipe(36, 3);
     placePipe(46, 4);

     this.enemies.push(new Goomba(22 * TILE_SIZE, 11 * TILE_SIZE));
     this.enemies.push(new Goomba(38 * TILE_SIZE, 11 * TILE_SIZE));
     this.enemies.push(new Goomba(50 * TILE_SIZE, 11 * TILE_SIZE));
     this.enemies.push(new Goomba(72 * TILE_SIZE, 11 * TILE_SIZE));
     this.enemies.push(new Goomba(82 * TILE_SIZE, 11 * TILE_SIZE));

     for (let i = 0; i < 4; i++) {
      for (let j = 0; j <= i; j++) {
       this.grid[11 - j][65 + i] = 5;
      }
     }

     for (let x = 74; x <= 80; x++) placeBrick(x, 8);
     placeQuestion(77, 8, true);

     this.flagPoleX = 122 * TILE_SIZE;
     for (let h = 3; h <= 11; h++) {
      this.grid[h][122] = 99;
     }
     for (let x = 128; x <= 134; x++) {
      for (let y = 8; y <= 11; y++) {
       this.grid[y][x] = 5;
      }
     }
    }

    isSolid(gridX, gridY) {
     if (gridX < 0 || gridX >= this.width || gridY < 0 || gridY >= this.height) {
      return false;
     }
     const tile = this.grid[gridY][gridX];
     return tile > 0 && tile !== 99;
    }

    checkHorizontalCollisions(entity) {
     let leftTile = Math.floor(entity.x / TILE_SIZE);
     let rightTile = Math.floor((entity.x + entity.width) / TILE_SIZE);
     let topTile = Math.floor(entity.y / TILE_SIZE);
     let bottomTile = Math.floor((entity.y + entity.height - 1) / TILE_SIZE);

     for (let y = topTile; y <= bottomTile; y++) {
      if (this.isSolid(leftTile, y)) {
       entity.x = (leftTile + 1) * TILE_SIZE;
       entity.vx = 0;
      } else if (this.isSolid(rightTile, y)) {
       entity.x = rightTile * TILE_SIZE - entity.width;
       entity.vx = 0;
      }
     }
    }

    checkVerticalCollisions(entity) {
     let leftTile = Math.floor(entity.x / TILE_SIZE);
     let rightTile = Math.floor((entity.x + entity.width - 1) / TILE_SIZE);
     let topTile = Math.floor(entity.y / TILE_SIZE);
     let bottomTile = Math.floor((entity.y + entity.height) / TILE_SIZE);

     if (entity.vy >= 0) {
      for (let x = leftTile; x <= rightTile; x++) {
       if (this.isSolid(x, bottomTile)) {
        entity.y = bottomTile * TILE_SIZE - entity.height;
        entity.vy = 0;
        entity.isGrounded = true;
        break;
       }
      }
     } else if (entity.vy < 0) {
      for (let x = leftTile; x <= rightTile; x++) {
       if (this.isSolid(x, topTile)) {
        entity.y = (topTile + 1) * TILE_SIZE;
        entity.vy = 0;
        if (entity === this.game.player) {
         this.hitBlock(x, topTile);
        }
        break;
       }
      }
     }
    }

    hitBlock(x, y) {
     const tile = this.grid[y][x];

     if (tile === 2) {
      if (this.game.player.isSuper) {
       this.grid[y][x] = 0;
       sound.soundBreak();
       this.game.addScore(50);
      } else {
       sound.soundStomp();
      }
     } else if (tile === 3) {
      this.grid[y][x] = 10;
      sound.soundCoin();
      this.game.addCoin();
     } else if (tile === 4) {
      this.grid[y][x] = 10;
      this.mushrooms.push(new Mushroom(x * TILE_SIZE, (y - 1) * TILE_SIZE));
      sound.soundPowerUp();
     }
    }

    draw(ctx, cameraX) {
     const startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
     const endCol = Math.min(this.width, Math.ceil((cameraX + 800) / TILE_SIZE));

     for (let y = 0; y < this.height; y++) {
      for (let x = startCol; x < endCol; x++) {
       const tile = this.grid[y][x];
       const drawX = Math.floor(x * TILE_SIZE - cameraX);
       const drawY = Math.floor(y * TILE_SIZE);

       if (tile === 1) {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#92400e';
        ctx.fillRect(drawX + 2, drawY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(drawX + 4, drawY + 4, 4, 4);
       } else if (tile === 2) {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(drawX, drawY + 14, TILE_SIZE, 4);
        ctx.fillRect(drawX + 14, drawY, 4, 14);
        ctx.fillRect(drawX + 6, drawY + 18, 4, 14);
       } else if (tile === 3 || tile === 4) {
        ctx.fillStyle = '#eab308';
        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#713f12';
        ctx.fillRect(drawX + 2, drawY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(drawX + 4, drawY + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        ctx.fillStyle = '#854d0e';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('?', drawX + 10, drawY + 23);
       } else if (tile === 10) {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#451a03';
        ctx.fillRect(drawX + 2, drawY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
       } else if (tile === 5) {
        ctx.fillStyle = '#64748b';
        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#334155';
        ctx.fillRect(drawX + 2, drawY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
       } else if (tile >= 6 && tile <= 9) {
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(drawX + 4, drawY, 6, TILE_SIZE);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(drawX + TILE_SIZE - 6, drawY, 4, TILE_SIZE);
       } else if (tile === 99) {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(drawX + 12, drawY, 8, TILE_SIZE);
        if (y === 3) {
         ctx.fillStyle = '#facc15';
         ctx.beginPath();
         ctx.arc(drawX + 16, drawY + 4, 10, 0, Math.PI * 2);
         ctx.fill();
         ctx.fillStyle = '#ef4444';
         ctx.beginPath();
         ctx.moveTo(drawX + 12, drawY + 10);
         ctx.lineTo(drawX - 24, drawY + 24);
         ctx.lineTo(drawX + 12, drawY + 38);
         ctx.fill();
        }
       }
      }
     }
    }
   }

   class Game {
    constructor() {
     this.canvas = document.getElementById('gameCanvas');
     this.ctx = this.canvas.getContext('2d');
     this.input = new InputHandler();

     this.score = 0;
     this.coins = 0;
     this.time = 400;
     this.cameraX = 0;
     this.gameState = 'START';
     this.timerInterval = null;

     // Pre-initialize player & level for title background rendering
     this.player = new Player(100, 300);
     this.level = new Level(this);

     this.initUI();
    }

    initUI() {
     document.getElementById('startBtn').addEventListener('click', () => {
      sound.init();
      this.restart();
     });

     document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      sound.enabled = !sound.enabled;
      e.target.innerText = sound.enabled ? "🔊 音声ON" : "🔇 音声OFF";
      if (!sound.enabled) sound.stopBGM();
      else if (this.gameState === 'PLAYING') sound.startBGM();
     });
    }

    restart() {
     this.player = new Player(100, 300);
     this.level = new Level(this);
     this.score = 0;
     this.coins = 0;
     this.time = 400;
     this.cameraX = 0;
     this.gameState = 'PLAYING';

     document.getElementById('modalOverlay').classList.add('hidden');
     this.updateHUD();

     if (this.timerInterval) clearInterval(this.timerInterval);
     this.timerInterval = setInterval(() => {
      if (this.gameState === 'PLAYING') {
       this.time--;
       this.updateHUD();
       if (this.time <= 0) this.gameOver();
      }
     }, 1000);

     sound.startBGM();
    }

    addScore(pts) {
     this.score += pts;
     this.updateHUD();
    }

    addCoin() {
     this.coins++;
     this.addScore(200);
     this.updateHUD();
    }

    updateHUD() {
     document.getElementById('scoreDisplay').innerText = String(this.score).padStart(6, '0');
     document.getElementById('coinDisplay').innerText = `🪙x${String(this.coins).padStart(2, '0')}`;
     document.getElementById('timeDisplay').innerText = String(this.time).padStart(3, '0');
    }

    gameOver() {
     this.gameState = 'GAMEOVER';
     sound.soundGameOver();
     document.getElementById('modalTitle').innerText = "GAME OVER";
     document.getElementById('modalSubtitle').innerText = `最終スコア: ${this.score}`;
     document.getElementById('startBtn').innerText = "もう一度プレイ";
     document.getElementById('modalOverlay').classList.remove('hidden');
    }

    stageClear() {
     this.gameState = 'CLEAR';
     sound.soundClear();
     const bonusScore = this.time * 50;
     this.addScore(bonusScore);

     document.getElementById('modalTitle').innerText = "STAGE CLEAR!";
     document.getElementById('modalSubtitle').innerText = `おめでとう！ コースをクリアしました！\nタイムボーナス: +${bonusScore}pts`;
     document.getElementById('startBtn').innerText = "次のステージへ";
     document.getElementById('modalOverlay').classList.remove('hidden');
    }

    update() {
     if (this.gameState !== 'PLAYING' || !this.level || !this.player) return;

     this.player.update(this.input, this.level);

     if (this.player.x - this.cameraX > 350) {
      this.cameraX = this.player.x - 350;
     }
     if (this.cameraX < 0) this.cameraX = 0;
     const maxCamX = (this.level.width - 25) * TILE_SIZE;
     if (this.cameraX > maxCamX) this.cameraX = maxCamX;

     if (this.player.y > 500) {
      this.gameOver();
     }

     if (this.player.x >= this.level.flagPoleX) {
      this.stageClear();
     }

     this.level.mushrooms.forEach(mushroom => {
      mushroom.update(this.level);
      if (mushroom.active && this.checkOverlap(this.player, mushroom)) {
       this.player.grow();
       this.addScore(1000);
       mushroom.active = false;
      }
     });

     this.level.enemies.forEach(enemy => {
      enemy.update(this.level);

      if (!enemy.isAlive || enemy.isSquished) return;

      if (this.checkOverlap(this.player, enemy)) {
       if (this.player.vy > 0 && (this.player.y + this.player.height - this.player.vy) <= enemy.y + 12) {
        enemy.isSquished = true;
        enemy.isAlive = false;
        this.player.vy = -7;
        sound.soundStomp();
        this.addScore(100);
       } else {
        const dead = this.player.shrink();
        if (dead) this.gameOver();
       }
      }
     });
    }

    checkOverlap(a, b) {
     return a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y;
    }

    draw() {
     this.ctx.fillStyle = '#5c94fc';
     this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

     this.drawBackground();

     if (this.level) {
      this.level.draw(this.ctx, this.cameraX);
      this.level.mushrooms.forEach(m => m.draw(this.ctx, this.cameraX));
      this.level.enemies.forEach(e => e.draw(this.ctx, this.cameraX));
     }

     if (this.player && (this.gameState === 'PLAYING' || this.gameState === 'CLEAR')) {
      this.player.draw(this.ctx, this.cameraX);
     }
    }

    drawBackground() {
     this.ctx.fillStyle = '#ffffff';
     const cloudPositions = [100, 400, 800, 1200, 1600, 2200, 2800];
     cloudPositions.forEach(x => {
      const drawX = x - this.cameraX * 0.5;
      if (drawX > -100 && drawX < 900) {
       this.ctx.beginPath();
       this.ctx.arc(drawX + 20, 80, 20, 0, Math.PI * 2);
       this.ctx.arc(drawX + 40, 70, 25, 0, Math.PI * 2);
       this.ctx.arc(drawX + 60, 80, 20, 0, Math.PI * 2);
       this.ctx.fill();
      }
     });

     this.ctx.fillStyle = '#00a800';
     const hillPositions = [200, 700, 1300, 1900, 2500];
     hillPositions.forEach(x => {
      const drawX = x - this.cameraX;
      if (drawX > -150 && drawX < 900) {
       this.ctx.beginPath();
       this.ctx.arc(drawX + 40, 384, 40, Math.PI, 0, false);
       this.ctx.arc(drawX + 80, 384, 60, Math.PI, 0, false);
       this.ctx.arc(drawX + 120, 384, 40, Math.PI, 0, false);
       this.ctx.fill();
      }
     });
    }

    loop() {
     this.update();
     this.draw();
     requestAnimationFrame(() => this.loop());
    }
   }

   // Initialize Game Engine on Window Load
   window.onload = () => {
    const game = new Game();
    game.loop();
   };
  </script>
