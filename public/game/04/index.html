<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galactic Striker - Web Shooter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

   body,
   html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    touch-action: none;
    /* スマホでのスクロールを防止 */
   }

   #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
   }

   canvas {
    display: block;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    background-color: #050510;
   }

   #mobile-controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 15px;
    z-index: 10;
    display: none;
    /* デフォルトは非表示、タッチデバイスで表示 */
   }

   @media (hover: none) and (pointer: coarse) {
    #mobile-controls {
     display: flex;
    }
   }

   .action-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.5);
    color: white;
    font-size: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    backdrop-filter: blur(4px);
    font-family: 'Press Start 2P', monospace;
    text-align: center;
   }

   .action-btn:active {
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0.95);
   }

   #touch-area-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 50%;
    height: 100%;
    z-index: 5;
   }

   #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
   }

   #game-over,
   #title-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 20;
    pointer-events: auto;
   }
  </style>
 </head>
 <body>

  <div id="game-container">
   <canvas id="gameCanvas"></canvas>

   <!-- Touch Controls -->
   <div id="touch-area-left"></div>
   <div id="mobile-controls">
    <div id="btn-powerup" class="action-btn">PWR<br>UP</div>
    <div id="btn-shoot" class="action-btn" style="background: rgba(255, 50, 50, 0.3);">SHOOT</div>
   </div>

   <!-- Overlays -->
   <div id="title-screen">
    <h1 class="text-3xl md:text-5xl text-blue-400 mb-8 text-center" style="text-shadow: 0 0 10px blue;">GALACTIC STRIKER
    </h1>
    <p class="text-sm md:text-base text-gray-300 mb-4 text-center leading-relaxed">
     PC: Arrow keys/WASD to move.<br>Z to Shoot, X to Power Up.<br><br>
     Mobile: Drag left side to move.<br>Use buttons on right.
    </p>
    <button id="start-btn"
     class="mt-8 px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold border-2 border-white">START
     GAME</button>
   </div>

   <div id="game-over" style="display: none;">
    <h1 class="text-4xl text-red-500 mb-4" id="game-over-title">GAME OVER</h1>
    <p class="text-xl mb-8" id="final-score">Score: 0</p>
    <button id="restart-btn"
     class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white rounded font-bold border-2 border-white">RETRY</button>
   </div>
  </div>

  <script>
   const canvas = document.getElementById('gameCanvas');
   const ctx = canvas.getContext('2d');

   // 内部解像度（レトロ感と処理負荷低減のため固定サイズで描画し、CSSで引き伸ばす）
   const GAME_WIDTH = 800;
   const GAME_HEIGHT = 450;

   function resize() {
    const windowRatio = window.innerWidth / window.innerHeight;
    const gameRatio = GAME_WIDTH / GAME_HEIGHT;

    if (windowRatio < gameRatio) {
     canvas.style.width = window.innerWidth + 'px';
     canvas.style.height = (window.innerWidth / gameRatio) + 'px';
    } else {
     canvas.style.width = (window.innerHeight * gameRatio) + 'px';
     canvas.style.height = window.innerHeight + 'px';
    }

    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // フォントのスケーリング対策
    ctx.textBaseline = 'top';
   }

   window.addEventListener('resize', resize);
   resize();

   const POWERUP_TYPES = [
    { name: "SPEED", color: "#3498db" },
    { name: "MISSILE", color: "#e74c3c" },
    { name: "DOUBLE", color: "#f1c40f" },
    { name: "LASER", color: "#2ecc71" },
    { name: "OPTION", color: "#9b59b6" },
    { name: "SHIELD", color: "#e67e22" }
   ];

   const STATE = {
    TITLE: 0,
    PLAYING: 1,
    GAMEOVER: 2,
    STAGECLEAR: 3
   };

   let game = {
    state: STATE.TITLE,
    score: 0,
    lives: 3,
    stage: 1,
    scrollX: 0,
    frame: 0,
    bossActive: false,
    entities: {
     player: null,
     bullets: [],
     enemies: [],
     particles: [],
     items: [],
     options: []
    },
    keys: { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, z: false, x: false },
    touch: { active: false, x: 0, y: 0, originX: 0, originY: 0, playerOriginX: 0, playerOriginY: 0 },
    shooting: false,
    stars: []
   };

   class Player {
    constructor() {
     this.x = 100;
     this.y = GAME_HEIGHT / 2;
     this.width = 30;
     this.height = 14;
     this.speed = 3;
     this.speedLevel = 0;

     this.weapon = "NORMAL"; // NORMAL, DOUBLE, LASER
     this.hasMissile = false;
     this.shield = 0; // シールド耐久値

     this.powerUpGauge = 0; // 1~6
     this.optionsCount = 0;

     this.cooldown = 0;
     this.missileCooldown = 0;

     this.history = []; // オプション追従用
     this.invincibleTime = 0;
     this.dead = false;
    }

    update() {
     if (this.dead) return;

     if (this.invincibleTime > 0) this.invincibleTime--;

     // 移動履歴の記録 (オプション用)
     this.history.unshift({ x: this.x, y: this.y });
     if (this.history.length > 60) this.history.pop();

     // 操作処理 (PC)
     let dx = 0, dy = 0;
     if (game.keys['ArrowUp'] || game.keys['w']) dy -= 1;
     if (game.keys['ArrowDown'] || game.keys['s']) dy += 1;
     if (game.keys['ArrowLeft'] || game.keys['a']) dx -= 1;
     if (game.keys['ArrowRight'] || game.keys['d']) dx += 1;

     // タッチ操作のオーバーライド
     if (game.touch.active) {
      this.x = game.touch.playerOriginX + (game.touch.x - game.touch.originX) * 1.5;
      this.y = game.touch.playerOriginY + (game.touch.y - game.touch.originY) * 1.5;
     } else {
      // 正規化して移動
      if (dx !== 0 && dy !== 0) {
       const length = Math.sqrt(dx * dx + dy * dy);
       dx /= length; dy /= length;
      }
      this.x += dx * this.speed;
      this.y += dy * this.speed;
     }

     // 画面外に出ないように制限
     this.x = Math.max(this.width / 2, Math.min(GAME_WIDTH - this.width / 2, this.x));
     this.y = Math.max(this.height / 2, Math.min(GAME_HEIGHT - this.height / 2, this.y));

     // ショット
     if (this.cooldown > 0) this.cooldown--;
     if (this.missileCooldown > 0) this.missileCooldown--;

     if ((game.keys['z'] || game.shooting) && this.cooldown <= 0) {
      this.shoot();
     }
    }

    shoot() {
     // メインショット
     if (this.weapon === "NORMAL") {
      game.entities.bullets.push(new Bullet(this.x + 10, this.y, 10, 0, false, "NORMAL"));
      this.cooldown = 8;
     } else if (this.weapon === "DOUBLE") {
      game.entities.bullets.push(new Bullet(this.x + 10, this.y, 10, 0, false, "NORMAL"));
      game.entities.bullets.push(new Bullet(this.x + 10, this.y - 5, 8, -6, false, "NORMAL"));
      this.cooldown = 10;
     } else if (this.weapon === "LASER") {
      // レーザーは長くて貫通する
      game.entities.bullets.push(new Bullet(this.x + 20, this.y, 15, 0, false, "LASER"));
      this.cooldown = 15;
     }

     // ミサイル
     if (this.hasMissile && this.missileCooldown <= 0) {
      game.entities.bullets.push(new Bullet(this.x, this.y + 5, 5, 5, false, "MISSILE"));
      this.missileCooldown = 30;
     }

     // オプションからのショット
     game.entities.options.forEach(opt => opt.shoot(this.weapon, this.hasMissile));
    }

    activatePowerUp() {
     if (this.powerUpGauge === 0) return;
     const type = POWERUP_TYPES[this.powerUpGauge - 1].name;

     switch (type) {
      case "SPEED":
       if (this.speedLevel < 5) {
        this.speedLevel++;
        this.speed = 3 + (this.speedLevel * 1.5);
       }
       break;
      case "MISSILE":
       this.hasMissile = true;
       break;
      case "DOUBLE":
       this.weapon = "DOUBLE";
       break;
      case "LASER":
       this.weapon = "LASER";
       break;
      case "OPTION":
       if (this.optionsCount < 4) {
        this.optionsCount++;
        game.entities.options.push(new Option(this.optionsCount));
       }
       break;
      case "SHIELD":
       this.shield = 5; // 5回攻撃を防ぐ
       break;
     }
     this.powerUpGauge = 0;
     createParticles(this.x, this.y, 10, "#FFF");
    }

    draw() {
     if (this.dead) return;
     // 無敵点滅
     if (this.invincibleTime > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

     ctx.save();
     ctx.translate(this.x, this.y);

     // 機体描画 (Vic Viper風の尖った形状)
     ctx.fillStyle = "#FFF";
     ctx.beginPath();
     ctx.moveTo(15, 0);
     ctx.lineTo(-10, -8);
     ctx.lineTo(-5, 0);
     ctx.lineTo(-10, 8);
     ctx.closePath();
     ctx.fill();

     // エンジンの炎
     if (game.frame % 4 < 2) {
      ctx.fillStyle = "#F80";
      ctx.beginPath();
      ctx.moveTo(-10, -2);
      ctx.lineTo(-20 - Math.random() * 5, 0);
      ctx.lineTo(-10, 2);
      ctx.fill();
     }

     ctx.restore();

     // シールド描画
     if (this.shield > 0) {
      ctx.strokeStyle = `rgba(255, 150, 0, ${0.5 + Math.random() * 0.3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 25, 0, Math.PI * 2);
      ctx.stroke();
     }
    }
   }

   class Option {
    constructor(index) {
     this.index = index; // 1, 2, 3, 4
     this.x = -100;
     this.y = -100;
    }

    update() {
     const player = game.entities.player;
     // インデックスに応じて履歴から位置を取得
     const delay = this.index * 12;
     if (player.history.length > delay) {
      const target = player.history[delay];
      this.x = target.x;
      this.y = target.y;
     }
    }

    shoot(weapon, hasMissile) {
     if (this.x < 0) return; // 画面外なら撃たない

     if (weapon === "NORMAL" || weapon === "DOUBLE") {
      game.entities.bullets.push(new Bullet(this.x + 5, this.y, 10, 0, false, "NORMAL"));
     } else if (weapon === "LASER") {
      game.entities.bullets.push(new Bullet(this.x + 10, this.y, 15, 0, false, "LASER"));
     }

     if (hasMissile && game.entities.player.missileCooldown === 30) {
      // プレイヤーのミサイル発射タイミングに同期
      game.entities.bullets.push(new Bullet(this.x, this.y + 5, 5, 5, false, "MISSILE"));
     }
    }

    draw() {
     if (this.x < 0) return;
     ctx.fillStyle = "#f39c12";
     ctx.beginPath();
     ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
     ctx.fill();
     ctx.strokeStyle = "#fff";
     ctx.lineWidth = 1;
     ctx.stroke();
    }
   }

   class Bullet {
    constructor(x, y, vx, vy, isEnemy, type) {
     this.x = x;
     this.y = y;
     this.vx = vx;
     this.vy = vy;
     this.isEnemy = isEnemy;
     this.type = type; // NORMAL, LASER, MISSILE
     this.active = true;
     this.width = 10;
     this.height = 4;

     if (type === "LASER") {
      this.width = 40;
      this.height = 4;
     } else if (type === "MISSILE") {
      this.width = 8;
      this.height = 8;
     } else if (isEnemy) {
      this.width = 6;
      this.height = 6;
     }
    }

    update() {
     this.x += this.vx;
     this.y += this.vy;

     // ミサイルの地形（画面下部）這い沿い処理
     if (this.type === "MISSILE" && this.y >= GAME_HEIGHT - 10) {
      this.y = GAME_HEIGHT - 10;
      this.vy = 0;
      this.vx = 8; // 地面を走る
     }

     if (this.x < 0 || this.x > GAME_WIDTH || this.y < 0 || this.y > GAME_HEIGHT) {
      this.active = false;
     }
    }

    draw() {
     ctx.save();
     ctx.translate(this.x, this.y);

     if (this.isEnemy) {
      ctx.fillStyle = "#ff0044";
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();
     } else {
      if (this.type === "LASER") {
       ctx.fillStyle = "#00ffff";
       ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
       ctx.fillStyle = "#ffffff";
       ctx.fillRect(-this.width / 2, -1, this.width, 2);
      } else if (this.type === "MISSILE") {
       ctx.fillStyle = "#ffaa00";
       ctx.beginPath();
       ctx.arc(0, 0, 4, 0, Math.PI * 2);
       ctx.fill();
      } else {
       ctx.fillStyle = "#ffff00";
       ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
      }
     }
     ctx.restore();
    }
   }

   class Item {
    constructor(x, y) {
     this.x = x;
     this.y = y;
     this.vx = -1; // 背景と共にスクロール
     this.active = true;
     this.width = 16;
     this.height = 10;
     this.animCounter = 0;
    }

    update() {
     this.x += this.vx;
     this.animCounter++;
     if (this.x < -20) this.active = false;
    }

    draw() {
     ctx.save();
     ctx.translate(this.x, this.y);

     // カプセルの描画
     ctx.fillStyle = (Math.floor(this.animCounter / 10) % 2 === 0) ? "#e74c3c" : "#ffb8b8";
     ctx.beginPath();
     ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
     ctx.fill();
     ctx.fillStyle = "white";
     ctx.fillRect(-3, -2, 6, 4);

     ctx.restore();
    }
   }

   class Enemy {
    constructor(x, y, type, hasItem = false) {
     this.x = x;
     this.y = y;
     this.type = type; // BASIC, SINE, TURRET, BOSS
     this.hasItem = hasItem;
     this.active = true;
     this.width = 20;
     this.height = 20;
     this.hp = 1;
     this.timer = 0;
     this.startY = y;

     if (type === "BOSS") {
      this.hp = 100 * game.stage;
      this.width = 80;
      this.height = 120;
      this.y = GAME_HEIGHT / 2;
     } else if (this.hasItem) {
      this.hp = 2; // 赤ザコは少し硬い
     }
    }

    update() {
     this.timer++;

     switch (this.type) {
      case "BASIC":
       this.x -= 1.5;
       break;
      case "SINE":
       this.x -= 1;
       this.y = this.startY + Math.sin(this.timer * 0.025) * 50;
       break;
      case "TURRET":
       this.x -= 1; // スクロール速度
       // プレイヤーを狙って撃つ
       if (this.timer % 100 === 0 && this.x < GAME_WIDTH && this.x > 0) {
        const p = game.entities.player;
        if (p && !p.dead) {
         const angle = Math.atan2(p.y - this.y, p.x - this.x);
         game.entities.bullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 2, Math.sin(angle) * 2, true, "NORMAL"));
        }
       }
       break;
      case "BOSS":
       // ボスの動き
       if (this.x > GAME_WIDTH - 100) {
        this.x -= 1; // 登場
       } else {
        // 上下に動く
        this.y = (GAME_HEIGHT / 2) + Math.sin(this.timer * 0.01) * 100;

        // 攻撃パターン
        if (this.timer % 60 === 0) {
         // 3WAY弾
         game.entities.bullets.push(new Bullet(this.x - 30, this.y, -2.5, 0, true, "NORMAL"));
         game.entities.bullets.push(new Bullet(this.x - 30, this.y, -2, 1, true, "NORMAL"));
         game.entities.bullets.push(new Bullet(this.x - 30, this.y, -2, -1, true, "NORMAL"));
        }
        if (this.timer % 200 === 0) {
         // レーザーもどき（高速弾）
         game.entities.bullets.push(new Bullet(this.x - 30, this.y, -6, 0, true, "NORMAL"));
        }
       }
       break;
     }

     if (this.x < -this.width) this.active = false;
    }

    draw() {
     ctx.save();
     ctx.translate(this.x, this.y);

     if (this.type === "BOSS") {
      // コア
      ctx.fillStyle = (this.timer % 10 < 5) ? "#555" : "#777";
      ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
      // 目玉（弱点）
      ctx.fillStyle = "#0ff";
      ctx.beginPath();
      ctx.arc(-10, 0, 15, 0, Math.PI * 2);
      ctx.fill();

      // ダメージエフェクト
      if (this.hitTimer > 0) {
       ctx.fillStyle = "rgba(255,255,255,0.5)";
       ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
       this.hitTimer--;
      }

     } else {
      ctx.fillStyle = this.hasItem ? "#e74c3c" : "#8e44ad";
      if (this.type === "TURRET") ctx.fillStyle = "#27ae60";

      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-10, -10);
      ctx.lineTo(-5, 0);
      ctx.lineTo(-10, 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.stroke();
     }

     ctx.restore();
    }

    takeDamage(amt) {
     this.hp -= amt;
     this.hitTimer = 3;
     if (this.hp <= 0) {
      this.active = false;
      createParticles(this.x, this.y, this.type === "BOSS" ? 50 : 15, this.hasItem ? "#e74c3c" : "#fff");
      game.score += this.type === "BOSS" ? 5000 : 100;

      if (this.hasItem) {
       game.entities.items.push(new Item(this.x, this.y));
      }

      if (this.type === "BOSS") {
       stageClear();
      }
     }
    }
   }

   class Particle {
    constructor(x, y, color) {
     this.x = x;
     this.y = y;
     this.vx = (Math.random() - 0.5) * 8;
     this.vy = (Math.random() - 0.5) * 8;
     this.life = 30 + Math.random() * 20;
     this.maxLife = this.life;
     this.color = color;
     this.active = true;
    }
    update() {
     this.x += this.vx;
     this.y += this.vy;
     this.life--;
     if (this.life <= 0) this.active = false;
    }
    draw() {
     ctx.globalAlpha = this.life / this.maxLife;
     ctx.fillStyle = this.color;
     ctx.beginPath();
     ctx.arc(this.x, this.y, 2 + (this.life / this.maxLife) * 3, 0, Math.PI * 2);
     ctx.fill();
     ctx.globalAlpha = 1.0;
    }
   }

   function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
     game.entities.particles.push(new Particle(x, y, color));
    }
   }

   function checkCollisions() {
    const player = game.entities.player;
    const enemies = game.entities.enemies;
    const bullets = game.entities.bullets;
    const items = game.entities.items;

    // 簡単な矩形・円形ハイブリッド判定
    const isCollide = (obj1, obj2) => {
     return Math.abs(obj1.x - obj2.x) < (obj1.width / 2 + obj2.width / 2) &&
      Math.abs(obj1.y - obj2.y) < (obj1.height / 2 + obj2.height / 2);
    };

    // プレイヤー弾 vs 敵
    bullets.filter(b => !b.isEnemy).forEach(bullet => {
     enemies.forEach(enemy => {
      if (bullet.active && enemy.active && isCollide(bullet, enemy)) {
       enemy.takeDamage(bullet.type === "LASER" ? 0.5 : 1);
       if (bullet.type !== "LASER") bullet.active = false; // レーザーは貫通
      }
     });
    });

    if (!player || player.dead || player.invincibleTime > 0) return;

    // 敵・敵弾 vs プレイヤー
    let hitPlayer = false;

    enemies.forEach(enemy => {
     if (enemy.active && isCollide(player, enemy)) hitPlayer = true;
    });

    bullets.filter(b => b.isEnemy).forEach(bullet => {
     if (bullet.active && isCollide(player, bullet)) {
      hitPlayer = true;
      bullet.active = false;
     }
    });

    if (hitPlayer) {
     if (player.shield > 0) {
      player.shield--;
      player.invincibleTime = 30; // 被弾後少し無敵
      createParticles(player.x, player.y, 10, "#e67e22");
     } else {
      killPlayer();
     }
    }

    // アイテム vs プレイヤー
    items.forEach(item => {
     if (item.active && isCollide(player, item)) {
      item.active = false;
      if (player.powerUpGauge < 6) {
       player.powerUpGauge++;
      }
      game.score += 500;
     }
    });
   }

   function killPlayer() {
    const player = game.entities.player;
    createParticles(player.x, player.y, 100, "#ff0");
    player.dead = true;
    game.lives--;

    setTimeout(() => {
     if (game.lives >= 0) {
      respawnPlayer();
     } else {
      gameOver();
     }
    }, 1500);
   }

   function respawnPlayer() {
    game.entities.player = new Player();
    game.entities.player.invincibleTime = 120; // 復活時無敵
    game.entities.options = []; // オプション没収
    // パワーアップ状態もリセット（Gradius仕様）
   }

   function spawnEnemies() {
    if (game.bossActive || game.state !== STATE.PLAYING) return;

    // スクロールに応じた出現パターン
    const scroll = game.scrollX;

    // ステージ1のシーケンス例 (ループさせるためにモジュロを使用)
    const timeline = scroll % 8000;

    if (timeline % 100 === 0 && timeline < 2000) {
     game.entities.enemies.push(new Enemy(GAME_WIDTH + 20, Math.random() * GAME_HEIGHT * 0.8 + 20, "BASIC"));
    }

    if (timeline % 150 === 0 && timeline > 1000 && timeline < 3000) {
     game.entities.enemies.push(new Enemy(GAME_WIDTH + 20, GAME_HEIGHT * 0.2, "SINE"));
     game.entities.enemies.push(new Enemy(GAME_WIDTH + 20, GAME_HEIGHT * 0.8, "SINE"));
    }

    if (timeline % 300 === 0 && timeline > 2000 && timeline < 5000) {
     // パワーアップ持ち編隊
     game.entities.enemies.push(new Enemy(GAME_WIDTH + 20, 100, "BASIC", true));
    }

    if (timeline % 800 === 0 && timeline > 4000 && timeline < 7000) {
     // 地上砲台（画面下と上）出現頻度を1/4に削減
     game.entities.enemies.push(new Enemy(GAME_WIDTH + 20, GAME_HEIGHT - 20, "TURRET"));
     if (Math.random() > 0.5) game.entities.enemies.push(new Enemy(GAME_WIDTH + 20, 20, "TURRET"));
    }

    // ボス出現
    if (scroll >= 8000 * game.stage && !game.bossActive) {
     game.bossActive = true;
     game.entities.enemies.push(new Enemy(GAME_WIDTH + 100, GAME_HEIGHT / 2, "BOSS"));
    }
   }

   function stageClear() {
    game.state = STATE.STAGECLEAR;
    setTimeout(() => {
     game.stage++;
     game.bossActive = false;
     game.scrollX = 0; // スクロールリセットして次のステージへ（難易度上昇）
     game.entities.enemies = [];
     game.entities.bullets = [];
     game.state = STATE.PLAYING;
    }, 3000);
   }

   function gameOver() {
    game.state = STATE.GAMEOVER;
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('final-score').innerText = `Score: ${game.score}`;
   }

   function update() {
    if (game.state !== STATE.PLAYING) return;

    game.frame++;
    if (!game.bossActive) {
     game.scrollX += 1;
    }

    // 背景の星更新
    game.stars.forEach(star => {
     star.x -= star.speed;
     if (star.x < 0) {
      star.x = GAME_WIDTH;
      star.y = Math.random() * GAME_HEIGHT;
     }
    });

    if (game.entities.player && !game.entities.player.dead) {
     game.entities.player.update();
    }

    game.entities.options.forEach(opt => opt.update());

    game.entities.bullets.forEach(b => b.update());
    game.entities.enemies.forEach(e => e.update());
    game.entities.particles.forEach(p => p.update());
    game.entities.items.forEach(i => i.update());

    // ゴミ掃除
    game.entities.bullets = game.entities.bullets.filter(b => b.active);
    game.entities.enemies = game.entities.enemies.filter(e => e.active);
    game.entities.particles = game.entities.particles.filter(p => p.active);
    game.entities.items = game.entities.items.filter(i => i.active);

    spawnEnemies();
    checkCollisions();
   }

   function drawUI() {
    // スコアと残機
    ctx.fillStyle = "white";
    ctx.font = "12px 'Press Start 2P', monospace";
    ctx.textAlign = "left";
    ctx.fillText(`SCORE:${game.score}`, 10, 20);
    ctx.fillText(`STAGE:${game.stage}`, 10, 40);

    ctx.textAlign = "right";
    ctx.fillText(`LIVES:${game.lives}`, GAME_WIDTH - 10, 20);

    // パワーアップゲージの描画
    const barWidth = 100;
    const barHeight = 25;
    const startX = (GAME_WIDTH - (POWERUP_TYPES.length * barWidth)) / 2;
    const startY = GAME_HEIGHT - barHeight - 10;

    const player = game.entities.player;
    if (!player) return;

    POWERUP_TYPES.forEach((pu, index) => {
     const x = startX + index * barWidth;

     // 枠
     ctx.strokeStyle = "#444";
     ctx.lineWidth = 2;
     if (player.powerUpGauge === index + 1) {
      // 現在選択中
      ctx.fillStyle = "#f39c12";
      ctx.strokeStyle = "#fff";
      // 点滅
      if (game.frame % 10 < 5) ctx.fillStyle = "#e67e22";
     } else {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
     }

     ctx.fillRect(x, startY, barWidth - 4, barHeight);
     ctx.strokeRect(x, startY, barWidth - 4, barHeight);

     // テキスト
     ctx.fillStyle = (player.powerUpGauge === index + 1) ? "#000" : pu.color;
     ctx.font = "10px 'Press Start 2P', monospace";
     ctx.textAlign = "center";
     ctx.fillText(pu.name, x + barWidth / 2, startY + 8);
    });

    // 取得済み装備の表示
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    let statusText = `SPD:${player.speedLevel}  WPN:${player.weapon}`;
    if (player.hasMissile) statusText += ` MSL`;
    if (player.optionsCount > 0) statusText += ` OPT:${player.optionsCount}`;
    ctx.fillText(statusText, 10, GAME_HEIGHT - 20);

    // ボス警告
    if (game.bossActive && game.frame % 60 < 30 && game.entities.enemies.some(e => e.type === "BOSS")) {
     ctx.fillStyle = "red";
     ctx.font = "24px 'Press Start 2P', monospace";
     ctx.textAlign = "center";
     ctx.fillText("WARNING!! BOSS APPROACHING", GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50);
    }

    // ステージクリア
    if (game.state === STATE.STAGECLEAR) {
     ctx.fillStyle = "white";
     ctx.font = "30px 'Press Start 2P', monospace";
     ctx.textAlign = "center";
     ctx.fillText("STAGE CLEAR", GAME_WIDTH / 2, GAME_HEIGHT / 2);
    }
   }

   function draw() {
    // 背景クリア
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // 星描画
    game.stars.forEach(star => {
     ctx.fillStyle = `rgba(255,255,255,${star.brightness})`;
     ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    // エンティティ描画
    game.entities.items.forEach(i => i.draw());
    game.entities.enemies.forEach(e => e.draw());
    game.entities.bullets.forEach(b => b.draw());
    game.entities.particles.forEach(p => p.draw());

    game.entities.options.forEach(opt => opt.draw());
    if (game.entities.player) game.entities.player.draw();

    if (game.state === STATE.PLAYING || game.state === STATE.STAGECLEAR) {
     drawUI();
    }
   }

   function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
   }

   function initGame() {
    game.state = STATE.PLAYING;
    game.score = 0;
    game.lives = 3;
    game.stage = 1;
    game.scrollX = 0;
    game.frame = 0;
    game.bossActive = false;

    game.entities.bullets = [];
    game.entities.enemies = [];
    game.entities.particles = [];
    game.entities.items = [];
    game.entities.options = [];

    // 星の初期化
    game.stars = [];
    for (let i = 0; i < 100; i++) {
     game.stars.push({
      x: Math.random() * GAME_WIDTH,
      y: Math.random() * GAME_HEIGHT,
      size: Math.random() * 2 + 1,
      speed: Math.random() * 2 + 0.1,
      brightness: Math.random()
     });
    }

    respawnPlayer();

    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
   }

   // --- キーボード入力 ---
   window.addEventListener('keydown', (e) => {
    if (game.keys.hasOwnProperty(e.key)) {
     game.keys[e.key] = true;
     if (e.key === 'x') {
      if (game.entities.player && !game.entities.player.dead) game.entities.player.activatePowerUp();
     }
    }
    // z,xキー対応 (小文字大文字)
    if (e.key.toLowerCase() === 'z') game.keys['z'] = true;
    if (e.key.toLowerCase() === 'x') {
     game.keys['x'] = true;
     if (game.entities.player && !game.entities.player.dead) game.entities.player.activatePowerUp();
    }
   });

   window.addEventListener('keyup', (e) => {
    if (game.keys.hasOwnProperty(e.key)) game.keys[e.key] = false;
    if (e.key.toLowerCase() === 'z') game.keys['z'] = false;
    if (e.key.toLowerCase() === 'x') game.keys['x'] = false;
   });

   // --- タッチ入力 ---
   const touchArea = document.getElementById('touch-area-left');

   touchArea.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    game.touch.active = true;
    game.touch.originX = touch.clientX;
    game.touch.originY = touch.clientY;
    game.touch.x = touch.clientX;
    game.touch.y = touch.clientY;

    if (game.entities.player && !game.entities.player.dead) {
     game.touch.playerOriginX = game.entities.player.x;
     game.touch.playerOriginY = game.entities.player.y;
    }
   });

   touchArea.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    game.touch.x = touch.clientX;
    game.touch.y = touch.clientY;
   });

   touchArea.addEventListener('touchend', (e) => {
    e.preventDefault();
    game.touch.active = false;
   });

   // --- モバイルボタン ---
   const btnShoot = document.getElementById('btn-shoot');
   const btnPowerUp = document.getElementById('btn-powerup');

   // Shoot (押しっぱなし対応)
   btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); game.shooting = true; });
   btnShoot.addEventListener('touchend', (e) => { e.preventDefault(); game.shooting = false; });

   // PowerUp
   btnPowerUp.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (game.entities.player && !game.entities.player.dead) game.entities.player.activatePowerUp();
   });

   // --- UI ボタン ---
   document.getElementById('start-btn').addEventListener('click', initGame);
   document.getElementById('restart-btn').addEventListener('click', initGame);

   // 起動
   window.onload = () => {
    // タイトル画面用の星描画など静的処理のため一度drawを呼ぶ
    gameLoop();
   };

  </script>
 </body>
</html>
