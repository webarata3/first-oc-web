  <!-- Game Result Modal -->

   class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">

    class="glass-panel text-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center border border-white/40">
    <div
     class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3 text-amber-600 text-2xl">

    </div>

    <p id="result-subtitle" class="text-slate-600 text-sm mb-4">結果の判定が行われました</p>

    <div class="bg-slate-100/80 rounded-xl p-4 mb-5 border border-slate-200">
     <div class="flex justify-between items-center text-sm py-1 border-b border-slate-200">
      <span class="font-bold text-slate-700">黒の地 + 揚げ駒:</span>
      <span id="score-black-detail" class="font-mono font-bold text-slate-900">0</span>
     </div>
     <div class="flex justify-between items-center text-sm py-1 border-b border-slate-200">
      <span class="font-bold text-slate-700">白の地 + 揚げ駒 + コミ:</span>
      <span id="score-white-detail" class="font-mono font-bold text-slate-900">0</span>

    <button id="btn-restart-game"

  <script>
   // Game Configuration & State Variables
   const EMPTY = 0;
   const BLACK = 1;
   const WHITE = 2;

   let boardSize = 9; // Default 9x9
   let difficulty = 'medium'; // easy, medium, hard
   let humanPlayer = BLACK; // BLACK or WHITE
   let aiPlayer = WHITE;

   let board = []; // 2D Array [row][col]
   let history = []; // Stack of previous board states
   let captures = { [BLACK]: 0, [WHITE]: 0 };
   let currentTurn = BLACK;
   let consecutivePasses = 0;
   let gameOver = false;
   let lastMove = null; // {r, c}
   let soundEnabled = true;
   let isAiThinking = false;
   let komi = 6.5;

   // UI Canvas & Context
   const canvas = document.getElementById('go-board');
   const ctx = canvas.getContext('2d');
   let cellSize = 0;
   let boardPadding = 0;

   // Audio Context for sound synthesis
   let audioCtx = null;

   function initAudio() {
    if (!audioCtx) {
     const AudioContext = window.AudioContext || window.webkitAudioContext;
     if (AudioContext) audioCtx = new AudioContext();
    }
   }

   // Play realistic stone placement sound using Web Audio API
   function playStoneSound() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    try {
     const osc = audioCtx.createOscillator();
     const gain = audioCtx.createGain();
     const now = audioCtx.currentTime;

     // Sound pitch and envelope mimicking clack on wooden board
     osc.type = 'sine';
     osc.frequency.setValueAtTime(450 + Math.random() * 80, now);
     osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);

     gain.gain.setValueAtTime(0.7, now);
     gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

     osc.connect(gain);
     gain.connect(audioCtx.destination);

     osc.start(now);
     osc.stop(now + 0.08);
    } catch (e) {
     console.error("Audio error:", e);
    }
   }

   // Initialize Game State
   function initGame() {
    board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(EMPTY));
    history = [];
    captures = { [BLACK]: 0, [WHITE]: 0 };
    currentTurn = BLACK;
    consecutivePasses = 0;
    gameOver = false;
    lastMove = null;
    isAiThinking = false;

    updateUI();
    resizeCanvas();

    // If AI goes first
    if (currentTurn === aiPlayer) {
     makeAiMove();
    }
   }

   // Deep copy board helper
   function copyBoard(b) {
    return b.map(row => [...row]);
   }

   // Check if coordinate is inside grid
   function inBounds(r, c) {
    return r >= 0 && r < boardSize && c >= 0 && c < boardSize;
   }

   // Get adjacent cells
   function getNeighbors(r, c) {
    const neighbors = [];
    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (let [dr, dc] of dirs) {
     const nr = r + dr;
     const nc = c + dc;
     if (inBounds(nr, nc)) neighbors.push({ r: nr, c: nc });
    }
    return neighbors;
   }

   // Find string (group of connected stones) and its liberties
   function getGroup(b, r, c) {
    const color = b[r][c];
    if (color === EMPTY) return null;

    const group = [];
    const liberties = new Set();
    const visited = Array(boardSize).fill(null).map(() => Array(boardSize).fill(false));
    const queue = [{ r, c }];
    visited[r][c] = true;

    while (queue.length > 0) {
     const curr = queue.shift();
     group.push(curr);

     for (let n of getNeighbors(curr.r, curr.c)) {
      if (b[n.r][n.c] === EMPTY) {
       liberties.add(`${n.r},${n.c}`);
      } else if (b[n.r][n.c] === color && !visited[n.r][n.c]) {
       visited[n.r][n.c] = true;
       queue.push(n);
      }
     }
    }

    return { color, group, libertiesCount: liberties.size, liberties };
   }

   // Validate and execute a move on a target board
   function applyMove(b, r, c, color) {
    if (b[r][c] !== EMPTY) return null;

    const nextBoard = copyBoard(b);
    nextBoard[r][c] = color;
    const opponent = color === BLACK ? WHITE : BLACK;
    let capturedStones = 0;

    // Check adjacent opponent groups for capture
    for (let n of getNeighbors(r, c)) {
     if (nextBoard[n.r][n.c] === opponent) {
      const g = getGroup(nextBoard, n.r, n.c);
      if (g && g.libertiesCount === 0) {
       // Remove captured group
       for (let s of g.group) {
        nextBoard[s.r][s.c] = EMPTY;
        capturedStones++;
       }
      }
     }
    }

    // Check suicide rule
    const ownGroup = getGroup(nextBoard, r, c);
    if (ownGroup.libertiesCount === 0) {
     return null; // Illegal suicide move
    }

    return { board: nextBoard, captured: capturedStones };
   }

   // Check Ko rule (prohibit repeating previous exact board state)
   function isKo(nextBoard) {
    if (history.length === 0) return false;
    const prev = history[history.length - 1].board;
    for (let r = 0; r < boardSize; r++) {
     for (let c = 0; c < boardSize; c++) {
      if (nextBoard[r][c] !== prev[r][c]) return false;
     }
    }
    return true;
   }

   // Execute player turn
   function playStone(r, c) {
    if (gameOver || isAiThinking) return false;
    if (board[r][c] !== EMPTY) return false;

    const res = applyMove(board, r, c, currentTurn);
    if (!res) return false; // Invalid move

    if (isKo(res.board)) {
     alert("コウのため、すぐには打てません。");
     return false;
    }

    // Save history
    history.push({
     board: copyBoard(board),
     captures: { ...captures },
     lastMove: lastMove ? { ...lastMove } : null,
     currentTurn: currentTurn
    });

    // Update board state
    board = res.board;
    captures[currentTurn] += res.captured;
    lastMove = { r, c };
    consecutivePasses = 0;

    playStoneSound();

    // Switch turn
    currentTurn = currentTurn === BLACK ? WHITE : BLACK;
    updateUI();
    drawBoard();

    // Trigger AI if CPU's turn
    if (!gameOver && currentTurn === aiPlayer) {
     setTimeout(makeAiMove, 400);
    }

    return true;
   }

   // Pass function
   function passTurn() {
    if (gameOver || isAiThinking) return;

    history.push({
     board: copyBoard(board),
     captures: { ...captures },
     lastMove: lastMove ? { ...lastMove } : null,
     currentTurn: currentTurn
    });

    consecutivePasses++;
    currentTurn = currentTurn === BLACK ? WHITE : BLACK;

    if (consecutivePasses >= 2) {
     endGame("両者パスにより対局が終了しました。");
    } else {
     updateUI();
     drawBoard();
     if (currentTurn === aiPlayer) {
      setTimeout(makeAiMove, 400);
     }
    }
   }

   // Undo function
   function undoMove() {
    if (history.length === 0 || isAiThinking) return;

    // Undo until it's human player turn again (or single move if human vs human)
    let lastState = history.pop();
    if (lastState.currentTurn === aiPlayer && history.length > 0) {
     lastState = history.pop();
    }

    board = lastState.board;
    captures = lastState.captures;
    lastMove = lastState.lastMove;
    currentTurn = lastState.currentTurn;
    consecutivePasses = 0;
    gameOver = false;

    updateUI();
    drawBoard();
   }

   // Resign
   function resignGame() {
    if (gameOver) return;
    const winner = currentTurn === BLACK ? "白" : "黒";
    endGame(`${currentTurn === BLACK ? "黒" : "白"}が投了しました。${winner}の勝ちです。`, winner === "黒" ? BLACK : WHITE);
   }

   // AI Logic Engine
   function makeAiMove() {
    if (gameOver || currentTurn !== aiPlayer) return;
    isAiThinking = true;
    updateStatusText("CPUが思考中...");

    setTimeout(() => {
     const move = calculateAiMove();
     isAiThinking = false;

     if (!move) {
      passTurn();
     } else {
      playStone(move.r, move.c);
     }
    }, 300);
   }

   function calculateAiMove() {
    const validMoves = [];

    // Gather all valid legal moves
    for (let r = 0; r < boardSize; r++) {
     for (let c = 0; c < boardSize; c++) {
      if (board[r][c] === EMPTY) {
       const res = applyMove(board, r, c, aiPlayer);
       if (res && !isKo(res.board)) {
        validMoves.push({ r, c, captured: res.captured });
       }
      }
     }
    }

    if (validMoves.length === 0) return null; // Pass

    // EASY DIFFICULTY: Random selection with basic eye-prevention
    if (difficulty === 'easy') {
     const filtered = validMoves.filter(m => !isTrueEye(board, m.r, m.c, aiPlayer));
     const pool = filtered.length > 0 ? filtered : validMoves;
     return pool[Math.floor(Math.random() * pool.length)];
    }

    // MEDIUM / HARD DIFFICULTY: Heuristic evaluation
    let bestMove = null;
    let bestScore = -Infinity;

    for (let move of validMoves) {
     let score = evaluateMove(move.r, move.c, move.captured);

     // Add small random noise for variety
     score += Math.random() * (difficulty === 'medium' ? 4 : 1);

     if (score > bestScore) {
      bestScore = score;
      bestMove = move;
     }
    }

    // If top score is very low or negative in late game, consider passing
    if (bestScore < -50 && history.length > boardSize * boardSize * 0.6) {
     return null;
    }

    return bestMove || validMoves[Math.floor(Math.random() * validMoves.length)];
   }

   // Evaluate heuristic quality of a single move
   function evaluateMove(r, c, captured) {
    let score = 0;
    const res = applyMove(board, r, c, aiPlayer);
    if (!res) return -999;

    // 1. Capture Bonus
    score += captured * 25;

    // 2. Liberties check of the newly formed group
    const g = getGroup(res.board, r, c);
    if (g) {
     if (g.libertiesCount === 1) score -= 30; // Self-ataris (dangerous)
     else if (g.libertiesCount === 2) score -= 5;
     else score += g.libertiesCount * 3;
    }

    // 3. Saving own stones in Atari
    for (let n of getNeighbors(r, c)) {
     if (board[n.r][n.c] === aiPlayer) {
      const oldG = getGroup(board, n.r, n.c);
      if (oldG && oldG.libertiesCount === 1) {
       score += 35; // Rescuing own stone!
      }
     }
    }

    // 4. Putting opponent into Atari
    const opponent = aiPlayer === BLACK ? WHITE : BLACK;
    for (let n of getNeighbors(r, c)) {
     if (board[n.r][n.c] === opponent) {
      const oppGroup = getGroup(res.board, n.r, n.c);
      if (oppGroup && oppGroup.libertiesCount === 1) {
       score += 20; // Atari opponent
      }
     }
    }

    // 5. Position value (Prefer center/star points over corners/edges in early game)
    const center = (boardSize - 1) / 2;
    const distFromCenter = Math.abs(r - center) + Math.abs(c - center);
    score += (boardSize - distFromCenter);

    // Avoid 1st line (edges) unless capturing/defending
    if (r === 0 || r === boardSize - 1 || c === 0 || c === boardSize - 1) {
     if (captured === 0) score -= 8;
    }

    // Avoid filling own eyes
    if (isTrueEye(board, r, c, aiPlayer)) {
     score -= 40;
    }

    return score;
   }

   // Simple check to avoid filling real eyes
   function isTrueEye(b, r, c, color) {
    const neighbors = getNeighbors(r, c);
    for (let n of neighbors) {
     if (b[n.r][n.c] !== color) return false;
    }
    return true;
   }

   // Territory Scoring Algorithm (Flood fill)
   function calculateScores() {
    const visited = Array(boardSize).fill(null).map(() => Array(boardSize).fill(false));
    let blackTerritory = 0;
    let whiteTerritory = 0;

    for (let r = 0; r < boardSize; r++) {
     for (let c = 0; c < boardSize; c++) {
      if (board[r][c] === EMPTY && !visited[r][c]) {
       // Perform flood fill to check surrounding stones
       const region = [];
       const queue = [{ r, c }];
       visited[r][c] = true;
       let touchesBlack = false;
       let touchesWhite = false;

       while (queue.length > 0) {
        const curr = queue.shift();
        region.push(curr);

        for (let n of getNeighbors(curr.r, curr.c)) {
         const val = board[n.r][n.c];
         if (val === BLACK) touchesBlack = true;
         else if (val === WHITE) touchesWhite = true;
         else if (val === EMPTY && !visited[n.r][n.c]) {
          visited[n.r][n.c] = true;
          queue.push(n);
         }
        }
       }

       if (touchesBlack && !touchesWhite) {
        blackTerritory += region.length;
       } else if (touchesWhite && !touchesBlack) {
        whiteTerritory += region.length;
       }
      }
     }
    }

    const blackTotal = blackTerritory + captures[BLACK];
    const whiteTotal = whiteTerritory + captures[WHITE] + komi;

    return {
     blackTerritory,
     whiteTerritory,
     blackTotal,
     whiteTotal,
     winner: blackTotal > whiteTotal ? BLACK : WHITE,
     margin: Math.abs(blackTotal - whiteTotal)
    };
   }

   // End Game and show dialog
   function endGame(reason, explicitWinner = null) {
    gameOver = true;
    const scores = calculateScores();
    const winner = explicitWinner || scores.winner;

    document.getElementById('result-subtitle').innerText = reason;
    document.getElementById('score-black-detail').innerText = `${scores.blackTerritory} (地) + ${captures[BLACK]} (アゲハマ) = ${scores.blackTotal}目`;
    document.getElementById('score-white-detail').innerText = `${scores.whiteTerritory} (地) + ${captures[WHITE]} (アゲハマ) + ${komi} (コミ) = ${scores.whiteTotal}目`;

    const winnerText = winner === BLACK
     ? `黒の勝利！ (${scores.margin > 0 ? scores.margin + '目勝ち' : ''})`
     : `白の勝利！ (${scores.margin > 0 ? scores.margin + '目勝ち' : ''})`;

    document.getElementById('result-winner').innerText = winnerText;
    document.getElementById('modal-result').classList.remove('hidden');
   }

   // Board & Stones Drawing Engine
   function resizeCanvas() {
    const container = canvas.parentElement;
    const maxW = Math.min(container.clientWidth - 16, 520); // Responsive max width
    canvas.width = maxW;
    canvas.height = maxW;

    boardPadding = maxW / (boardSize + 1);
    cellSize = (maxW - boardPadding * 2) / (boardSize - 1);

    drawBoard();
   }

   function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Wood Texture Lines & Grid
    ctx.strokeStyle = '#4a2e13';
    ctx.lineWidth = 1.5;

    for (let i = 0; i < boardSize; i++) {
     // Horizontal lines
     ctx.beginPath();
     ctx.moveTo(boardPadding, boardPadding + i * cellSize);
     ctx.lineTo(canvas.width - boardPadding, boardPadding + i * cellSize);
     ctx.stroke();

     // Vertical lines
     ctx.beginPath();
     ctx.moveTo(boardPadding + i * cellSize, boardPadding);
     ctx.lineTo(boardPadding + i * cellSize, canvas.height - boardPadding);
     ctx.stroke();
    }

    // Star Points (Hoshi)
    const hoshiPoints = getHoshiPoints(boardSize);
    ctx.fillStyle = '#4a2e13';
    for (let hp of hoshiPoints) {
     const x = boardPadding + hp.c * cellSize;
     const y = boardPadding + hp.r * cellSize;
     ctx.beginPath();
     ctx.arc(x, y, Math.max(3, cellSize * 0.08), 0, Math.PI * 2);
     ctx.fill();
    }

    // Draw Stones
    for (let r = 0; r < boardSize; r++) {
     for (let c = 0; c < boardSize; c++) {
      if (board[r][c] !== EMPTY) {
       drawStone(r, c, board[r][c]);
      }
     }
    }

    // Highlight Last Move
    if (lastMove && board[lastMove.r][lastMove.c] !== EMPTY) {
     const x = boardPadding + lastMove.c * cellSize;
     const y = boardPadding + lastMove.r * cellSize;
     ctx.strokeStyle = board[lastMove.r][lastMove.c] === BLACK ? '#f59e0b' : '#d97706';
     ctx.lineWidth = 3;
     ctx.beginPath();
     ctx.arc(x, y, cellSize * 0.25, 0, Math.PI * 2);
     ctx.stroke();
    }
   }

   // Get Hoshi positions according to board size
   function getHoshiPoints(size) {
    if (size === 9) {
     return [
      { r: 2, c: 2 }, { r: 2, c: 6 }, { r: 4, c: 4 },
      { r: 6, c: 2 }, { r: 6, c: 6 }
     ];
    } else if (size === 13) {
     return [
      { r: 3, c: 3 }, { r: 3, c: 9 }, { r: 6, c: 6 },
      { r: 9, c: 3 }, { r: 9, c: 9 }
     ];
    } else if (size === 19) {
     return [
      { r: 3, c: 3 }, { r: 3, c: 9 }, { r: 3, c: 15 },
      { r: 9, c: 3 }, { r: 9, c: 9 }, { r: 9, c: 15 },
      { r: 15, c: 3 }, { r: 15, c: 9 }, { r: 15, c: 15 }
     ];
    }
    return [];
   }

   // Render individual Realistic 3D-styled Go Stone
   function drawStone(r, c, color) {
    const x = boardPadding + c * cellSize;
    const y = boardPadding + r * cellSize;
    const radius = cellSize * 0.46;

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);

    // Shadow
    ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;

    // Radial gradient for 3D sphere look
    const grad = ctx.createRadialGradient(
     x - radius * 0.3, y - radius * 0.3, radius * 0.1,
     x, y, radius
    );

    if (color === BLACK) {
     grad.addColorStop(0, '#555');
     grad.addColorStop(0.7, '#111');
     grad.addColorStop(1, '#000');
    } else {
     grad.addColorStop(0, '#ffffff');
     grad.addColorStop(0.8, '#e0e0e0');
     grad.addColorStop(1, '#b0b0b0');
    }

    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
   }

   // Handle Board Clicks / Touch
   canvas.addEventListener('click', (e) => {
    if (gameOver || isAiThinking) return;
    if (currentTurn !== humanPlayer) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    // Convert canvas pixel coordinates to board row/col
    const c = Math.round((clickX - boardPadding) / cellSize);
    const r = Math.round((clickY - boardPadding) / cellSize);

    if (inBounds(r, c)) {
     playStone(r, c);
    }
   });

   // UI Update Helper
   function updateUI() {
    document.getElementById('captures-black').innerText = captures[BLACK];
    document.getElementById('captures-white').innerText = captures[WHITE];
    document.getElementById('move-counter').innerText = `手数: ${history.length}手`;

    const isBlackTurn = currentTurn === BLACK;
    document.getElementById('indicator-black').classList.toggle('hidden', !isBlackTurn);
    document.getElementById('indicator-white').classList.toggle('hidden', isBlackTurn);

    updateStatusText(isBlackTurn ? "黒番（先手）の番です" : "白番（後手）の番です");
   }

   function updateStatusText(text) {
    document.getElementById('status-badge').innerText = text;
   }

   // Settings Modal Interaction
   const settingsModal = document.getElementById('modal-settings');
   document.getElementById('btn-settings').addEventListener('click', () => {
    settingsModal.classList.remove('hidden');
   });
   document.getElementById('btn-close-settings').addEventListener('click', () => {
    settingsModal.classList.add('hidden');
   });

   // Toggle buttons in Settings
   document.querySelectorAll('.btn-size').forEach(btn => {
    btn.addEventListener('click', (e) => {
     document.querySelectorAll('.btn-size').forEach(b => {
      b.classList.remove('bg-amber-500', 'text-white', 'border-amber-600');
      b.classList.add('bg-white', 'text-slate-700');
     });
     e.target.classList.add('bg-amber-500', 'text-white', 'border-amber-600');
     e.target.classList.remove('bg-white', 'text-slate-700');
    });
   });

   document.querySelectorAll('.btn-diff').forEach(btn => {
    btn.addEventListener('click', (e) => {
     document.querySelectorAll('.btn-diff').forEach(b => {
      b.classList.remove('bg-amber-500', 'text-white', 'border-amber-600');
      b.classList.add('bg-white', 'text-slate-700');
     });
     e.target.classList.add('bg-amber-500', 'text-white', 'border-amber-600');
     e.target.classList.remove('bg-white', 'text-slate-700');
    });
   });

   document.querySelectorAll('.btn-color').forEach(btn => {
    btn.addEventListener('click', (e) => {
     document.querySelectorAll('.btn-color').forEach(b => {
      b.classList.remove('bg-amber-500', 'text-white', 'border-amber-600');
      b.classList.add('bg-white', 'text-slate-700');
     });
     const target = e.target.closest('.btn-color');
     target.classList.add('bg-amber-500', 'text-white', 'border-amber-600');
     target.classList.remove('bg-white', 'text-slate-700');
    });
   });

   // Apply Settings and Start New Game
   document.getElementById('btn-apply-settings').addEventListener('click', () => {
    const sizeBtn = document.querySelector('.btn-size.bg-amber-500');
    const diffBtn = document.querySelector('.btn-diff.bg-amber-500');
    const colorBtn = document.querySelector('.btn-color.bg-amber-500');

    boardSize = parseInt(sizeBtn.dataset.size);
    difficulty = diffBtn.dataset.diff;
    humanPlayer = colorBtn.dataset.color === 'black' ? BLACK : WHITE;
    aiPlayer = humanPlayer === BLACK ? WHITE : BLACK;

    // Player names UI
    if (humanPlayer === BLACK) {
     document.getElementById('name-black').innerText = "あなた (黒)";
     document.getElementById('name-white').innerText = `CPU [${getDiffText(difficulty)}] (白)`;
    } else {
     document.getElementById('name-black').innerText = `CPU [${getDiffText(difficulty)}] (黒)`;
     document.getElementById('name-white').innerText = "あなた (白)";
    }

    settingsModal.classList.add('hidden');
    initGame();
   });

   function getDiffText(d) {
    if (d === 'easy') return '初級';
    if (d === 'medium') return '中級';
    return '上級';
   }

   // Action Buttons
   document.getElementById('btn-pass').addEventListener('click', passTurn);
   document.getElementById('btn-undo').addEventListener('click', undoMove);
   document.getElementById('btn-resign').addEventListener('click', resignGame);
   document.getElementById('btn-score').addEventListener('click', () => {
    const scores = calculateScores();
    alert(`【形勢判断】\n黒の地+アゲハマ: ${scores.blackTotal}目\n白の地+アゲハマ+コミ: ${scores.whiteTotal}目\n\n現在: ${scores.blackTotal > scores.whiteTotal ? '黒' : '白'}が約${scores.margin}目リード`);
   });

   // Sound Toggle
   document.getElementById('btn-sound').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    const icon = document.getElementById('icon-sound');
    if (soundEnabled) {
     icon.className = 'fa-solid fa-volume-high text-lg';
    } else {
     icon.className = 'fa-solid fa-volume-xmark text-lg text-slate-400';
    }
   });

   // Game Restart Button
   document.getElementById('btn-restart-game').addEventListener('click', () => {
    document.getElementById('modal-result').classList.add('hidden');
    initGame();
   });

   // Resize Event Listener
   window.addEventListener('resize', resizeCanvas);

   // Start Game on Page Load
   window.onload = () => {
    initGame();
   };
  </script>
 </body>
