<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web 囲碁 (9路盤)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

   body {
    font-family: 'Noto Sans JP', sans-serif;
    background-color: #f3f4f6;
    touch-action: manipulation;
    /* スマホでのダブルタップズーム防止 */
    -webkit-tap-highlight-color: transparent;
   }

   /* 碁盤の質感 */
   #go-board {
    background-color: #dcb35c;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.05' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.1), inset 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 4px;
    max-width: 100%;
    display: block;
    margin: 0 auto;
   }

   /* カスタムスクロールバー等 */
   .btn-game {
    transition: all 0.2s;
   }

   .btn-game:active {
    transform: translateY(2px);
   }
  </style>
 </head>
 <body class="min-h-screen flex flex-col items-center py-6 px-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-xl overflow-hidden">
   <div class="bg-slate-800 text-white py-4 px-6 text-center relative">
    <h1 class="text-2xl font-bold tracking-wider">囲碁 <span class="text-sm font-normal text-slate-300 ml-2">9路盤</span>
    </h1>
   </div>

   <div class="p-4 md:p-6 flex flex-col gap-4">

    <!-- ステータス・スコア表示 -->
    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
     <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-full bg-black shadow-inner flex items-center justify-center border border-gray-700">
      </div>
      <div class="flex flex-col">
       <span class="text-xs text-gray-500 font-bold">あなた (黒)</span>
       <span id="player-captures" class="text-sm font-bold">アゲハマ: 0</span>
      </div>
     </div>

     <div class="text-center">
      <div id="turn-indicator" class="text-sm font-bold px-3 py-1 bg-blue-100 text-blue-800 rounded-full animate-pulse">
       黒の番です
      </div>
     </div>

     <div class="flex items-center gap-2">
      <div class="flex flex-col text-right">
       <span class="text-xs text-gray-500 font-bold">CPU (白)</span>
       <span id="cpu-captures" class="text-sm font-bold">アゲハマ: 0</span>
      </div>
      <div class="w-6 h-6 rounded-full bg-white shadow-inner flex items-center justify-center border border-gray-300">
      </div>
     </div>
    </div>

    <!-- メッセージエリア -->
    <div id="message-box"
     class="h-8 flex items-center justify-center text-sm font-bold text-slate-700 bg-amber-50 rounded border border-amber-200 transition-opacity duration-300">
     対局を開始します。黒番（あなた）からどうぞ。
    </div>

    <!-- 碁盤キャンバス -->
    <div class="w-full relative touch-none">
     <canvas id="go-board" width="400" height="400"></canvas>

     <!-- 結果オーバーレイ -->
     <div id="result-overlay"
      class="absolute inset-0 bg-black/70 hidden flex-col items-center justify-center rounded text-white z-10 backdrop-blur-sm">
      <h2 class="text-3xl font-bold mb-2">終局</h2>
      <p id="result-text" class="text-lg mb-6 text-center px-4"></p>
      <button onclick="resetGame()"
       class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-lg btn-game">
       もう一度遊ぶ
      </button>
     </div>
    </div>

    <!-- コントロールパネル -->
    <div class="grid grid-cols-2 gap-3 mt-2">
     <div class="col-span-2 flex justify-between items-center bg-gray-50 p-2 rounded border">
      <span class="text-sm font-bold text-gray-700 ml-2">CPUの強さ:</span>
      <div class="flex gap-1">
       <button onclick="setDifficulty('easy')" id="diff-easy"
        class="px-3 py-1 text-xs font-bold rounded bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">弱い</button>
       <button onclick="setDifficulty('normal')" id="diff-normal"
        class="px-3 py-1 text-xs font-bold rounded bg-blue-500 text-white shadow transition-colors">普通</button>
       <button onclick="setDifficulty('hard')" id="diff-hard"
        class="px-3 py-1 text-xs font-bold rounded bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">強い</button>
      </div>
     </div>

     <button onclick="playerPass()" id="btn-pass"
      class="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-bold py-3 rounded-lg shadow-sm btn-game text-sm flex items-center justify-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
      </svg>
      パスする
     </button>
     <button onclick="resetGame()"
      class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-bold py-3 rounded-lg shadow-sm btn-game text-sm flex items-center justify-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
       </path>
      </svg>
      はじめから
     </button>
    </div>

    <div class="text-xs text-gray-400 mt-2 text-center">
     ※中国ルール（陣地＋生き石の数）で簡易判定します。<br>
     ※双方がパスをすると終局（判定）となります。
    </div>
   </div>
  </div>

  <script>
   const canvas = document.getElementById('go-board');
   const ctx = canvas.getContext('2d');

   // 囲碁の定数
   const BOARD_SIZE = 9;
   const EMPTY = 0;
   const BLACK = 1;
   const WHITE = 2;

   // UI定数
   const MARGIN = 20; // キャンバスの余白
   let CELL_SIZE = 0; // 描画時のマス目のサイズ（レスポンシブ対応）

   // ゲーム状態
   let board = new Array(BOARD_SIZE * BOARD_SIZE).fill(EMPTY);
   let currentTurn = BLACK; // 1: プレイヤー(黒), 2: CPU(白)
   let playerCaptures = 0;
   let cpuCaptures = 0;
   let gameOver = false;
   let boardHistory = []; // コウ（Ko）判定用
   let consecutivePasses = 0;
   let difficulty = 'normal';
   let isProcessing = false; // 連続タップ防止

   // 難易度設定の初期化
   const difficulties = {
    'easy': { element: 'diff-easy' },
    'normal': { element: 'diff-normal' },
    'hard': { element: 'diff-hard' }
   };

   // UI要素
   const msgBox = document.getElementById('message-box');
   const turnIndicator = document.getElementById('turn-indicator');
   const pCapturesEl = document.getElementById('player-captures');
   const cCapturesEl = document.getElementById('cpu-captures');
   const resultOverlay = document.getElementById('result-overlay');
   const resultText = document.getElementById('result-text');


   // 画面リサイズ対応
   function resizeCanvas() {
    const container = canvas.parentElement;
    const size = Math.min(container.clientWidth, 500); // 最大500px

    // 高解像度ディスプレイ対応
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = `${size}px`;
    canvas.style.height = `${size}px`;

    ctx.scale(dpr, dpr);

    CELL_SIZE = (size - MARGIN * 2) / (BOARD_SIZE - 1);
    drawBoard();
   }

   window.addEventListener('resize', resizeCanvas);

   // 盤面描画
   function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 罫線を描画
    ctx.beginPath();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.2;

    for (let i = 0; i < BOARD_SIZE; i++) {
     const pos = MARGIN + i * CELL_SIZE;
     // 縦線
     ctx.moveTo(pos, MARGIN);
     ctx.lineTo(pos, MARGIN + (BOARD_SIZE - 1) * CELL_SIZE);
     // 横線
     ctx.moveTo(MARGIN, pos);
     ctx.lineTo(MARGIN + (BOARD_SIZE - 1) * CELL_SIZE, pos);
    }
    ctx.stroke();

    // 星（9路盤の場合、中心と四隅）を描画
    if (BOARD_SIZE === 9) {
     const starPoints = [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]];
     ctx.fillStyle = '#000000';
     starPoints.forEach(p => {
      ctx.beginPath();
      ctx.arc(MARGIN + p[0] * CELL_SIZE, MARGIN + p[1] * CELL_SIZE, 3, 0, 2 * Math.PI);
      ctx.fill();
     });
    }

    // 石を描画
    for (let y = 0; y < BOARD_SIZE; y++) {
     for (let x = 0; x < BOARD_SIZE; x++) {
      const idx = y * BOARD_SIZE + x;
      if (board[idx] !== EMPTY) {
       drawStone(x, y, board[idx]);
      }
     }
    }
   }

   // 石の描画（立体感を持たせる）
   function drawStone(x, y, color) {
    const cx = MARGIN + x * CELL_SIZE;
    const cy = MARGIN + y * CELL_SIZE;
    const radius = CELL_SIZE * 0.45; // 石の大きさ

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);

    // グラデーションで立体感を表現
    const gradient = ctx.createRadialGradient(
     cx - radius * 0.3, cy - radius * 0.3, radius * 0.1,
     cx, cy, radius
    );

    if (color === BLACK) {
     gradient.addColorStop(0, '#555');
     gradient.addColorStop(1, '#000');
     ctx.fillStyle = gradient;
    } else if (color === WHITE) {
     gradient.addColorStop(0, '#fff');
     gradient.addColorStop(1, '#ccc');
     ctx.fillStyle = gradient;
    }

    // 影を追加
    ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    ctx.fill();

    // 影をリセット
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // 境界線（白石は見やすくするため）
    if (color === WHITE) {
     ctx.lineWidth = 1;
     ctx.strokeStyle = '#999';
     ctx.stroke();
    }

    // 最新の手にはマークをつける（オプション）
    // 実装簡略化のため省略
   }


   // 座標からインデックスに変換
   function getIndex(x, y) {
    return y * BOARD_SIZE + x;
   }

   // 盤外判定
   function isOutOfBounds(x, y) {
    return x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE;
   }

   // 隣接する座標を取得
   function getNeighbors(x, y) {
    const neighbors = [];
    if (y > 0) neighbors.push([x, y - 1]);
    if (y < BOARD_SIZE - 1) neighbors.push([x, y + 1]);
    if (x > 0) neighbors.push([x - 1, y]);
    if (x < BOARD_SIZE - 1) neighbors.push([x + 1, y]);
    return neighbors;
   }

   // 連（繋がった石のグループ）と呼吸点（ダメ）を探索する
   function getGroupAndLiberties(x, y, currentBoard) {
    const color = currentBoard[getIndex(x, y)];
    if (color === EMPTY) return null;

    const group = new Set();
    const liberties = new Set();
    const queue = [[x, y]];
    const visited = new Set();

    group.add(getIndex(x, y));
    visited.add(getIndex(x, y));

    while (queue.length > 0) {
     const [cx, cy] = queue.shift();

     const neighbors = getNeighbors(cx, cy);
     for (const [nx, ny] of neighbors) {
      const nIdx = getIndex(nx, ny);
      const nColor = currentBoard[nIdx];

      if (nColor === EMPTY) {
       liberties.add(nIdx);
      } else if (nColor === color && !visited.has(nIdx)) {
       visited.add(nIdx);
       group.add(nIdx);
       queue.push([nx, ny]);
      }
     }
    }

    return {
     group: Array.from(group),
     liberties: Array.from(liberties)
    };
   }

   // 指定した盤面状態を文字列化（コウ判定用）
   function getBoardHash(b) {
    return b.join('');
   }

   // 石を置く処理（合法手かどうかのチェックと石の獲得を含む）
   // checkOnly=true の場合は状態を変更せず合法手かだけ返す
   function tryMove(x, y, color, currentBoard, checkOnly = false) {
    if (isOutOfBounds(x, y) || currentBoard[getIndex(x, y)] !== EMPTY) {
     return false; // すでに石があるか盤外
    }

    // 一時的に石を置く
    const testBoard = [...currentBoard];
    const idx = getIndex(x, y);
    testBoard[idx] = color;
    const opponentColor = color === BLACK ? WHITE : BLACK;

    let capturedStones = [];

    // 1. 敵石を取れるかチェック
    const neighbors = getNeighbors(x, y);
    for (const [nx, ny] of neighbors) {
     if (testBoard[getIndex(nx, ny)] === opponentColor) {
      const oppGroupInfo = getGroupAndLiberties(nx, ny, testBoard);
      if (oppGroupInfo && oppGroupInfo.liberties.length === 0) {
       // 敵の石を取れる
       capturedStones = capturedStones.concat(oppGroupInfo.group);
      }
     }
    }

    // 取れる石は盤面から取り除く
    for (const cIdx of capturedStones) {
     testBoard[cIdx] = EMPTY;
    }

    // 2. 自殺手（着手禁止点）のチェック
    // 敵石を取っておらず、かつ自分の呼吸点が0になる場合は自殺手
    if (capturedStones.length === 0) {
     const myGroupInfo = getGroupAndLiberties(x, y, testBoard);
     if (myGroupInfo && myGroupInfo.liberties.length === 0) {
      return false; // 自殺手
     }
    }

    // 3. コウ（同型反復）のチェック
    const newBoardHash = getBoardHash(testBoard);
    // 2手前の状態と同じならコウとみなす
    if (boardHistory.length >= 2 && boardHistory[boardHistory.length - 2] === newBoardHash) {
     return false; // コウ
    }

    if (checkOnly) {
     return { valid: true, captures: capturedStones.length, boardAfter: testBoard };
    }

    // 実際に盤面を更新
    board = testBoard;
    boardHistory.push(newBoardHash);
    // 履歴が長くなりすぎないように保持（最新10手程度で十分）
    if (boardHistory.length > 10) boardHistory.shift();

    return capturedStones.length; // 獲得した石の数を返す
   }


   // メッセージ表示
   function showMessage(msg, isError = false) {
    msgBox.textContent = msg;
    if (isError) {
     msgBox.classList.replace('bg-amber-50', 'bg-red-50');
     msgBox.classList.replace('text-slate-700', 'text-red-700');
     msgBox.classList.replace('border-amber-200', 'border-red-200');
     setTimeout(() => {
      msgBox.classList.replace('bg-red-50', 'bg-amber-50');
      msgBox.classList.replace('text-red-700', 'text-slate-700');
      msgBox.classList.replace('border-red-200', 'border-amber-200');
     }, 1500);
    }
   }

   // ターン更新UI
   function updateTurnUI() {
    if (currentTurn === BLACK) {
     turnIndicator.textContent = "あなた(黒)の番です";
     turnIndicator.className = "text-sm font-bold px-3 py-1 bg-gray-800 text-white rounded-full shadow";
    } else {
     turnIndicator.textContent = "CPU(白)が思考中...";
     turnIndicator.className = "text-sm font-bold px-3 py-1 bg-white text-gray-800 border border-gray-300 rounded-full shadow animate-pulse";
    }
    pCapturesEl.textContent = `アゲハマ: ${playerCaptures}`;
    cCapturesEl.textContent = `アゲハマ: ${cpuCaptures}`;
    drawBoard();
   }

   // プレイヤーのパス
   function playerPass() {
    if (gameOver || currentTurn !== BLACK || isProcessing) return;
    isProcessing = true;

    consecutivePasses++;
    showMessage("あなたはパスしました。");

    if (consecutivePasses >= 2) {
     endGame();
     return;
    }

    currentTurn = WHITE;
    updateTurnUI();

    setTimeout(cpuMove, 500); // CPUのターンへ
   }

   // キャンバスクリック/タップ処理
   canvas.addEventListener('click', (e) => {
    if (gameOver || currentTurn !== BLACK || isProcessing) return;

    const rect = canvas.getBoundingClientRect();
    // キャンバス内の相対座標（スケール考慮）
    const scaleX = canvas.width / (rect.width * (window.devicePixelRatio || 1));
    const scaleY = canvas.height / (rect.height * (window.devicePixelRatio || 1));

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    // 座標をグリッドインデックスに変換（マージンを引いてセルサイズで割る、四捨五入）
    let gridX = Math.round((x - MARGIN) / CELL_SIZE);
    let gridY = Math.round((y - MARGIN) / CELL_SIZE);

    // タップのブレを考慮して少し範囲を広げる
    if (gridX >= 0 && gridX < BOARD_SIZE && gridY >= 0 && gridY < BOARD_SIZE) {
     handlePlayerMove(gridX, gridY);
    }
   });

   function handlePlayerMove(x, y) {
    const captures = tryMove(x, y, BLACK, board);

    if (captures === false) {
     showMessage("そこには置けません（反則）", true);
     return;
    }

    // 合法手
    isProcessing = true;
    consecutivePasses = 0; // パスカウントリセット
    playerCaptures += captures;
    currentTurn = WHITE;
    showMessage("CPUの番です...");
    updateTurnUI();

    // CPUの思考時間を少し設ける（UI更新のため）
    setTimeout(cpuMove, Math.random() * 500 + 300);
   }


   // CPUの手を決定する
   function cpuMove() {
    if (gameOver) return;

    const validMoves = [];

    // すべての空きマスに対して評価を行う
    for (let y = 0; y < BOARD_SIZE; y++) {
     for (let x = 0; x < BOARD_SIZE; x++) {
      const result = tryMove(x, y, WHITE, board, true);
      if (result) {
       // 評価値を計算
       const score = evaluateMove(x, y, result, difficulty);
       validMoves.push({ x, y, score, captures: result.captures });
      }
     }
    }

    if (validMoves.length === 0) {
     // 合法手がない場合はパス
     consecutivePasses++;
     showMessage("CPUはパスしました。");
     if (consecutivePasses >= 2) {
      endGame();
      return;
     }
    } else {
     // スコアが高い順にソート
     validMoves.sort((a, b) => b.score - a.score);

     let bestMove = validMoves[0];

     // 難易度に応じた調整
     if (difficulty === 'easy') {
      // ランダムに手を選ぶ（上位80%から）
      const maxIdx = Math.max(1, Math.floor(validMoves.length * 0.8));
      bestMove = validMoves[Math.floor(Math.random() * maxIdx)];
     } else if (difficulty === 'normal') {
      // 時々上位3手からランダム（同じ展開を避ける）
      const maxIdx = Math.min(3, validMoves.length);
      if (Math.random() > 0.5) {
       bestMove = validMoves[Math.floor(Math.random() * maxIdx)];
      }
     }
     // hard は常に最高スコアを選択

     // もし最高スコアが極端に低く（マイナス）、パスの方がマシな場合（簡易的な終局判定）
     if (bestMove.score < -50 && difficulty !== 'easy') {
      consecutivePasses++;
      showMessage("CPUはパスしました。");
      if (consecutivePasses >= 2) {
       endGame();
       return;
      }
     } else {
      // 実際に手を打つ
      const captures = tryMove(bestMove.x, bestMove.y, WHITE, board);
      cpuCaptures += captures;
      consecutivePasses = 0;
      showMessage(`CPUが打機ました。あなたの番です。`);
     }
    }

    currentTurn = BLACK;
    isProcessing = false;
    updateTurnUI();
   }

   // 手の評価関数（AIのコア）
   function evaluateMove(x, y, moveResult, diffLevel) {
    let score = 0;
    const testBoard = moveResult.boardAfter;

    // 1. 石を取れる手は高評価
    score += moveResult.captures * 100;

    // 打った石のグループの呼吸点を確認
    const myGroup = getGroupAndLiberties(x, y, testBoard);
    const myLiberties = myGroup ? myGroup.liberties.length : 0;

    // 2. 自滅に近い手（呼吸点が1）は大きなマイナス（取れる場合は別）
    if (myLiberties === 1 && moveResult.captures === 0) {
     score -= 80;
    } else {
     score += myLiberties * 5; // 呼吸点が多いほど良い
    }

    // 強い難易度の場合の追加ヒューリスティクス
    if (diffLevel === 'hard' || diffLevel === 'normal') {
     // 3. 敵の石をアタリ（呼吸点1）にする手は高評価
     const neighbors = getNeighbors(x, y);
     for (const [nx, ny] of neighbors) {
      if (testBoard[getIndex(nx, ny)] === BLACK) {
       const enemyGroup = getGroupAndLiberties(nx, ny, testBoard);
       if (enemyGroup && enemyGroup.liberties.length === 1) {
        score += 50;
       }
      }
     }

     // 4. 自分のアタリを逃げる手は高評価
     // （打つ前に呼吸点1だった隣接する自分の石があれば、それを助けたことになる）
     let savedSelf = false;
     for (const [nx, ny] of neighbors) {
      if (board[getIndex(nx, ny)] === WHITE) {
       const preGroup = getGroupAndLiberties(nx, ny, board);
       if (preGroup && preGroup.liberties.length === 1 && myLiberties > 1) {
        score += 90; // 逃げ出し成功
        savedSelf = true;
       }
      }
     }

     // 5. 盤面の端へのペナルティ（序盤・中盤用）
     // 中央（4,4）からの距離で評価
     const distFromCenter = Math.abs(x - 4) + Math.abs(y - 4);
     if (diffLevel === 'hard') {
      score -= distFromCenter * 2;

      // 1線の価値は低い
      if (x === 0 || x === BOARD_SIZE - 1 || y === 0 || y === BOARD_SIZE - 1) {
       score -= 10;
      }
     }
    }

    // 少しランダム性を入れてAIの動きをばらけさせる
    score += Math.random() * 5;

    return score;
   }


   // 終局処理（中国ルールベースの簡易地合い計算）
   function endGame() {
    gameOver = true;
    isProcessing = true;

    let blackScore = playerCaptures; // アゲハマも加算（日本ルール寄りだが簡易化のため）
    let whiteScore = cpuCaptures;

    let blackTerritory = 0;
    let whiteTerritory = 0;

    // 簡易的な領地計算（Flood Fill）
    // 空きマスがどの色の石に囲まれているか判定する
    const visited = new Set();

    for (let y = 0; y < BOARD_SIZE; y++) {
     for (let x = 0; x < BOARD_SIZE; x++) {
      const idx = getIndex(x, y);

      if (board[idx] === BLACK) blackScore++;
      else if (board[idx] === WHITE) whiteScore++;
      else if (board[idx] === EMPTY && !visited.has(idx)) {
       // 空き地の探索
       const region = [];
       const queue = [[x, y]];
       let touchesBlack = false;
       let touchesWhite = false;

       visited.add(idx);
       region.push(idx);

       while (queue.length > 0) {
        const [cx, cy] = queue.shift();

        for (const [nx, ny] of getNeighbors(cx, cy)) {
         const nIdx = getIndex(nx, ny);
         const nColor = board[nIdx];

         if (nColor === BLACK) touchesBlack = true;
         else if (nColor === WHITE) touchesWhite = true;
         else if (nColor === EMPTY && !visited.has(nIdx)) {
          visited.add(nIdx);
          region.push(nIdx);
          queue.push([nx, ny]);
         }
        }
       }

       // 黒のみに囲まれていれば黒地
       if (touchesBlack && !touchesWhite) blackTerritory += region.length;
       // 白のみに囲まれていれば白地
       else if (touchesWhite && !touchesBlack) whiteTerritory += region.length;
      }
     }
    }

    blackScore += blackTerritory;
    whiteScore += whiteTerritory;

    // コミ（白にハンデ。9路盤なのでコミは少なめの5.5目とする）
    const komi = 5.5;
    whiteScore += komi;

    let resultMsg = `黒(あなた): ${blackScore}目<br>白(CPU): ${whiteScore}目 (コミ5.5含む)<br><br>`;

    if (blackScore > whiteScore) {
     resultMsg += `<span class="text-yellow-300 font-bold text-2xl">あなたの勝ち！</span>`;
    } else {
     resultMsg += `<span class="text-blue-300 font-bold text-2xl">CPUの勝ち</span>`;
    }

    resultText.innerHTML = resultMsg;
    resultOverlay.classList.remove('hidden');
    resultOverlay.classList.add('flex');

    showMessage("終局しました。");
   }

   // ゲームのリセット
   function resetGame() {
    board = new Array(BOARD_SIZE * BOARD_SIZE).fill(EMPTY);
    currentTurn = BLACK;
    playerCaptures = 0;
    cpuCaptures = 0;
    gameOver = false;
    boardHistory = [];
    consecutivePasses = 0;
    isProcessing = false;

    resultOverlay.classList.add('hidden');
    resultOverlay.classList.remove('flex');

    showMessage("対局を開始します。黒番（あなた）からどうぞ。");
    updateTurnUI();
   }

   // 難易度変更UI処理
   function setDifficulty(level) {
    difficulty = level;
    // UI更新
    Object.keys(difficulties).forEach(key => {
     const btn = document.getElementById(difficulties[key].element);
     if (key === level) {
      btn.classList.replace('bg-gray-200', 'bg-blue-500');
      btn.classList.replace('text-gray-700', 'text-white');
      btn.classList.add('shadow');
     } else {
      btn.classList.replace('bg-blue-500', 'bg-gray-200');
      btn.classList.replace('text-white', 'text-gray-700');
      btn.classList.remove('shadow');
     }
    });
    // 進行中ならリセットする
    resetGame();
   }

   // 初期化
   window.onload = () => {
    resizeCanvas();
    resetGame();
   };

  </script>
