<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>本格 Web将棋 - CPU対戦</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for UI Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tone.js for realistic audio effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <script>
   tailwind.config = {
    theme: {
     extend: {
      colors: {
       shogi: {
        wood: '#e4c489',
        woodDark: '#bd9653',
        border: '#5c4018',
        black: '#2b2118',
        highlight: 'rgba(234, 179, 8, 0.4)',
        lastmove: 'rgba(59, 130, 246, 0.35)',
        selected: 'rgba(34, 197, 94, 0.5)'
       }
      },
      fontFamily: {
       shogi: ['"Shippori Mincho"', '"Yu Mincho"', '"Hiragino Mincho ProN"', 'serif']
      }
     }
    }
   }
  </script>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');

   body {
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    background-color: #1a1816;
    color: #e5e7eb;
   }

   /* 盤面の木目調スタイル */
   .shogi-board {
    background: linear-gradient(135deg, #f3d498 0%, #d8ad63 100%);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 0, 0, 0.15);
   }

   .shogi-cell {
    border: 0.5px solid #6e4d20;
    position: relative;
   }

   /* 駒のデザイン */
   .piece {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    text-shadow: 0px 1px 1px rgba(255, 255, 255, 0.6);
    transition: transform 0.15s ease, background-color 0.15s ease;
   }

   .piece-gote {
    transform: rotate(180deg);
   }

   /* 持ち駒エリアの背景 */
   .komadai {
    background: linear-gradient(135deg, #3a2e22 0%, #251d15 100%);
    border: 1px solid #5a4836;
   }

   /* カスタムスクロールバー */
   ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
   }

   ::-webkit-scrollbar-track {
    background: #251d15;
   }

   ::-webkit-scrollbar-thumb {
    background: #5a4836;
    border-radius: 3px;
   }
  </style>
 </head>
 <body class="min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-stone-900 border-b border-stone-800 px-4 py-3 shadow-md">
   <div class="max-w-5xl mx-auto flex items-center justify-between">
    <div class="flex items-center space-x-3">
     <i class="fa-solid font-shogi text-amber-500 text-2xl">王</i>
     <h1 class="text-xl font-bold font-shogi tracking-wider text-amber-100">Web 将棋 AI</h1>
    </div>

    <div class="flex items-center space-x-2">
     <!-- Level Selector -->
     <div class="flex items-center bg-stone-800 rounded-lg p-1 border border-stone-700">
      <label class="text-xs text-stone-400 mr-2 ml-1 hidden sm:inline"><i class="fa-solid fa-brain mr-1"></i>強さ:</label>
      <select id="difficultySelect" onchange="changeDifficulty()"
       class="bg-stone-900 text-amber-200 text-xs sm:text-sm font-semibold rounded px-2 py-1 outline-none border border-stone-700 cursor-pointer">
       <option value="easy">初級 (かんたん)</option>
       <option value="medium" selected>中級 (ふつう)</option>
       <option value="hard">上級 (てごわい)</option>
      </select>
     </div>

     <button onclick="confirmNewGame()"
      class="bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg transition shadow flex items-center gap-1">
      <i class="fa-solid fa-rotate-right"></i>
      <span>対局やり直し</span>
     </button>
    </div>
   </div>
  </header>

  <!-- Main Content Container -->
  <main
   class="flex-1 max-w-5xl w-full mx-auto p-2 sm:p-4 flex flex-col lg:flex-row gap-4 items-center lg:items-start justify-center">

   <!-- Left / Top Panel: Game Info & Opponent Area -->
   <div class="w-full lg:w-72 flex flex-col gap-3 order-1">
    <!-- CPU Info Block -->
    <div class="komadai p-3 rounded-xl shadow-lg flex flex-col gap-2">
     <div class="flex items-center justify-between border-b border-stone-700 pb-2">
      <div class="flex items-center space-x-2">
       <div
        class="w-8 h-8 rounded-full bg-red-900/60 border border-red-500/50 flex items-center justify-center text-red-200">
        <i class="fa-solid fa-robot"></i>
       </div>
       <div>
        <div class="text-sm font-bold text-stone-200">CPU (後手)</div>
        <div id="cpuLevelTag" class="text-xs text-amber-400 font-medium">中級</div>
       </div>
      </div>
      <div id="cpuThinking" class="hidden flex items-center space-x-1.5 text-xs text-amber-400 animate-pulse">
       <i class="fa-solid fa-spinner fa-spin"></i>
       <span>思考中...</span>
      </div>
     </div>

     <!-- Gote (CPU) Stand/Komadai -->
     <div>
      <div class="text-xs text-stone-400 mb-1 flex justify-between">
       <span><i class="fa-solid fa-box-archive mr-1"></i>後手の持ち駒</span>
       <span id="goteHandCount" class="text-stone-500">0個</span>
      </div>
      <div id="goteKomadai"
       class="min-h-[50px] bg-stone-950/60 rounded-lg p-2 flex flex-wrap gap-1.5 items-center justify-start border border-stone-800/80">
       <!-- Dynamic captured pieces -->
      </div>
     </div>
    </div>

    <!-- Game Evaluation Bar -->
    <div class="bg-stone-900 border border-stone-800 rounded-xl p-3 shadow-lg">
     <div class="flex justify-between items-center text-xs text-stone-400 mb-1.5 font-semibold">
      <span><i class="fa-solid fa-scale-balanced mr-1"></i>形勢判断</span>
      <span id="evalScoreText" class="text-amber-400 font-mono">+0</span>
     </div>
     <div class="w-full bg-stone-800 h-3 rounded-full overflow-hidden flex border border-stone-700">
      <div id="evalBarGote" class="bg-red-600 h-full transition-all duration-500" style="width: 50%;"></div>
      <div id="evalBarSente" class="bg-amber-500 h-full transition-all duration-500" style="width: 50%;"></div>
     </div>
     <div class="flex justify-between text-[10px] text-stone-500 mt-1 font-mono">
      <span>CPU優勢</span>
      <span>互角</span>
      <span>あなた優勢</span>
     </div>
    </div>

    <!-- Action Controls (Desktop/Large Screen View) -->
    <div class="hidden lg:flex flex-col gap-2">
     <button onclick="undoMove()"
      class="w-full bg-stone-800 hover:bg-stone-700 border border-stone-700 text-stone-200 text-sm font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow">
      <i class="fa-solid fa-rotate-left text-amber-400"></i>
      <span>待った (1手戻す)</span>
     </button>
     <button onclick="resignGame()"
      class="w-full bg-stone-900 hover:bg-red-950/40 border border-red-900/50 text-red-400 text-sm font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-flag"></i>
      <span>投了する</span>
     </button>
    </div>
   </div>

   <!-- Center Panel: Main Shogi Board Grid -->
   <div class="flex flex-col items-center justify-center order-2">
    <!-- Numbers above grid (1~9) -->
    <div
     class="grid grid-cols-9 w-[320px] xs:w-[360px] sm:w-[432px] text-center text-xs font-bold text-amber-200/70 mb-1 font-mono">
     <div>9</div>
     <div>8</div>
     <div>7</div>
     <div>6</div>
     <div>5</div>
     <div>4</div>
     <div>3</div>
     <div>2</div>
     <div>1</div>
    </div>

    <div class="flex">
     <!-- Board Outer Border -->
     <div id="shogiBoard"
      class="shogi-board grid grid-cols-9 grid-rows-9 w-[320px] h-[320px] xs:w-[360px] xs:h-[360px] sm:w-[432px] sm:h-[432px] rounded-sm p-0.5 border-4 border-amber-950 relative">
      <!-- Board cells will be rendered dynamically -->
     </div>

     <!-- Row Labels (一~九) -->
     <div
      class="grid grid-rows-9 h-[320px] xs:h-[360px] sm:h-[432px] text-center text-xs font-bold text-amber-200/70 pl-1.5 font-shogi my-auto flex flex-col justify-around">
      <div>一</div>
      <div>二</div>
      <div>三</div>
      <div>四</div>
      <div>五</div>
      <div>六</div>
      <div>七</div>
      <div>八</div>
      <div>九</div>
     </div>
    </div>

    <!-- Mobile Action Bar (Visible under board on mobile) -->
    <div class="flex lg:hidden w-full max-w-[360px] sm:max-w-[432px] justify-between gap-2 mt-3">
     <button onclick="undoMove()"
      class="flex-1 bg-stone-800 hover:bg-stone-700 border border-stone-700 text-stone-200 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1 shadow">
      <i class="fa-solid fa-rotate-left text-amber-400"></i>
      <span>待った</span>
     </button>
     <button onclick="resignGame()"
      class="flex-1 bg-stone-900 hover:bg-red-950/40 border border-red-900/50 text-red-400 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
      <i class="fa-solid fa-flag"></i>
      <span>投了</span>
     </button>
    </div>
   </div>

   <!-- Right / Bottom Panel: Player Area & Move History -->
   <div class="w-full lg:w-72 flex flex-col gap-3 order-3">
    <!-- Sente (Player) Komadai -->
    <div class="komadai p-3 rounded-xl shadow-lg flex flex-col gap-2">
     <div class="flex items-center justify-between border-b border-stone-700 pb-2">
      <div class="flex items-center space-x-2">
       <div
        class="w-8 h-8 rounded-full bg-amber-700/60 border border-amber-500/50 flex items-center justify-center text-amber-200">
        <i class="fa-solid fa-user"></i>
       </div>
       <div>
        <div class="text-sm font-bold text-stone-200">あなた (先手)</div>
        <div id="turnIndicator" class="text-xs text-emerald-400 font-semibold">あなたの手番です</div>
       </div>
      </div>
     </div>

     <div>
      <div class="text-xs text-stone-400 mb-1 flex justify-between">
       <span><i class="fa-solid fa-box-archive mr-1"></i>あなたの持ち駒</span>
       <span id="senteHandCount" class="text-stone-500">0個</span>
      </div>
      <div id="senteKomadai"
       class="min-h-[50px] bg-stone-950/60 rounded-lg p-2 flex flex-wrap gap-1.5 items-center justify-start border border-stone-800/80">
       <!-- Dynamic captured pieces -->
      </div>
     </div>
    </div>

    <!-- Move History Log -->
    <div class="bg-stone-900 border border-stone-800 rounded-xl p-3 shadow-lg flex flex-col h-44">
     <div
      class="text-xs font-bold text-stone-400 mb-2 flex items-center justify-between border-b border-stone-800 pb-1">
      <span><i class="fa-solid fa-list-ol mr-1"></i>棋譜記録</span>
      <span id="moveCountText" class="text-stone-500 font-mono">0手</span>
     </div>
     <div id="historyList" class="flex-1 overflow-y-auto space-y-1 text-xs font-mono text-stone-300 pr-1">
      <div class="text-stone-600 text-center py-4">対局が開始されました</div>
     </div>
    </div>
   </div>

  </main>

  <!-- Promotion Modal -->
  <div id="promoteModal"
   class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
   <div
    class="bg-stone-900 border border-amber-600/50 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl animate-fade-in">
    <h3 class="text-lg font-bold font-shogi text-amber-200 mb-2">成りますか？</h3>
    <p class="text-xs text-stone-400 mb-6">敵陣に入りました。駒を成って強化できます。</p>
    <div class="flex gap-3 justify-center">
     <button id="btnPromoteYes"
      class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg">
      成る
     </button>
     <button id="btnPromoteNo"
      class="flex-1 bg-stone-800 hover:bg-stone-700 text-stone-300 font-bold py-2.5 rounded-xl text-sm transition border border-stone-700">
      成らない
     </button>
    </div>
   </div>
  </div>

  <!-- Game End Modal -->
  <div id="gameEndModal"
   class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-md">
   <div class="bg-stone-900 border border-stone-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl relative">
    <div id="gameEndIcon" class="text-5xl text-amber-500 mb-3">
     <i class="fa-solid fa-trophy"></i>
    </div>
    <h2 id="gameEndTitle" class="text-2xl font-extrabold font-shogi text-amber-100 mb-2">対局終了</h2>
    <p id="gameEndMessage" class="text-sm text-stone-300 mb-6">先手の勝ちです！</p>
    <button onclick="restartGame()"
     class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-bold py-3 rounded-xl shadow-lg transition">
     もう一度遊ぶ
    </button>
   </div>
  </div>

  <script>
   /**
    * SHOGI PIECE DEFINITIONS & CONSTANTS
    * Positive values: Sente (Player)
    * Negative values: Gote (CPU)
    */
   const EMPTY = 0;
   const FU = 1;   // 歩
   const KYO = 2;  // 香
   const KEI = 3;  // 桂
   const GIN = 4;  // 銀
   const KIN = 5;  // 金
   const KAKU = 6; // 角
   const HI = 7;   // 飛
   const OU = 8;   // 王/玉

   // 成り駒 (+8 offset)
   const TO = 9;   // と
   const NYO = 10; // 成香
   const NKEI = 11;// 成桂
   const NGIN = 12;// 成銀
   const UMA = 14; // 馬 (+8 from KAKU)
   const RYU = 15; // 龍 (+8 from HI)

   const SENTE = 1;
   const GOTE = -1;

   // 駒の表示用漢字
   const PIECE_NAMES = {
    [FU]: '歩', [KYO]: '香', [KEI]: '桂', [GIN]: '銀', [KIN]: '金',
    [KAKU]: '角', [HI]: '飛', [OU]: '玉',
    [TO]: 'と', [NYO]: '杏', [NKEI]: '圭', [NGIN]: '全',
    [UMA]: '馬', [RYU]: '龍'
   };

   // 駒の静的評価点 (AI用)
   const PIECE_VALUES = {
    [FU]: 100, [KYO]: 300, [KEI]: 400, [GIN]: 600, [KIN]: 700,
    [KAKU]: 850, [HI]: 1000, [OU]: 15000,
    [TO]: 700, [NYO]: 600, [NKEI]: 600, [NGIN]: 650,
    [UMA]: 1150, [RYU]: 1300
   };

   // アプリケーション状態
   let board = [];
   let senteHand = { [FU]: 0, [KYO]: 0, [KEI]: 0, [GIN]: 0, [KIN]: 0, [KAKU]: 0, [HI]: 0 };
   let goteHand = { [FU]: 0, [KYO]: 0, [KEI]: 0, [GIN]: 0, [KIN]: 0, [KAKU]: 0, [HI]: 0 };
   let currentTurn = SENTE; // 先手スタート
   let selectedCell = null; // {r, c} or {handType, owner}
   let legalMoves = [];
   let history = [];
   let lastMove = null;
   let difficulty = 'medium';
   let gameOver = false;

   // 音響合成 (Tone.js)
   let synth = null;
   function initAudio() {
    if (!synth) {
     synth = new Tone.MembraneSynth({
      pitchDecay: 0.05,
      octaves: 4,
      oscillator: { type: "sine" },
      envelope: { attack: 0.001, decay: 0.1, sustain: 0.01, release: 0.1 }
     }).toDestination();
     synth.volume.value = -6;
    }
   }

   function playKomaSound() {
    try {
     if (Tone.context.state !== 'running') {
      Tone.start();
     }
     initAudio();
     synth.triggerAttackRelease("C3", "8n");
    } catch (e) { }
   }

   // 初期盤面設定
   function createInitialBoard() {
    return [
     [-KYO, -KEI, -GIN, -KIN, -OU, -KIN, -GIN, -KEI, -KYO],
     [EMPTY, -HI, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, -KAKU, EMPTY],
     [-FU, -FU, -FU, -FU, -FU, -FU, -FU, -FU, -FU],
     [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
     [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
     [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
     [FU, FU, FU, FU, FU, FU, FU, FU, FU],
     [EMPTY, KAKU, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, HI, EMPTY],
     [KYO, KEI, GIN, KIN, OU, KIN, GIN, KEI, KYO]
    ];
   }

   function initGame() {
    board = createInitialBoard();
    senteHand = { [FU]: 0, [KYO]: 0, [KEI]: 0, [GIN]: 0, [KIN]: 0, [KAKU]: 0, [HI]: 0 };
    goteHand = { [FU]: 0, [KYO]: 0, [KEI]: 0, [GIN]: 0, [KIN]: 0, [KAKU]: 0, [HI]: 0 };
    currentTurn = SENTE;
    selectedCell = null;
    legalMoves = [];
    history = [];
    lastMove = null;
    gameOver = false;

    renderBoard();
    renderKomadai();
    updateUI();
   }

   function renderBoard() {
    const boardEl = document.getElementById('shogiBoard');
    boardEl.innerHTML = '';

    for (let r = 0; r < 9; r++) {
     for (let c = 0; c < 9; c++) {
      const pieceVal = board[r][c];
      const cell = document.createElement('div');
      cell.className = 'shogi-cell flex items-center justify-center cursor-pointer select-none relative';
      cell.dataset.row = r;
      cell.dataset.col = c;

      // 星（ドット）の追加 (3-3, 3-7, 7-3, 7-7)
      if ((r === 2 || r === 6) && (c === 2 || c === 6)) {
       const dot = document.createElement('div');
       dot.className = 'absolute w-1.5 h-1.5 bg-amber-950/40 rounded-full z-0 pointer-events-none';
       cell.appendChild(dot);
      }

      // ハイライト表示
      if (selectedCell && !selectedCell.isHand && selectedCell.r === r && selectedCell.c === c) {
       cell.classList.add('bg-emerald-500/40');
      } else if (lastMove && ((lastMove.toR === r && lastMove.toC === c) || (lastMove.fromR === r && lastMove.fromC === c))) {
       cell.classList.add('bg-blue-500/30');
      }

      // 移動可能マスのガイド表示
      const isLegal = legalMoves.some(m => m.toR === r && m.toC === c);
      if (isLegal) {
       const guide = document.createElement('div');
       guide.className = 'absolute w-3.5 h-3.5 bg-amber-600/70 rounded-full z-10 pointer-events-none animate-pulse';
       cell.appendChild(guide);
      }

      // 駒の描画
      if (pieceVal !== EMPTY) {
       const owner = pieceVal > 0 ? SENTE : GOTE;
       const type = Math.abs(pieceVal);
       const pieceEl = document.createElement('div');

       pieceEl.className = `piece text-lg xs:text-xl sm:text-2xl font-bold z-10 ${owner === GOTE ? 'piece-gote text-stone-900' : 'text-amber-950'
        } ${type >= TO ? 'text-red-700' : ''}`;

       pieceEl.innerText = PIECE_NAMES[type] || '';
       cell.appendChild(pieceEl);
      }

      cell.addEventListener('click', () => handleCellClick(r, c));
      boardEl.appendChild(cell);
     }
    }
   }

   function renderKomadai() {
    const senteEl = document.getElementById('senteKomadai');
    const goteEl = document.getElementById('goteKomadai');
    senteEl.innerHTML = '';
    goteEl.innerHTML = '';

    let senteCount = 0;
    let goteCount = 0;

    const handOrder = [HI, KAKU, KIN, GIN, KEI, KYO, FU];

    handOrder.forEach(type => {
     // 先手の持ち駒
     if (senteHand[type] > 0) {
      senteCount += senteHand[type];
      const item = document.createElement('div');
      item.className = `px-2 py-1 bg-amber-200/90 hover:bg-amber-100 text-amber-950 rounded border border-amber-400 font-shogi text-sm font-bold cursor-pointer flex items-center space-x-1 shadow ${selectedCell && selectedCell.isHand && selectedCell.owner === SENTE && selectedCell.type === type ? 'ring-2 ring-emerald-500 bg-amber-100' : ''
       }`;
      item.innerHTML = `<span>${PIECE_NAMES[type]}</span>${senteHand[type] > 1 ? `<span class="text-xs bg-amber-900 text-amber-100 rounded-full px-1.5 py-0.2">${senteHand[type]}</span>` : ''}`;
      item.addEventListener('click', (e) => {
       e.stopPropagation();
       handleHandClick(SENTE, type);
      });
      senteEl.appendChild(item);
     }

     // 後手の持ち駒
     if (goteHand[type] > 0) {
      goteCount += goteHand[type];
      const item = document.createElement('div');
      item.className = `px-2 py-1 bg-stone-300 text-stone-900 rounded border border-stone-400 font-shogi text-sm font-bold flex items-center space-x-1 shadow opacity-90`;
      item.innerHTML = `<span>${PIECE_NAMES[type]}</span>${goteHand[type] > 1 ? `<span class="text-xs bg-stone-800 text-stone-100 rounded-full px-1.5 py-0.2">${goteHand[type]}</span>` : ''}`;
      goteEl.appendChild(item);
     }
    });

    document.getElementById('senteHandCount').innerText = `${senteCount}個`;
    document.getElementById('goteHandCount').innerText = `${goteCount}個`;
   }

   function updateUI() {
    // 手番表示
    const turnEl = document.getElementById('turnIndicator');
    if (currentTurn === SENTE) {
     turnEl.innerText = "あなたの手番です";
     turnEl.className = "text-xs text-emerald-400 font-semibold";
    } else {
     turnEl.innerText = "CPU思考中...";
     turnEl.className = "text-xs text-amber-400 font-semibold";
    }

    // 評価値計算とバーの更新
    const score = evaluateBoard(board, senteHand, goteHand);
    const scoreText = score > 0 ? `+${score}` : `${score}`;
    document.getElementById('evalScoreText').innerText = scoreText;

    // バーの比率算出 (-3000 ~ +3000 の範囲でクランプ)
    const clamped = Math.max(-3000, Math.min(3000, score));
    const sentePercent = Math.round(((clamped + 3000) / 6000) * 100);
    document.getElementById('evalBarSente').style.width = `${sentePercent}%`;
    document.getElementById('evalBarGote').style.width = `${100 - sentePercent}%`;

    // 手数テキスト
    document.getElementById('moveCountText').innerText = `${history.length}手`;
   }

   function getRawMoves(bd, owner, sHand, gHand) {
    let moves = [];

    for (let r = 0; r < 9; r++) {
     for (let c = 0; c < 9; c++) {
      const piece = bd[r][c];
      if (piece === EMPTY || Math.sign(piece) !== owner) continue;

      const pType = Math.abs(piece);
      const isPromoted = pType >= TO;

      // 各駒の移動ロジック
      const directions = getDirections(pType, owner);

      directions.forEach(dir => {
       let step = 1;
       while (true) {
        const nr = r + dir.dr * step;
        const nc = c + dir.dc * step;

        if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9) break;

        const target = bd[nr][nc];
        if (target === EMPTY) {
         moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, isDrop: false });
        } else {
         if (Math.sign(target) !== owner) {
          moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, isDrop: false });
         }
         break; // 駒があれば突き抜け不可
        }

        if (!dir.slide) break; // スライド駒でなければ1マスのみ
        step++;
       }
      });
     }
    }

    // 持ち駒の打込み (Drops)
    const hand = owner === SENTE ? sHand : gHand;
    Object.keys(hand).forEach(pStr => {
     const pType = parseInt(pStr);
     if (hand[pType] > 0) {
      for (let r = 0; r < 9; r++) {
       for (let c = 0; c < 9; c++) {
        if (bd[r][c] === EMPTY) {
         // 行き所のない駒の制限（二歩、最奥段など）
         if (!isValidDrop(bd, owner, pType, r, c)) continue;
         moves.push({ fromR: null, fromC: null, toR: r, toC: c, isDrop: true, dropType: pType });
        }
       }
      }
     }
    });

    return moves;
   }

   // 行き所のない駒・二歩の確認
   function isValidDrop(bd, owner, pType, r, c) {
    // 一番奥の段への打込み制限
    if (pType === FU || pType === KYO) {
     if (owner === SENTE && r === 0) return false;
     if (owner === GOTE && r === 8) return false;
    }
    if (pType === KEI) {
     if (owner === SENTE && r <= 1) return false;
     if (owner === GOTE && r >= 7) return false;
    }

    // 二歩チェック
    if (pType === FU) {
     for (let row = 0; row < 9; row++) {
      if (bd[row][c] === owner * FU) {
       return false; // 同じ列に既に自分の歩がある
      }
     }
    }

    return true;
   }

   // 駒ごとの移動方向定義
   function getDirections(type, owner) {
    const fwd = owner === SENTE ? -1 : 1; // 前進方向

    const GOLD_DIRS = [
     { dr: fwd, dc: 0, slide: false }, { dr: fwd, dc: -1, slide: false }, { dr: fwd, dc: 1, slide: false },
     { dr: 0, dc: -1, slide: false }, { dr: 0, dc: 1, slide: false }, { dr: -fwd, dc: 0, slide: false }
    ];

    switch (type) {
     case FU:
      return [{ dr: fwd, dc: 0, slide: false }];
     case KYO:
      return [{ dr: fwd, dc: 0, slide: true }];
     case KEI:
      return [{ dr: fwd * 2, dc: -1, slide: false }, { dr: fwd * 2, dc: 1, slide: false }];
     case GIN:
      return [
       { dr: fwd, dc: 0, slide: false }, { dr: fwd, dc: -1, slide: false }, { dr: fwd, dc: 1, slide: false },
       { dr: -fwd, dc: -1, slide: false }, { dr: -fwd, dc: 1, slide: false }
      ];
     case KIN: case TO: case NYO: case NKEI: case NGIN:
      return GOLD_DIRS;
     case KAKU:
      return [
       { dr: -1, dc: -1, slide: true }, { dr: -1, dc: 1, slide: true },
       { dr: 1, dc: -1, slide: true }, { dr: 1, dc: 1, slide: true }
      ];
     case HI:
      return [
       { dr: -1, dc: 0, slide: true }, { dr: 1, dc: 0, slide: true },
       { dr: 0, dc: -1, slide: true }, { dr: 0, dc: 1, slide: true }
      ];
     case OU:
      return [
       { dr: -1, dc: -1, slide: false }, { dr: -1, dc: 0, slide: false }, { dr: -1, dc: 1, slide: false },
       { dr: 0, dc: -1, slide: false }, { dr: 0, dc: 1, slide: false },
       { dr: 1, dc: -1, slide: false }, { dr: 1, dc: 0, slide: false }, { dr: 1, dc: 1, slide: false }
      ];
     case UMA: // 角 + 王の上下左右
      return [
       { dr: -1, dc: -1, slide: true }, { dr: -1, dc: 1, slide: true },
       { dr: 1, dc: -1, slide: true }, { dr: 1, dc: 1, slide: true },
       { dr: -1, dc: 0, slide: false }, { dr: 1, dc: 0, slide: false },
       { dr: 0, dc: -1, slide: false }, { dr: 0, dc: 1, slide: false }
      ];
     case RYU: // 飛 + 王の斜め
      return [
       { dr: -1, dc: 0, slide: true }, { dr: 1, dc: 0, slide: true },
       { dr: 0, dc: -1, slide: true }, { dr: 0, dc: 1, slide: true },
       { dr: -1, dc: -1, slide: false }, { dr: -1, dc: 1, slide: false },
       { dr: 1, dc: -1, slide: false }, { dr: 1, dc: 1, slide: false }
      ];
     default:
      return [];
    }
   }

   function handleCellClick(r, c) {
    if (currentTurn !== SENTE || gameOver) return;

    const targetPiece = board[r][c];

    // 1. 既に駒または持ち駒を選択している場合
    if (selectedCell) {
     // 持ち駒からの打込み
     if (selectedCell.isHand) {
      const isLegal = legalMoves.some(m => m.toR === r && m.toC === c);
      if (isLegal) {
       executeMove({
        fromR: null, fromC: null,
        toR: r, toC: c,
        isDrop: true,
        dropType: selectedCell.type,
        owner: SENTE
       });
       clearSelection();
       return;
      }
     } else {
      // 盤上の移動
      const move = legalMoves.find(m => m.toR === r && m.toC === c);
      if (move) {
       // 成りの判定 (先手は敵陣0, 1, 2段目)
       const pType = Math.abs(board[selectedCell.r][selectedCell.c]);
       const canPromote = pType < TO && pType !== KIN && pType !== OU && (r <= 2 || selectedCell.r <= 2);
       const mustPromote = (pType === FU || pType === KYO) && r === 0 || (pType === KEI && r <= 1);

       if (mustPromote) {
        executeMove({ ...move, promote: true, owner: SENTE });
        clearSelection();
       } else if (canPromote) {
        showPromoteModal((promote) => {
         executeMove({ ...move, promote: promote, owner: SENTE });
         clearSelection();
        });
       } else {
        executeMove({ ...move, promote: false, owner: SENTE });
        clearSelection();
       }
       return;
      }
     }
    }

    // 2. 自分の駒を新しく選択する
    if (targetPiece > 0) { // SENTE
     selectedCell = { r, c, isHand: false };
     calculateLegalMovesForSelected();
     renderBoard();
    } else {
     clearSelection();
    }
   }

   function handleHandClick(owner, type) {
    if (currentTurn !== owner || gameOver) return;

    if (selectedCell && selectedCell.isHand && selectedCell.type === type) {
     clearSelection();
     return;
    }

    selectedCell = { isHand: true, owner, type };
    calculateLegalMovesForSelected();
    renderBoard();
    renderKomadai();
   }

   function clearSelection() {
    selectedCell = null;
    legalMoves = [];
    renderBoard();
    renderKomadai();
   }

   function calculateLegalMovesForSelected() {
    if (!selectedCell) {
     legalMoves = [];
     return;
    }

    const allMoves = getRawMoves(board, SENTE, senteHand, goteHand);

    if (selectedCell.isHand) {
     legalMoves = allMoves.filter(m => m.isDrop && m.dropType === selectedCell.type);
    } else {
     legalMoves = allMoves.filter(m => !m.isDrop && m.fromR === selectedCell.r && m.fromC === selectedCell.c);
    }
   }

   function executeMove(move) {
    playKomaSound();

    const record = {
     boardBefore: JSON.parse(JSON.stringify(board)),
     senteHandBefore: { ...senteHand },
     goteHandBefore: { ...goteHand },
     turn: currentTurn,
     move: move
    };
    history.push(record);
    lastMove = move;

    if (move.isDrop) {
     const hand = move.owner === SENTE ? senteHand : goteHand;
     hand[move.dropType]--;
     board[move.toR][move.toC] = move.owner * move.dropType;
    } else {
     let pieceVal = board[move.fromR][move.fromC];
     const captured = board[move.toR][move.toC];

     // 駒を取る処理
     if (captured !== EMPTY) {
      let capType = Math.abs(captured);
      if (capType >= TO) {
       capType = capType === UMA ? KAKU : (capType === RYU ? HI : capType - 8);
      }
      const hand = move.owner === SENTE ? senteHand : goteHand;
      hand[capType]++;
     }

     // 成り処理
     if (move.promote) {
      const pType = Math.abs(pieceVal);
      const newType = pType === KAKU ? UMA : (pType === HI ? RYU : pType + 8);
      pieceVal = move.owner * newType;
     }

     board[move.toR][move.toC] = pieceVal;
     board[move.fromR][move.fromC] = EMPTY;
    }

    // 棋譜ログ追加
    addHistoryLog(move);

    // 王が取られたか判定（対局終了）
    if (checkKingCaptured()) {
     endGame(currentTurn === SENTE ? "あなたの勝利です！" : "CPUの勝利です！");
     return;
    }

    // ターン交代
    currentTurn = currentTurn === SENTE ? GOTE : SENTE;
    updateUI();
    renderBoard();
    renderKomadai();

    // CPUの手番発動
    if (currentTurn === GOTE && !gameOver) {
     document.getElementById('cpuThinking').classList.remove('hidden');
     setTimeout(() => {
      makeCPUMove();
      document.getElementById('cpuThinking').classList.add('hidden');
     }, 300);
    }
   }

   function addHistoryLog(m) {
    const historyList = document.getElementById('historyList');
    if (history.length === 1) historyList.innerHTML = '';

    const senteSymbol = m.owner === SENTE ? '▲' : '▼';
    const colName = (9 - m.toC).toString();
    const rowNames = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const rowName = rowNames[m.toR];

    let pieceName = '';
    if (m.isDrop) {
     pieceName = PIECE_NAMES[m.dropType] + '打';
    } else {
     const origPiece = Math.abs(history[history.length - 1].boardBefore[m.fromR][m.fromC]);
     pieceName = PIECE_NAMES[origPiece];
     if (m.promote) pieceName += '成';
    }

    const moveText = `${history.length}. ${senteSymbol}${colName}${rowName}${pieceName}`;
    const logItem = document.createElement('div');
    logItem.className = "py-0.5 border-b border-stone-800/50 flex justify-between";
    logItem.innerHTML = `<span>${moveText}</span>`;
    historyList.appendChild(logItem);
    historyList.scrollTop = historyList.scrollHeight;
   }

   function showPromoteModal(callback) {
    const modal = document.getElementById('promoteModal');
    modal.classList.remove('hidden');

    const yesBtn = document.getElementById('btnPromoteYes');
    const noBtn = document.getElementById('btnPromoteNo');

    const onYes = () => {
     modal.classList.add('hidden');
     cleanup();
     callback(true);
    };
    const onNo = () => {
     modal.classList.add('hidden');
     cleanup();
     callback(false);
    };

    function cleanup() {
     yesBtn.removeEventListener('click', onYes);
     noBtn.removeEventListener('click', onNo);
    }

    yesBtn.addEventListener('click', onYes);
    noBtn.addEventListener('click', onNo);
   }

   function checkKingCaptured() {
    let senteKing = false;
    let goteKing = false;

    for (let r = 0; r < 9; r++) {
     for (let c = 0; c < 9; c++) {
      if (board[r][c] === OU) senteKing = true;
      if (board[r][c] === -OU) goteKing = true;
     }
    }
    return !senteKing || !goteKing;
   }

   // AI評価関数
   function evaluateBoard(bd, sHand, gHand) {
    let val = 0;

    for (let r = 0; r < 9; r++) {
     for (let c = 0; c < 9; c++) {
      const p = bd[r][c];
      if (p === EMPTY) continue;

      const type = Math.abs(p);
      const score = PIECE_VALUES[type] || 0;

      // 位置によるボーナス（盤中央や敵陣侵入）
      let positional = 0;
      if (type === FU || type === GIN) {
       positional = p > 0 ? (8 - r) * 10 : r * 10;
      }

      val += Math.sign(p) * (score + positional);
     }
    }

    // 持ち駒評価
    Object.keys(sHand).forEach(k => {
     val += sHand[k] * (PIECE_VALUES[k] * 1.1);
    });
    Object.keys(gHand).forEach(k => {
     val -= gHand[k] * (PIECE_VALUES[k] * 1.1);
    });

    return Math.round(val);
   }

   // CPU思考アルゴリズム
   function makeCPUMove() {
    if (gameOver) return;

    const moves = getRawMoves(board, GOTE, senteHand, goteHand);
    if (moves.length === 0) {
     endGame("CPUの指し手がありません。あなたの勝ちです！");
     return;
    }

    let bestMove = null;

    if (difficulty === 'easy') {
     // 初級: ランダム性が高く、王を取るか簡単な取り駒を優先
     const scoredMoves = moves.map(m => {
      let score = Math.random() * 200;
      const target = board[m.toR][m.toC];
      if (target !== EMPTY) score += Math.abs(target) * 50;
      return { move: m, score };
     });
     scoredMoves.sort((a, b) => b.score - a.score);
     bestMove = scoredMoves[0].move;
    } else if (difficulty === 'medium') {
     // 中級: 1手読み (Alpha-Beta 1階層) + 強い手判定
     bestMove = minimaxRoot(1);
    } else {
     // 上級: 2手読み (Alpha-Beta 2~3階層)
     bestMove = minimaxRoot(2);
    }

    // 成りの判定 (後手は0, 1, 2段目)
    let promote = false;
    if (!bestMove.isDrop) {
     const pType = Math.abs(board[bestMove.fromR][bestMove.fromC]);
     if (pType < TO && pType !== KIN && pType !== OU) {
      if (bestMove.toR >= 6 || bestMove.fromR >= 6) {
       promote = true; // CPUは成れる場合は基本的に成る
      }
     }
    }

    executeMove({ ...bestMove, promote, owner: GOTE });
   }

   function minimaxRoot(depth) {
    const moves = getRawMoves(board, GOTE, senteHand, goteHand);
    let bestVal = Infinity; // GOTE is minimizing
    let bestMove = moves[0];

    for (let i = 0; i < moves.length; i++) {
     const m = moves[i];
     // 王が取れる手があれば最優先
     if (!m.isDrop && board[m.toR][m.toC] === OU) {
      return m;
     }

     // 仮着手
     const tempBoard = JSON.parse(JSON.stringify(board));
     const tempSHand = { ...senteHand };
     const tempGHand = { ...goteHand };

     applyTempMove(tempBoard, tempSHand, tempGHand, m, GOTE);

     const val = alphaBeta(tempBoard, tempSHand, tempGHand, depth - 1, -Infinity, Infinity, true);

     if (val < bestVal) {
      bestVal = val;
      bestMove = m;
     }
    }
    return bestMove;
   }

   function alphaBeta(bd, sHand, gHand, depth, alpha, beta, isMaximizing) {
    if (depth === 0) {
     return evaluateBoard(bd, sHand, gHand);
    }

    if (isMaximizing) { // SENTE (Player)
     let maxEval = -Infinity;
     const moves = getRawMoves(bd, SENTE, sHand, gHand);
     for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      if (!m.isDrop && bd[m.toR][m.toC] === -OU) return 10000;

      const nb = JSON.parse(JSON.stringify(bd));
      const ns = { ...sHand };
      const ng = { ...gHand };
      applyTempMove(nb, ns, ng, m, SENTE);

      const evalVal = alphaBeta(nb, ns, ng, depth - 1, alpha, beta, false);
      maxEval = Math.max(maxEval, evalVal);
      alpha = Math.max(alpha, evalVal);
      if (beta <= alpha) break;
     }
     return maxEval;
    } else { // GOTE (CPU)
     let minEval = Infinity;
     const moves = getRawMoves(bd, GOTE, sHand, gHand);
     for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      if (!m.isDrop && bd[m.toR][m.toC] === OU) return -10000;

      const nb = JSON.parse(JSON.stringify(bd));
      const ns = { ...sHand };
      const ng = { ...gHand };
      applyTempMove(nb, ns, ng, m, GOTE);

      const evalVal = alphaBeta(nb, ns, ng, depth - 1, alpha, beta, true);
      minEval = Math.min(minEval, evalVal);
      beta = Math.min(beta, evalVal);
      if (beta <= alpha) break;
     }
     return minEval;
    }
   }

   function applyTempMove(bd, sHand, gHand, m, owner) {
    if (m.isDrop) {
     const hand = owner === SENTE ? sHand : gHand;
     hand[m.dropType]--;
     bd[m.toR][m.toC] = owner * m.dropType;
    } else {
     let p = bd[m.fromR][m.fromC];
     const cap = bd[m.toR][m.toC];
     if (cap !== EMPTY) {
      let capType = Math.abs(cap);
      if (capType >= TO) capType = capType === UMA ? KAKU : (capType === RYU ? HI : capType - 8);
      const hand = owner === SENTE ? sHand : gHand;
      hand[capType]++;
     }
     // デフォルト成り
     const pType = Math.abs(p);
     if (pType < TO && pType !== KIN && pType !== OU && ((owner === SENTE && m.toR <= 2) || (owner === GOTE && m.toR >= 6))) {
      p = owner * (pType === KAKU ? UMA : (pType === HI ? RYU : pType + 8));
     }
     bd[m.toR][m.toC] = p;
     bd[m.fromR][m.fromC] = EMPTY;
    }
   }

   function undoMove() {
    if (history.length === 0 || gameOver) return;

    // CPUの手番まで含めて2手戻す
    let targetState = null;
    if (history.length >= 2 && currentTurn === SENTE) {
     history.pop(); // CPU move
     targetState = history.pop(); // Player move
    } else if (history.length === 1) {
     targetState = history.pop();
    } else return;

    if (targetState) {
     board = JSON.parse(JSON.stringify(targetState.boardBefore));
     senteHand = { ...targetState.senteHandBefore };
     goteHand = { ...targetState.goteHandBefore };
     currentTurn = targetState.turn;
     lastMove = history.length > 0 ? history[history.length - 1].move : null;

     // 棋譜ログ更新
     const historyList = document.getElementById('historyList');
     if (history.length === 0) {
      historyList.innerHTML = '<div class="text-stone-600 text-center py-4">対局が開始されました</div>';
     } else {
      const children = Array.from(historyList.children);
      historyList.innerHTML = '';
      history.forEach(h => addHistoryLog(h.move));
     }

     clearSelection();
     updateUI();
    }
   }

   function changeDifficulty() {
    const select = document.getElementById('difficultySelect');
    difficulty = select.value;
    const labels = { easy: '初級', medium: '中級', hard: '上級' };
    document.getElementById('cpuLevelTag').innerText = labels[difficulty];
   }

   function confirmNewGame() {
    if (confirm("対局をやり直しますか？")) {
     initGame();
    }
   }

   function resignGame() {
    if (confirm("投了しますか？")) {
     endGame("投了しました。CPUの勝ちです。");
    }
   }

   function endGame(msg) {
    gameOver = true;
    document.getElementById('gameEndMessage').innerText = msg;
    document.getElementById('gameEndModal').classList.remove('hidden');
   }

   function restartGame() {
    document.getElementById('gameEndModal').classList.add('hidden');
    initGame();
   }

   // アプリ起動
   window.onload = function () {
    initGame();
   };
  </script>
