<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Gradius - Horizontal Shooter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   * {
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
   }

   body {
    background-color: #050508;
    color: #ffffff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
   }

   canvas {
    background-color: #000;
    display: block;
    box-shadow: 0 0 20px rgba(0, 230, 255, 0.2);
    touch-action: none;
   }

   .retro-border {
    border: 2px solid #00f0ff;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(0, 240, 255, 0.3);
   }

   .meter-box {
    transition: all 0.15s ease;
   }

   .meter-active {
    background-color: #ffaa00 !important;
    color: #000 !important;
    box-shadow: 0 0 12px #ffaa00;
    font-weight: bold;
    transform: scale(1.05);
   }

   .meter-has-power {
    border-color: #ffaa00;
   }

   .btn-touch {
    active: scale(0.95);
    -webkit-tap-highlight-color: transparent;
   }
  </style>
 </head>
 <body class="h-screen w-screen flex flex-col justify-between items-center p-2 select-none overflow-hidden">

  <!-- Top HUD Banner -->
  <div
   class="w-full max-w-4xl flex justify-between items-center bg-gray-900 border border-cyan-500/40 rounded-lg px-4 py-2 my-1 text-sm sm:text-base font-bold tracking-wider z-10">
   <div class="flex space-x-4">
    <div>1UP: <span id="scoreText" class="text-cyan-400">000000</span></div>
    <div>HIGH: <span id="highScoreText" class="text-yellow-400">010000</span></div>
   </div>
   <div class="flex space-x-4">
    <div>STAGE: <span id="stageText" class="text-green-400">1</span></div>
    <div>REST: <span id="livesText" class="text-red-400">♥♥♥</span></div>
   </div>
  </div>

  <!-- Game Canvas Wrapper -->
  <div class="relative flex-1 w-full max-w-4xl flex justify-center items-center my-1 overflow-hidden">
   <canvas id="gameCanvas" class="rounded-lg border border-cyan-900 w-full h-full object-contain"></canvas>

   <!-- Overlay Screen (Title / Game Over / Clear) -->
   <div id="overlay"
    class="absolute inset-0 bg-black/80 flex flex-col justify-center items-center text-center p-4 z-20">
    <h1 id="overlayTitle"
     class="text-4xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 mb-4 animate-pulse">
     VIC VIPER
    </h1>
    <p id="overlaySub" class="text-gray-300 mb-6 text-sm sm:text-lg max-w-md">
     グラディウス風横スクロールシューティング<br>
     カプセルを集めて自機をパワーアップせよ！
    </p>
    <button id="startBtn"
     class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg hover:shadow-cyan-500/50 transition duration-300 transform hover:-translate-y-1">
     GAME START
    </button>
    <div class="mt-6 text-xs text-gray-400 hidden md:block">
     [操作方法] Arrow/WASD: 移動 | Space/Z: ショット | X/Shift: パワーアップ
    </div>
   </div>
  </div>

  <!-- Power Up Meter Bar (Gradius Style Gauge) -->
  <div class="w-full max-w-4xl my-1 z-10">
   <div
    class="grid grid-cols-6 gap-1 bg-gray-950 p-1.5 rounded-lg border border-cyan-800 text-center text-xs sm:text-sm font-bold">
    <div id="m-0" class="meter-box py-1.5 rounded bg-gray-900 border border-gray-700 text-gray-400">SPEED</div>
    <div id="m-1" class="meter-box py-1.5 rounded bg-gray-900 border border-gray-700 text-gray-400">MISSILE</div>
    <div id="m-2" class="meter-box py-1.5 rounded bg-gray-900 border border-gray-700 text-gray-400">DOUBLE</div>
    <div id="m-3" class="meter-box py-1.5 rounded bg-gray-900 border border-gray-700 text-gray-400">LASER</div>
    <div id="m-4" class="meter-box py-1.5 rounded bg-gray-900 border border-gray-700 text-gray-400">OPTION</div>
    <div id="m-5" class="meter-box py-1.5 rounded bg-gray-900 border border-gray-700 text-gray-400">SHIELD</div>
   </div>
  </div>

  <!-- Mobile Controller (Touch Controls) -->
  <div class="w-full max-w-4xl flex justify-between items-center py-1 px-2 z-10 md:hidden">
   <!-- D-Pad Virtual Stick Area -->
   <div id="dpad"
    class="relative w-32 h-32 bg-gray-900/80 rounded-full border border-cyan-500/50 flex justify-center items-center touch-none">
    <div class="absolute w-10 h-10 bg-cyan-500/30 rounded-full border border-cyan-300 pointer-events-none"
     id="dpadStick"></div>
    <div class="text-cyan-400 text-xs pointer-events-none opacity-50">TOUCH MOVE</div>
   </div>

   <!-- Action Buttons -->
   <div class="flex space-x-3">
    <button id="btnPowerUp"
     class="btn-touch w-20 h-20 rounded-full bg-amber-600 active:bg-amber-400 text-white font-extrabold text-xs flex flex-col justify-center items-center border-2 border-amber-300 shadow-lg shadow-amber-900/50">
     <span>POWER</span>
     <span>UP</span>
    </button>
    <button id="btnShot"
     class="btn-touch w-24 h-24 rounded-full bg-cyan-600 active:bg-cyan-400 text-white font-extrabold text-sm flex justify-center items-center border-2 border-cyan-300 shadow-lg shadow-cyan-900/50">
     SHOT
    </button>
   </div>
  </div>

  <script>
   // Web Audio API Sound Synthesizer (No external audio assets)
   class SoundFX {
    constructor() {
     this.ctx = null;
    }
    init() {
     if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
     }
    }
    playLaser() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sawtooth';
     osc.frequency.setValueAtTime(800, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
     gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
     gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.15);
    }
    playShot() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'square';
     osc.frequency.setValueAtTime(600, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
     gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
     gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.08);
    }
    playExplosion() {
     if (!this.ctx) return;
     const bufferSize = this.ctx.sampleRate * 0.3;
     const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
     const data = buffer.getChannelData(0);
     for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
     }
     const noise = this.ctx.createBufferSource();
     noise.buffer = buffer;

     const filter = this.ctx.createBiquadFilter();
     filter.type = 'lowpass';
     filter.frequency.setValueAtTime(800, this.ctx.currentTime);
     filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);

     const gain = this.ctx.createGain();
     gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
     gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

     noise.connect(filter);
     filter.connect(gain);
     gain.connect(this.ctx.destination);
     noise.start();
    }
    playPowerItem() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sine';
     osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
     osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.06); // E5
     osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.12); // G5
     gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
     gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.2);
    }
    playPowerUp() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'triangle';
     osc.frequency.setValueAtTime(440, this.ctx.currentTime);
     osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.25);
     gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
     gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.25);
    }
    playWarning() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sawtooth';
     osc.frequency.setValueAtTime(300, this.ctx.currentTime);
     osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.3);
     gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.3);
    }
   }

   const sound = new SoundFX();

   const canvas = document.getElementById('gameCanvas');
   const ctx = canvas.getContext('2d');

   // Internal Game Resolution
   const GAME_WIDTH = 800;
   const GAME_HEIGHT = 450;
   canvas.width = GAME_WIDTH;
   canvas.height = GAME_HEIGHT;

   // Game States
   const STATE_TITLE = 0;
   const STATE_PLAYING = 1;
   const STATE_STAGE_CLEAR = 2;
   const STATE_GAMEOVER = 3;

   let gameState = STATE_TITLE;
   let score = 0;
   let highScore = 10000;
   let stage = 1;
   let lives = 3;
   let frameCount = 0;

   // Input States
   const keys = {};
   const touchInput = { x: 0, y: 0, shooting: false };

   // Power-Up Meter Items
   // 0: SPEED, 1: MISSILE, 2: DOUBLE, 3: LASER, 4: OPTION, 5: SHIELD
   let powerMeterIndex = -1;

   class Player {
    constructor() {
     this.reset();
    }
    reset() {
     this.x = 80;
     this.y = GAME_HEIGHT / 2;
     this.width = 32;
     this.height = 16;
     this.baseSpeed = 3.5;
     this.speedLevel = 0;
     this.hasMissile = false;
     this.weaponType = 'NORMAL'; // 'NORMAL', 'DOUBLE', 'LASER'
     this.optionsCount = 0;
     this.hasShield = false;
     this.shieldHP = 0;
     this.invulnerableTimer = 0;
     this.history = []; // Position history for Option followers
     this.lastShotFrame = 0;
    }

    get speed() {
     return this.baseSpeed + this.speedLevel * 1.2;
    }

    update() {
     // Invulnerablity flashing
     if (this.invulnerableTimer > 0) this.invulnerableTimer--;

     // Movement calculation
     let dx = 0;
     let dy = 0;

     if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
     if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
     if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
     if (keys['ArrowRight'] || keys['KeyD']) dx += 1;

     // Add Touch input
     dx += touchInput.x;
     dy += touchInput.y;

     // Normalize diagonal move
     if (dx !== 0 && dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len;
      dy /= len;
     }

     this.x += dx * this.speed;
     this.y += dy * this.speed;

     // Boundary Clamp
     this.x = Math.max(20, Math.min(GAME_WIDTH - 40, this.x));
     this.y = Math.max(20, Math.min(GAME_HEIGHT - 20, this.y));

     // Record position history for options (store last 60 frames)
     this.history.unshift({ x: this.x, y: this.y });
     if (this.history.length > 60) this.history.pop();
    }

    draw() {
     if (this.invulnerableTimer % 6 >= 3) return; // Flash effect

     ctx.save();
     ctx.translate(this.x, this.y);

     // Vic Viper Main Body Frame
     ctx.fillStyle = '#e0e0e0';
     ctx.beginPath();
     ctx.moveTo(18, 0);
     ctx.lineTo(-14, -10);
     ctx.lineTo(-8, 0);
     ctx.lineTo(-14, 10);
     ctx.closePath();
     ctx.fill();

     // Cockpit
     ctx.fillStyle = '#00f0ff';
     ctx.beginPath();
     ctx.ellipse(2, -2, 6, 3, 0, 0, Math.PI * 2);
     ctx.fill();

     // Blue Wings
     ctx.fillStyle = '#0066ff';
     ctx.fillRect(-10, -12, 12, 4);
     ctx.fillRect(-10, 8, 12, 4);

     // Engine Flame
     if (frameCount % 4 < 2) {
      ctx.fillStyle = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(-12, -3);
      ctx.lineTo(-22, 0);
      ctx.lineTo(-12, 3);
      ctx.closePath();
      ctx.fill();
     }

     // Shield Effect
     if (this.hasShield) {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(6, 0, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
      ctx.fill();
     }

     ctx.restore();

     // Draw Options
     for (let i = 1; i <= this.optionsCount; i++) {
      const delay = i * 12;
      if (this.history[delay]) {
       const optPos = this.history[delay];
       ctx.save();
       ctx.translate(optPos.x, optPos.y);
       ctx.fillStyle = '#ff3300';
       ctx.shadowColor = '#ff6600';
       ctx.shadowBlur = 10;
       ctx.beginPath();
       ctx.arc(0, 0, 7, 0, Math.PI * 2);
       ctx.fill();
       ctx.restore();
      }
     }
    }
   }

   class Bullet {
    constructor(x, y, vx, vy, type = 'NORMAL', isEnemy = false) {
     this.x = x;
     this.y = y;
     this.vx = vx;
     this.vy = vy;
     this.type = type; // 'NORMAL', 'DOUBLE', 'LASER', 'MISSILE', 'ENEMY'
     this.isEnemy = isEnemy;
     this.markedForDeletion = false;
     this.width = type === 'LASER' ? 40 : (type === 'MISSILE' ? 8 : 10);
     this.height = type === 'LASER' ? 6 : (type === 'MISSILE' ? 8 : 4);
    }

    update() {
     this.x += this.vx;
     this.y += this.vy;

     // Missile ground trajectory logic
     if (this.type === 'MISSILE') {
      this.vy += 0.15; // Gravity
      if (this.y >= GAME_HEIGHT - 35) {
       this.y = GAME_HEIGHT - 35;
       this.vy = 0;
       this.vx = 5; // Slide along terrain
      }
     }

     if (this.x < -50 || this.x > GAME_WIDTH + 50 || this.y < -50 || this.y > GAME_HEIGHT + 50) {
      this.markedForDeletion = true;
     }
    }

    draw() {
     ctx.save();
     if (this.isEnemy) {
      ctx.fillStyle = '#ff2255';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
      ctx.fill();
     } else if (this.type === 'LASER') {
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 12;
      ctx.fillRect(this.x, this.y - 3, 35, 6);
     } else if (this.type === 'MISSILE') {
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(this.x, this.y, 6, 4);
     } else {
      // Normal / Double
      ctx.fillStyle = '#ffff00';
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 6;
      ctx.fillRect(this.x, this.y - 2, 10, 4);
     }
     ctx.restore();
    }
   }

   class PowerCapsule {
    constructor(x, y) {
     this.x = x;
     this.y = y;
     this.vy = Math.sin(frameCount * 0.05) * 0.5;
     this.markedForDeletion = false;
    }
    update() {
     this.x -= 1.2;
     this.y += this.vy;
     if (this.x < -20) this.markedForDeletion = true;
    }
    draw() {
     ctx.save();
     ctx.fillStyle = '#ff0055';
     ctx.shadowColor = '#ff0055';
     ctx.shadowBlur = 10;
     ctx.beginPath();
     ctx.ellipse(this.x, this.y, 9, 5, 0, 0, Math.PI * 2);
     ctx.fill();
     ctx.fillStyle = '#ffffff';
     ctx.fillRect(this.x - 3, this.y - 2, 6, 4);
     ctx.restore();
    }
   }

   class Enemy {
    constructor(type, x, y) {
     this.type = type; // 'RED_FLYER', 'WALKER', 'TURRET', 'BOSS1'
     this.x = x;
     this.y = y;
     this.hp = type === 'TURRET' ? 3 : (type === 'BOSS1' ? 80 : 1);
     this.markedForDeletion = false;
     this.isRed = (type === 'RED_FLYER');
     this.timer = 0;
    }

    update() {
     this.timer++;
     if (this.type === 'RED_FLYER') {
      this.x -= 2.5;
      this.y += Math.sin(this.timer * 0.05) * 2;
     } else if (this.type === 'WALKER') {
      this.x -= 1.8;
     } else if (this.type === 'TURRET') {
      this.x -= 1.0; // Moves with terrain scroll
      // Turret fires aimed shot at player
      if (this.timer % 110 === 0 && this.x < GAME_WIDTH - 50 && this.x > 50) {
       const angle = Math.atan2(player.y - this.y, player.x - this.x);
       bullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 3.5, Math.sin(angle) * 3.5, 'ENEMY', true));
      }
     }

     if (this.x < -50) this.markedForDeletion = true;
    }

    draw() {
     ctx.save();
     ctx.translate(this.x, this.y);

     if (this.type === 'RED_FLYER') {
      ctx.fillStyle = '#ff0044';
      ctx.shadowColor = '#ff0044';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(-10, -8);
      ctx.lineTo(10, 0);
      ctx.lineTo(-10, 8);
      ctx.closePath();
      ctx.fill();
     } else if (this.type === 'WALKER') {
      ctx.fillStyle = '#9900ff';
      ctx.fillRect(-10, -8, 20, 16);
     } else if (this.type === 'TURRET') {
      ctx.fillStyle = '#00aa55';
      ctx.fillRect(-12, -8, 24, 16);
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(0, -2, 6, 0, Math.PI * 2);
      ctx.fill();
     }

     ctx.restore();
    }
   }

   class Boss {
    constructor() {
     this.x = GAME_WIDTH + 100;
     this.y = GAME_HEIGHT / 2;
     this.hp = 120;
     this.maxHp = 120;
     this.state = 'ENTERING'; // 'ENTERING', 'FIGHTING', 'DYING'
     this.timer = 0;
     this.coverHP = 30; // Destructible protective core covers
     this.markedForDeletion = false;
    }

    update() {
     this.timer++;

     if (this.state === 'ENTERING') {
      this.x -= 1.5;
      if (this.x <= GAME_WIDTH - 140) {
       this.state = 'FIGHTING';
      }
     } else if (this.state === 'FIGHTING') {
      // Hover Up and Down pattern
      this.y = GAME_HEIGHT / 2 + Math.sin(this.timer * 0.03) * 100;

      // Boss Attack Pattern
      if (this.timer % 90 === 0) {
       // Forward Lasers
       bullets.push(new Bullet(this.x - 40, this.y - 25, -6, 0, 'ENEMY', true));
       bullets.push(new Bullet(this.x - 40, this.y + 25, -6, 0, 'ENEMY', true));
      }

      if (this.timer % 140 === 0) {
       // Radial Aimed Spread
       const baseAngle = Math.atan2(player.y - this.y, player.x - this.x);
       for (let a = -0.3; a <= 0.3; a += 0.3) {
        bullets.push(new Bullet(this.x - 30, this.y, Math.cos(baseAngle + a) * 4, Math.sin(baseAngle + a) * 4, 'ENEMY', true));
       }
      }
     }
    }

    draw() {
     ctx.save();
     ctx.translate(this.x, this.y);

     // Boss Outer Hull (Big Core Inspired)
     ctx.fillStyle = '#445577';
     ctx.strokeStyle = '#00ffff';
     ctx.lineWidth = 2;

     ctx.beginPath();
     ctx.moveTo(-50, -50);
     ctx.lineTo(60, -30);
     ctx.lineTo(60, 30);
     ctx.lineTo(-50, 50);
     ctx.lineTo(-20, 0);
     ctx.closePath();
     ctx.fill();
     ctx.stroke();

     // Upper and Lower Laser Cannon Mounts
     ctx.fillStyle = '#8899bb';
     ctx.fillRect(-60, -32, 30, 12);
     ctx.fillRect(-60, 20, 30, 12);

     // Core Shields / Covers (Destructible Front Barrier)
     if (this.coverHP > 0) {
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(-35, -15, 8, 30);
     }

     // Core Weak Point (Blue Orb)
     ctx.fillStyle = '#00f0ff';
     ctx.shadowColor = '#00f0ff';
     ctx.shadowBlur = 15;
     ctx.beginPath();
     ctx.arc(-10, 0, 12, 0, Math.PI * 2);
     ctx.fill();

     ctx.restore();

     // Draw Health Bar at Top
     ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
     ctx.fillRect(GAME_WIDTH / 2 - 100, 15, 200, 8);
     ctx.fillStyle = '#00ff88';
     ctx.fillRect(GAME_WIDTH / 2 - 100, 15, (this.hp / this.maxHp) * 200, 8);
    }
   }

   class Particle {
    constructor(x, y, color) {
     this.x = x;
     this.y = y;
     this.vx = (Math.random() - 0.5) * 6;
     this.vy = (Math.random() - 0.5) * 6;
     this.color = color || '#ff5500';
     this.life = 1.0;
     this.decay = Math.random() * 0.04 + 0.02;
     this.size = Math.random() * 4 + 2;
    }
    update() {
     this.x += this.vx;
     this.y += this.vy;
     this.life -= this.decay;
    }
    draw() {
     ctx.save();
     ctx.globalAlpha = Math.max(0, this.life);
     ctx.fillStyle = this.color;
     ctx.beginPath();
     ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
    }
   }

   // Global Objects
   const player = new Player();
   let bullets = [];
   let enemies = [];
   let capsules = [];
   let particles = [];
   let boss = null;
   let warningTimer = 0;

   function fireWeapon() {
    if (gameState !== STATE_PLAYING) return;

    const now = frameCount;
    if (now - player.lastShotFrame < (player.weaponType === 'LASER' ? 10 : 8)) return;
    player.lastShotFrame = now;

    sound.playShot();

    // Main Ship Shot
    spawnBulletPattern(player.x + 18, player.y);

    // Options Shot
    for (let i = 1; i <= player.optionsCount; i++) {
     const delay = i * 12;
     if (player.history[delay]) {
      spawnBulletPattern(player.history[delay].x, player.history[delay].y);
     }
    }
   }

   function spawnBulletPattern(x, y) {
    if (player.weaponType === 'LASER') {
     sound.playLaser();
     bullets.push(new Bullet(x, y, 14, 0, 'LASER'));
    } else if (player.weaponType === 'DOUBLE') {
     bullets.push(new Bullet(x, y, 10, 0, 'NORMAL'));
     bullets.push(new Bullet(x, y, 8, -4, 'DOUBLE')); // Diagonal Up Shot
    } else {
     bullets.push(new Bullet(x, y, 10, 0, 'NORMAL'));
    }

    if (player.hasMissile) {
     bullets.push(new Bullet(x, y + 4, 4, 3, 'MISSILE'));
    }
   }

   function activatePowerUp() {
    if (powerMeterIndex < 0 || gameState !== STATE_PLAYING) return;

    sound.playPowerUp();

    switch (powerMeterIndex) {
     case 0: // SPEED
      if (player.speedLevel < 4) player.speedLevel++;
      break;
     case 1: // MISSILE
      player.hasMissile = true;
      break;
     case 2: // DOUBLE
      player.weaponType = 'DOUBLE';
      break;
     case 3: // LASER
      player.weaponType = 'LASER';
      break;
     case 4: // OPTION
      if (player.optionsCount < 3) player.optionsCount++;
      break;
     case 5: // SHIELD
      player.hasShield = true;
      player.shieldHP = 3;
      break;
    }

    powerMeterIndex = -1;
    updatePowerMeterUI();
   }

   function advancePowerMeter() {
    sound.playPowerItem();
    powerMeterIndex = (powerMeterIndex + 1) % 6;
    updatePowerMeterUI();
   }

   function updatePowerMeterUI() {
    for (let i = 0; i < 6; i++) {
     const el = document.getElementById(`m-${i}`);
     if (i === powerMeterIndex) {
      el.classList.add('meter-active');
     } else {
      el.classList.remove('meter-active');
     }
    }
   }

   function handleSpawning() {
    if (boss) return; // Stop wave spawning when boss is active

    // Stage 1 Wave Routine
    if (frameCount % 120 === 0 && frameCount < 1800) {
     // Red Flyer formation
     const startY = 80 + Math.random() * (GAME_HEIGHT - 160);
     for (let i = 0; i < 4; i++) {
      setTimeout(() => {
       if (gameState === STATE_PLAYING) {
        enemies.push(new Enemy('RED_FLYER', GAME_WIDTH + 20, startY));
       }
      }, i * 200);
     }
    }

    if (frameCount % 220 === 0 && frameCount < 1800) {
     // Turret on floor/ceiling
     const isCeiling = Math.random() < 0.5;
     const turretY = isCeiling ? 30 : GAME_HEIGHT - 30;
     enemies.push(new Enemy('TURRET', GAME_WIDTH + 20, turretY));
    }

    // Boss Trigger Frame
    if (frameCount === 1800) {
     sound.playWarning();
     warningTimer = 120;
     setTimeout(() => {
      boss = new Boss();
     }, 2000);
    }
   }

   function createExplosion(x, y, count = 12, color = '#ff6600') {
    sound.playExplosion();
    for (let i = 0; i < count; i++) {
     particles.push(new Particle(x, y, color));
    }
   }

   function checkCollisions() {
    // Player Bullet vs Enemy
    bullets.forEach(b => {
     if (b.isEnemy || b.markedForDeletion) return;

     enemies.forEach(e => {
      if (e.markedForDeletion) return;

      if (Math.abs(b.x - e.x) < 20 && Math.abs(b.y - e.y) < 16) {
       if (b.type !== 'LASER') b.markedForDeletion = true;
       e.hp--;

       if (e.hp <= 0) {
        e.markedForDeletion = true;
        createExplosion(e.x, e.y);
        score += e.isRed ? 200 : 100;

        if (e.isRed) {
         capsules.push(new PowerCapsule(e.x, e.y));
        }
       }
      }
     });

     // Bullet vs Boss
     if (boss && !boss.markedForDeletion) {
      if (Math.abs(b.x - boss.x) < 50 && Math.abs(b.y - boss.y) < 40) {
       if (b.type !== 'LASER') b.markedForDeletion = true;

       if (boss.coverHP > 0 && b.x < boss.x - 20) {
        boss.coverHP--;
        createExplosion(boss.x - 30, boss.y, 3, '#ffaa00');
       } else {
        boss.hp--;
        createExplosion(boss.x - 10, boss.y, 4, '#00ffff');
        if (boss.hp <= 0) {
         boss.markedForDeletion = true;
         createExplosion(boss.x, boss.y, 40, '#00ffff');
         score += 5000;
         setTimeout(stageClear, 1500);
        }
       }
      }
     }
    });

    // Player vs Capsules
    capsules.forEach(c => {
     if (Math.hypot(player.x - c.x, player.y - c.y) < 24) {
      c.markedForDeletion = true;
      advancePowerMeter();
     }
    });

    // Player vs Enemy / Bullets
    if (player.invulnerableTimer <= 0 && gameState === STATE_PLAYING) {
     // Check Enemy Bullets
     bullets.forEach(b => {
      if (!b.isEnemy || b.markedForDeletion) return;
      if (Math.hypot(player.x - b.x, player.y - b.y) < 12) {
       b.markedForDeletion = true;
       playerHit();
      }
     });

     // Check Enemies
     enemies.forEach(e => {
      if (Math.hypot(player.x - e.x, player.y - e.y) < 20) {
       playerHit();
      }
     });

     // Check Boss Body
     if (boss && Math.hypot(player.x - boss.x, player.y - boss.y) < 45) {
      playerHit();
     }
    }
   }

   function playerHit() {
    if (player.hasShield) {
     player.shieldHP--;
     sound.playExplosion();
     if (player.shieldHP <= 0) {
      player.hasShield = false;
     }
     player.invulnerableTimer = 30; // Brief grace period
     return;
    }

    createExplosion(player.x, player.y, 25, '#00ffff');
    lives--;
    updateHUD();

    if (lives <= 0) {
     gameOver();
    } else {
     player.reset();
     powerMeterIndex = -1;
     updatePowerMeterUI();
     player.invulnerableTimer = 120; // 2 seconds safety shield
    }
   }

   function stageClear() {
    gameState = STATE_STAGE_CLEAR;
    document.getElementById('overlayTitle').innerText = 'STAGE CLEAR!';
    document.getElementById('overlaySub').innerText = `Stage ${stage} Complete! Ready for the next zone?`;
    document.getElementById('startBtn').innerText = 'NEXT STAGE';
    document.getElementById('overlay').classList.remove('hidden');
   }

   function gameOver() {
    gameState = STATE_GAMEOVER;
    if (score > highScore) highScore = score;
    document.getElementById('overlayTitle').innerText = 'GAME OVER';
    document.getElementById('overlaySub').innerText = `Final Score: ${score}`;
    document.getElementById('startBtn').innerText = 'TRY AGAIN';
    document.getElementById('overlay').classList.remove('hidden');
   }

   function startGame() {
    if (gameState === STATE_GAMEOVER || gameState === STATE_TITLE) {
     score = 0;
     stage = 1;
     lives = 3;
    } else if (gameState === STATE_STAGE_CLEAR) {
     stage++;
    }

    frameCount = 0;
    bullets = [];
    enemies = [];
    capsules = [];
    particles = [];
    boss = null;

    player.reset();
    powerMeterIndex = -1;
    updatePowerMeterUI();
    updateHUD();

    document.getElementById('overlay').classList.add('hidden');
    gameState = STATE_PLAYING;
   }

   function updateHUD() {
    document.getElementById('scoreText').innerText = score.toString().padStart(6, '0');
    document.getElementById('highScoreText').innerText = highScore.toString().padStart(6, '0');
    document.getElementById('stageText').innerText = stage;
    document.getElementById('livesText').innerText = '♥'.repeat(Math.max(0, lives));
   }

   function drawBackground() {
    // Starfield Parallax Effect
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++) {
     const x = (i * 37 + frameCount * (i % 3 + 1)) % GAME_WIDTH;
     const y = (i * 97) % GAME_HEIGHT;
     const size = (i % 3) + 1;
     ctx.globalAlpha = 0.3 + (i % 5) * 0.15;
     ctx.fillRect(GAME_WIDTH - x, y, size, size);
    }
    ctx.globalAlpha = 1.0;

    // Mountain / Terrain Mesh at Top and Bottom
    ctx.fillStyle = '#111827';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 1.5;

    // Bottom Terrain
    ctx.beginPath();
    ctx.moveTo(0, GAME_HEIGHT);
    for (let x = 0; x <= GAME_WIDTH; x += 40) {
     const terrainHeight = Math.sin((x + frameCount * 1.5) * 0.01) * 20 + 35;
     ctx.lineTo(x, GAME_HEIGHT - terrainHeight);
    }
    ctx.lineTo(GAME_WIDTH, GAME_HEIGHT);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Top Terrain
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let x = 0; x <= GAME_WIDTH; x += 40) {
     const terrainHeight = Math.cos((x + frameCount * 1.5) * 0.01) * 15 + 25;
     ctx.lineTo(x, terrainHeight);
    }
    ctx.lineTo(GAME_WIDTH, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Warning Banner for Boss Encounter
    if (warningTimer > 0) {
     warningTimer--;
     if (Math.floor(frameCount / 10) % 2 === 0) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
      ctx.fillRect(0, GAME_HEIGHT / 2 - 40, GAME_WIDTH, 80);
      ctx.fillStyle = '#ff0044';
      ctx.font = 'bold 36px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('WARNING! BOSS APPROACHING', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
     }
    }
   }

   function gameLoop() {
    frameCount++;

    // Clear Screen
    ctx.fillStyle = '#05050d';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    drawBackground();

    if (gameState === STATE_PLAYING) {
     // Auto Fire continuous hold or Touch Shooting
     if (keys['Space'] || keys['KeyZ'] || touchInput.shooting) {
      fireWeapon();
     }

     handleSpawning();

     player.update();
     bullets.forEach(b => b.update());
     enemies.forEach(e => e.update());
     capsules.forEach(c => c.update());
     particles.forEach(p => p.update());
     if (boss) boss.update();

     checkCollisions();

     // Cleanup Deletions
     bullets = bullets.filter(b => !b.markedForDeletion);
     enemies = enemies.filter(e => !e.markedForDeletion);
     capsules = capsules.filter(c => !c.markedForDeletion);
     particles = particles.filter(p => p.life > 0);

     updateHUD();
    }

    // Draw Entities
    capsules.forEach(c => c.draw());
    enemies.forEach(e => e.draw());
    if (boss && !boss.markedForDeletion) boss.draw();
    bullets.forEach(b => b.draw());
    player.draw();
    particles.forEach(p => p.draw());

    requestAnimationFrame(gameLoop);
   }

   // Keyboard Controls
   window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyX' || e.code === 'ShiftLeft') {
     activatePowerUp();
    }
   });

   window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
   });

   // Touch Controls (Virtual D-Pad and Buttons)
   const dpad = document.getElementById('dpad');
   const stick = document.getElementById('dpadStick');
   const btnShot = document.getElementById('btnShot');
   const btnPowerUp = document.getElementById('btnPowerUp');

   let dpadActive = false;
   let dpadCenter = { x: 0, y: 0 };

   dpad.addEventListener('touchstart', (e) => {
    sound.init();
    dpadActive = true;
    const rect = dpad.getBoundingClientRect();
    dpadCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    handleDpadMove(e.touches[0]);
   });

   dpad.addEventListener('touchmove', (e) => {
    if (dpadActive) {
     handleDpadMove(e.touches[0]);
    }
   });

   const resetDpad = () => {
    dpadActive = false;
    touchInput.x = 0;
    touchInput.y = 0;
    stick.style.transform = `translate(0px, 0px)`;
   };

   dpad.addEventListener('touchend', resetDpad);
   dpad.addEventListener('touchcancel', resetDpad);

   function handleDpadMove(touch) {
    const dx = touch.clientX - dpadCenter.x;
    const dy = touch.clientY - dpadCenter.y;
    const dist = Math.hypot(dx, dy);
    const maxRadius = 40;

    const clampedDist = Math.min(dist, maxRadius);
    const angle = Math.atan2(dy, dx);

    const moveX = Math.cos(angle) * clampedDist;
    const moveY = Math.sin(angle) * clampedDist;

    stick.style.transform = `translate(${moveX}px, ${moveY}px)`;

    touchInput.x = moveX / maxRadius;
    touchInput.y = moveY / maxRadius;
   }

   btnShot.addEventListener('touchstart', (e) => {
    e.preventDefault();
    sound.init();
    touchInput.shooting = true;
    fireWeapon();
   });
   btnShot.addEventListener('touchend', () => { touchInput.shooting = false; });

   btnPowerUp.addEventListener('touchstart', (e) => {
    e.preventDefault();
    sound.init();
    activatePowerUp();
   });

   document.getElementById('startBtn').addEventListener('click', () => {
    sound.init();
    startGame();
   });

   // Start animation loop on window load
   window.onload = () => {
    gameLoop();
   };
  </script>
 </body>
</html>
