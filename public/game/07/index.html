<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vampire Survivors Style Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap"
   rel="stylesheet">
  <style>
   * {
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
   }

   body {
    margin: 0;
    overflow: hidden;
    background-color: #0d0e15;
    font-family: 'Rajdhani', sans-serif;
   }

   .pixel-font {
    font-family: 'Press Start 2P', monospace;
   }

   /* Custom Glowing Card Animations */
   .card-glow {
    transition: all 0.2s ease-in-out;
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
   }

   .card-glow:active,
   .card-glow:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
   }

   /* Scanline effect overlay */
   .scanline {
    background: linear-gradient(rgba(18, 16, 16, 0) 50%,
      rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
   }
  </style>
 </head>
 <body class="w-screen h-screen relative bg-slate-950 text-white select-none">

  <!-- Game Canvas -->
  <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

  <!-- Scanline Visual Overlay for retro atmosphere -->
  <div class="scanline pointer-events-none absolute inset-0 z-10 opacity-30"></div>

  <!-- Top HUD Interface -->
  <div id="hud" class="absolute top-0 left-0 w-full p-3 z-20 pointer-events-none flex flex-col gap-2">
   <!-- Experience Bar Container -->
   <div
    class="w-full bg-slate-900/80 border border-slate-700/80 rounded-full h-5 p-0.5 shadow-lg backdrop-blur-sm relative overflow-hidden">
    <div id="expBar"
     class="bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-500 h-full rounded-full transition-all duration-150 w-0">
    </div>
    <div id="levelText"
     class="absolute inset-0 flex items-center justify-center text-xs font-bold tracking-wider text-cyan-200 drop-shadow-md">
     LVL <span id="levelValue" class="ml-1 text-yellow-300">1</span>
    </div>
   </div>

   <!-- Upper Info Bar: Time, Kills, HP -->
   <div class="flex justify-between items-center px-2">
    <!-- HP Bar -->
    <div
     class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 shadow-md backdrop-blur-sm">
     <span class="text-red-400 font-bold text-sm">HP</span>
     <div class="w-28 sm:w-40 bg-slate-800 h-3.5 rounded-full overflow-hidden border border-red-950">
      <div id="hpBar" class="bg-gradient-to-r from-red-600 to-rose-400 h-full w-full transition-all duration-150"></div>
     </div>
     <span id="hpText" class="text-xs font-bold text-slate-300">100/100</span>
    </div>

    <!-- Timer -->
    <div
     class="pixel-font text-yellow-400 text-sm sm:text-lg bg-slate-900/80 px-4 py-1.5 rounded-xl border border-yellow-900/50 shadow-md backdrop-blur-sm">
     <span id="timerText">00:00</span>
    </div>

    <!-- Kills Count -->
    <div
     class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 shadow-md backdrop-blur-sm">
     <svg class="w-4 h-4 text-purple-400" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd"
       d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 011.342 1.258l-.8 1.6 1.582 3.954A1 1 0 0118 11h-1.323l-1.582 3.954 1.6.8a1 1 0 01-1.258 1.342l-1.6-.8-3.954 1.582A1 1 0 0110 18v-1.323l-3.954-1.582-1.599.8a1 1 0 01-1.342-1.258l.8-1.6L2.323 11A1 1 0 013 10h1.323l1.582-3.954-1.6-.8a1 1 0 011.258-1.342l1.6.8L9 3.323V3a1 1 0 011-1z"
       clip-rule="evenodd" />
     </svg>
     <span id="killText" class="font-bold text-sm text-slate-200">0</span>
    </div>
   </div>
  </div>

  <!-- Active Weapons & Passives HUD Display -->
  <div id="equipmentHud" class="absolute bottom-4 left-4 z-20 pointer-events-none flex flex-col gap-1">
   <div id="weaponsList" class="flex gap-1"></div>
   <div id="passivesList" class="flex gap-1"></div>
  </div>

  <!-- Start Screen Modal -->
  <div id="startModal"
   class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4">
   <div
    class="max-w-md w-full bg-slate-900 border-2 border-purple-600 rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-600/20 rounded-full blur-2xl"></div>
    <h1
     class="pixel-font text-2xl sm:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-purple-400 to-cyan-400 mb-2">
     SURVIVOR<br><span class="text-xs text-purple-300 tracking-widest">NIGHTMARE</span></h1>
    <p class="text-slate-400 text-sm mb-6">敵の大群を倒し、パワーアップを獲得して生き残れ！</p>

    <div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800 mb-6 text-left text-xs text-slate-300 space-y-2">
     <div class="flex items-center gap-2">
      <span class="bg-purple-900/50 text-purple-300 px-2 py-0.5 rounded border border-purple-700">PC</span>
      <span>[WASD] または [矢印キー] で移動</span>
     </div>
     <div class="flex items-center gap-2">
      <span class="bg-cyan-900/50 text-cyan-300 px-2 py-0.5 rounded border border-cyan-700">スマホ</span>
      <span>画面内をタッチ＆ドラッグで移動</span>
     </div>
     <div class="flex items-center gap-2">
      <span class="bg-yellow-900/50 text-yellow-300 px-2 py-0.5 rounded border border-yellow-700">自動攻撃</span>
      <span>攻撃は全自動で発動します</span>
     </div>
    </div>

    <button id="startButton"
     class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:scale-95 transition rounded-xl font-bold text-lg shadow-lg border border-purple-400/30 text-white cursor-pointer">
     ゲーム開始
    </button>
   </div>
  </div>

  <!-- Level Up Selection Modal -->
  <div id="levelUpModal"
   class="hidden absolute inset-0 z-40 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
   <div class="max-w-md w-full bg-slate-900 border-2 border-cyan-500/80 rounded-2xl p-5 shadow-2xl">
    <div class="text-center mb-4">
     <span class="pixel-font text-xs text-cyan-400 tracking-widest">LEVEL UP!</span>
     <h2 class="text-xl font-bold text-white">強化カードを選択してください</h2>
    </div>

    <div id="upgradeOptionsContainer" class="flex flex-col gap-3">
     <!-- Upgrade option cards will be dynamically injected here -->
    </div>
   </div>
  </div>

  <!-- Game Over / Victory Modal -->
  <div id="gameOverModal"
   class="hidden absolute inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4">
   <div class="max-w-md w-full bg-slate-900 border-2 border-red-600 rounded-2xl p-6 shadow-2xl text-center">
    <h2 id="gameOverTitle" class="pixel-font text-2xl text-red-500 mb-2">GAME OVER</h2>
    <p id="gameOverSub" class="text-slate-400 text-sm mb-6">闇に飲み込まれてしまった...</p>

    <div class="grid grid-cols-2 gap-3 mb-6">
     <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
      <div class="text-xs text-slate-400">生存時間</div>
      <div id="finalTime" class="text-lg font-bold text-yellow-400">00:00</div>
     </div>
     <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
      <div class="text-xs text-slate-400">撃破数</div>
      <div id="finalKills" class="text-lg font-bold text-cyan-400">0</div>
     </div>
     <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
      <div class="text-xs text-slate-400">到達レベル</div>
      <div id="finalLevel" class="text-lg font-bold text-purple-400">1</div>
     </div>
     <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
      <div class="text-xs text-slate-400">獲得経験値</div>
      <div id="finalExp" class="text-lg font-bold text-emerald-400">0</div>
     </div>
    </div>

    <button id="restartButton"
     class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-95 transition rounded-xl font-bold text-lg shadow-lg border border-red-400/30 text-white cursor-pointer">
     もう一度挑戦
    </button>
   </div>
  </div>

  <script>
   // Web Audio Sound Generator for zero-dependency retro SFX
   class SoundFX {
    constructor() {
     this.ctx = null;
    }

    init() {
     if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
     }
    }

    playHit() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sawtooth';
     osc.frequency.setValueAtTime(180, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
     gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.08);
    }

    playGem() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sine';
     osc.frequency.setValueAtTime(600, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.06);
     gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.06);
    }

    playLevelUp() {
     if (!this.ctx) return;
     const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
     notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.07);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.07 + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.07);
      osc.stop(this.ctx.currentTime + idx * 0.07 + 0.15);
     });
    }

    playShoot() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'square';
     osc.frequency.setValueAtTime(400, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.05);
     gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.05);
    }

    playThunder() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sawtooth';
     osc.frequency.setValueAtTime(100, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
     gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start();
     osc.stop(this.ctx.currentTime + 0.2);
    }
   }

   const sfx = new SoundFX();

   const canvas = document.getElementById('gameCanvas');
   const ctx = canvas.getContext('2d');

   function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
   }
   window.addEventListener('resize', resizeCanvas);
   resizeCanvas();

   // Input Controller (Keyboard & Touch Joystick)
   const keys = {};
   const touchState = {
    active: false,
    startX: 0,
    startY: 0,
    currentX: 0,
    currentY: 0,
    dx: 0,
    dy: 0
   };

   window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
   });
   window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
   });

   // Touch Joystick Controls
   window.addEventListener('touchstart', (e) => {
    if (gameState.isLevelUp || gameState.isGameOver || !gameState.started) return;
    const touch = e.touches[0];
    touchState.active = true;
    touchState.startX = touch.clientX;
    touchState.startY = touch.clientY;
    touchState.currentX = touch.clientX;
    touchState.currentY = touch.clientY;
    touchState.dx = 0;
    touchState.dy = 0;
   });

   window.addEventListener('touchmove', (e) => {
    if (!touchState.active) return;
    const touch = e.touches[0];
    touchState.currentX = touch.clientX;
    touchState.currentY = touch.clientY;

    const diffX = touchState.currentX - touchState.startX;
    const diffY = touchState.currentY - touchState.startY;
    const dist = Math.hypot(diffX, diffY);
    const maxDist = 50;

    if (dist > 0) {
     touchState.dx = (diffX / Math.max(dist, maxDist));
     touchState.dy = (diffY / Math.max(dist, maxDist));
    }
   });

   const resetTouch = () => {
    touchState.active = false;
    touchState.dx = 0;
    touchState.dy = 0;
   };
   window.addEventListener('touchend', resetTouch);
   window.addEventListener('touchcancel', resetTouch);

   const gameState = {
    started: false,
    isGameOver: false,
    isLevelUp: false,
    time: 0,
    kills: 0,
    totalExpGained: 0
   };

   // Upgrade Catalog Definitions
   const UPGRADES = {
    // Weapons
    magicWand: {
     id: 'magicWand',
     type: 'weapon',
     name: '魔法の杖',
     icon: '🪄',
     desc: '一番近くの敵へ自動的に魔弾を発射する'
    },
    knife: {
     id: 'knife',
     type: 'weapon',
     name: '連射ナイフ',
     icon: '🗡️',
     desc: '移動している方向にナイフを連続投擲'
    },
    orbs: {
     id: 'orbs',
     type: 'weapon',
     name: 'ガーディアンオーブ',
     icon: '🔮',
     desc: '周囲を旋回して近づく敵をなぎ払う'
    },
    garlic: {
     id: 'garlic',
     type: 'weapon',
     name: '聖なるフィールド',
     icon: '🧄',
     desc: '自分の周囲に常にダメージ領域を展開'
    },
    lightning: {
     id: 'lightning',
     type: 'weapon',
     name: 'サンダーボルト',
     icon: '⚡',
     desc: 'ランダムな敵の頭上へ落雷攻撃'
    },
    // Passives
    might: {
     id: 'might',
     type: 'passive',
     name: '攻撃力UP',
     icon: '💥',
     desc: '全ての武器の与えるダメージ +20%'
    },
    speed: {
     id: 'speed',
     type: 'passive',
     name: '移動速度UP',
     icon: '👟',
     desc: 'プレイヤーの移動速度 +15%'
    },
    magnet: {
     id: 'magnet',
     type: 'passive',
     name: '磁力UP',
     icon: '🧲',
     desc: 'ジェムを引き寄せる範囲 +35%'
    },
    recovery: {
     id: 'recovery',
     type: 'passive',
     name: 'HPリジェネ',
     icon: '💖',
     desc: '秒間毎にHPが自動回復する'
    }
   };

   class Player {
    constructor() {
     this.x = 0;
     this.y = 0;
     this.radius = 16;
     this.speed = 3.2;
     this.maxHp = 100;
     this.hp = 100;
     this.level = 1;
     this.exp = 0;
     this.nextExp = 10;
     this.magnetRadius = 90;
     this.damageMultiplier = 1.0;
     this.regen = 0;

     // Facing direction
     this.facingX = 1;
     this.facingY = 0;

     // Weapon Levels (0 = Not acquired)
     this.weapons = {
      magicWand: 1,
      knife: 0,
      orbs: 0,
      garlic: 0,
      lightning: 0
     };

     // Passive Levels
     this.passives = {
      might: 0,
      speed: 0,
      magnet: 0,
      recovery: 0
     };

     // Timers for auto-attacks
     this.timers = {
      magicWand: 0,
      knife: 0,
      lightning: 0,
      regen: 0
     };

     // Orbit angle for Orb weapon
     this.orbAngle = 0;
    }

    update(dt) {
     // Determine movement direction from input
     let moveX = 0;
     let moveY = 0;

     if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
     if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
     if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
     if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

     // Add Touch input
     if (touchState.active) {
      moveX = touchState.dx;
      moveY = touchState.dy;
     }

     // Normalize vector if diagonal
     const length = Math.hypot(moveX, moveY);
     if (length > 0) {
      const currentSpeed = this.speed * (1 + this.passives.speed * 0.15);
      const normX = moveX / (length > 1 ? length : 1);
      const normY = moveY / (length > 1 ? length : 1);

      this.x += normX * currentSpeed;
      this.y += normY * currentSpeed;

      this.facingX = normX;
      this.facingY = normY;
     }

     // Health Regeneration
     if (this.passives.recovery > 0) {
      this.timers.regen += dt;
      if (this.timers.regen >= 1.0) {
       this.timers.regen = 0;
       this.heal(this.passives.recovery * 0.8);
      }
     }

     // Update Orb Angles
     this.orbAngle += 0.04;

     // Trigger Weapons
     this.updateWeapons(dt);
    }

    heal(amount) {
     this.hp = Math.min(this.maxHp, this.hp + amount);
     updateHpUI();
    }

    takeDamage(amount) {
     this.hp -= amount;
     sfx.playHit();
     updateHpUI();

     if (this.hp <= 0) {
      this.hp = 0;
      triggerGameOver();
     }
    }

    addExp(amount) {
     this.exp += amount;
     gameState.totalExpGained += amount;

     if (this.exp >= this.nextExp) {
      this.exp -= this.nextExp;
      this.level++;
      this.nextExp = Math.floor(this.nextExp * 1.35) + 5;
      sfx.playLevelUp();
      showLevelUpModal();
     }
     updateExpUI();
    }

    updateWeapons(dt) {
     const totalDamageMult = this.damageMultiplier * (1 + this.passives.might * 0.2);

     // 1. Magic Wand Attack
     if (this.weapons.magicWand > 0) {
      this.timers.magicWand += dt;
      const cooldown = Math.max(0.2, 0.8 - (this.weapons.magicWand * 0.08));
      if (this.timers.magicWand >= cooldown) {
       this.timers.magicWand = 0;
       const target = getClosestEnemy(this.x, this.y);
       if (target) {
        const angle = Math.atan2(target.y - this.y, target.x - this.x);
        const count = Math.min(4, 1 + Math.floor(this.weapons.magicWand / 2));
        for (let i = 0; i < count; i++) {
         const spreadAngle = angle + (i - (count - 1) / 2) * 0.15;
         projectiles.push(new Projectile(
          this.x, this.y,
          Math.cos(spreadAngle) * 7, Math.sin(spreadAngle) * 7,
          12 * totalDamageMult, 120, 'magicWand'
         ));
        }
        sfx.playShoot();
       }
      }
     }

     // 2. Knife Attack
     if (this.weapons.knife > 0) {
      this.timers.knife += dt;
      const cooldown = Math.max(0.15, 0.6 - (this.weapons.knife * 0.06));
      if (this.timers.knife >= cooldown) {
       this.timers.knife = 0;
       const baseAngle = Math.atan2(this.facingY, this.facingX);
       const count = this.weapons.knife;
       for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * 12;
        const perpX = -this.facingY * offset;
        const perpY = this.facingX * offset;
        projectiles.push(new Projectile(
         this.x + perpX, this.y + perpY,
         this.facingX * 9, this.facingY * 9,
         16 * totalDamageMult, 180, 'knife'
        ));
       }
       sfx.playShoot();
      }
     }

     // 3. Garlic Field Damage Check
     if (this.weapons.garlic > 0) {
      const radius = 50 + this.weapons.garlic * 12;
      const damage = (0.3 + this.weapons.garlic * 0.25) * totalDamageMult;
      enemies.forEach(e => {
       const dist = Math.hypot(e.x - this.x, e.y - this.y);
       if (dist < radius + e.radius) {
        e.takeDamage(damage, false);
       }
      });
     }

     // 4. Lightning Strike
     if (this.weapons.lightning > 0) {
      this.timers.lightning += dt;
      const cooldown = Math.max(0.5, 2.0 - (this.weapons.lightning * 0.25));
      if (this.timers.lightning >= cooldown) {
       this.timers.lightning = 0;
       const count = this.weapons.lightning;
       for (let i = 0; i < count; i++) {
        const target = getRandomEnemy();
        if (target) {
         target.takeDamage(45 * totalDamageMult, true);
         particles.push(new Particle(target.x, target.y, 'lightning'));
         floatingTexts.push(new FloatingText(target.x, target.y - 15, Math.floor(45 * totalDamageMult), '#facc15'));
        }
       }
       if (count > 0) sfx.playThunder();
      }
     }
    }

    draw(ctx, camera) {
     const screenX = this.x - camera.x;
     const screenY = this.y - camera.y;

     // Render Garlic Field Aura
     if (this.weapons.garlic > 0) {
      const radius = 50 + this.weapons.garlic * 12;
      ctx.save();
      ctx.beginPath();
      ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(234, 179, 8, 0.12)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(234, 179, 8, 0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
     }

     // Render Guardian Orbs
     if (this.weapons.orbs > 0) {
      const orbCount = 1 + this.weapons.orbs;
      const radius = 65;
      const totalDamageMult = this.damageMultiplier * (1 + this.passives.might * 0.2);

      for (let i = 0; i < orbCount; i++) {
       const angle = this.orbAngle + (i * Math.PI * 2 / orbCount);
       const ox = this.x + Math.cos(angle) * radius;
       const oy = this.y + Math.sin(angle) * radius;
       const oScreenX = ox - camera.x;
       const oScreenY = oy - camera.y;

       ctx.save();
       ctx.beginPath();
       ctx.arc(oScreenX, oScreenY, 8, 0, Math.PI * 2);
       ctx.fillStyle = '#c084fc';
       ctx.shadowColor = '#a855f7';
       ctx.shadowBlur = 12;
       ctx.fill();
       ctx.restore();

       // Collision Check with Enemies
       enemies.forEach(e => {
        if (Math.hypot(e.x - ox, e.y - oy) < e.radius + 8) {
         e.takeDamage(1.2 * totalDamageMult, false);
        }
       });
      }
     }

     // Render Player Body
     ctx.save();
     ctx.translate(screenX, screenY);

     // Body glow
     ctx.beginPath();
     ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
     ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
     ctx.fill();

     // Character Base
     ctx.beginPath();
     ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
     ctx.fillStyle = '#38bdf8';
     ctx.fill();
     ctx.strokeStyle = '#0284c7';
     ctx.lineWidth = 3;
     ctx.stroke();

     // Eyes / Visor
     ctx.fillStyle = '#ffffff';
     const eyeOffset = this.facingX * 5;
     ctx.fillRect(eyeOffset - 3, -4, 6, 4);

     ctx.restore();
    }
   }

   class Enemy {
    constructor(x, y, type) {
     this.x = x;
     this.y = y;
     this.type = type;

     // Stats based on enemy type
     if (type === 'zombie') {
      this.radius = 14;
      this.hp = 20;
      this.maxHp = 20;
      this.speed = 1.6;
      this.damage = 8;
      this.color = '#4ade80';
      this.expValue = 1;
     } else if (type === 'bat') {
      this.radius = 10;
      this.hp = 10;
      this.maxHp = 10;
      this.speed = 2.8;
      this.damage = 5;
      this.color = '#f43f5e';
      this.expValue = 1;
     } else if (type === 'skeleton') {
      this.radius = 16;
      this.hp = 55;
      this.maxHp = 55;
      this.speed = 1.9;
      this.damage = 14;
      this.color = '#e2e8f0';
      this.expValue = 3;
     } else if (type === 'boss') {
      this.radius = 32;
      this.hp = 800;
      this.maxHp = 800;
      this.speed = 1.1;
      this.damage = 25;
      this.color = '#a855f7';
      this.expValue = 25;
     }

     this.flashTimer = 0;
    }

    update(player, dt) {
     // Flash on hit decay
     if (this.flashTimer > 0) this.flashTimer -= dt;

     // Move towards player
     const angle = Math.atan2(player.y - this.y, player.x - this.x);
     this.x += Math.cos(angle) * this.speed;
     this.y += Math.sin(angle) * this.speed;

     // Player collision check
     const dist = Math.hypot(player.x - this.x, player.y - this.y);
     if (dist < player.radius + this.radius) {
      player.takeDamage(this.damage * dt * 2);
     }
    }

    takeDamage(amount, showText = true) {
     this.hp -= amount;
     this.flashTimer = 0.1;

     if (showText && amount >= 1) {
      floatingTexts.push(new FloatingText(this.x, this.y - 10, Math.floor(amount), '#ffffff'));
     }

     if (this.hp <= 0) {
      this.die();
     }
    }

    die() {
     const idx = enemies.indexOf(this);
     if (idx !== -1) {
      enemies.splice(idx, 1);
      gameState.kills++;
      updateKillUI();

      // Drop EXP Gem
      gems.push(new ExpGem(this.x, this.y, this.expValue));

      // Death particle effects
      for (let i = 0; i < 6; i++) {
       particles.push(new Particle(this.x, this.y, 'blood', this.color));
      }
     }
    }

    draw(ctx, camera) {
     const screenX = this.x - camera.x;
     const screenY = this.y - camera.y;

     ctx.save();
     ctx.translate(screenX, screenY);

     ctx.beginPath();
     ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
     ctx.fillStyle = this.flashTimer > 0 ? '#ffffff' : this.color;
     ctx.fill();

     if (this.type === 'boss') {
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Health bar overhead for Boss
      const hpPercent = this.hp / this.maxHp;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-25, -40, 50, 6);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-25, -40, 50 * hpPercent, 6);
     }

     ctx.restore();
    }
   }

   class Projectile {
    constructor(x, y, vx, vy, damage, range, type) {
     this.x = x;
     this.y = y;
     this.vx = vx;
     this.vy = vy;
     this.damage = damage;
     this.range = range;
     this.distanceTraveled = 0;
     this.type = type;
     this.radius = type === 'knife' ? 5 : 6;
    }

    update(dt) {
     this.x += this.vx;
     this.y += this.vy;
     this.distanceTraveled += Math.hypot(this.vx, this.vy);

     // Enemy collision check
     for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (Math.hypot(e.x - this.x, e.y - this.y) < e.radius + this.radius) {
       e.takeDamage(this.damage);

       // Destroy projectile unless piercing
       if (this.type !== 'lightning') {
        const idx = projectiles.indexOf(this);
        if (idx !== -1) projectiles.splice(idx, 1);
        break;
       }
      }
     }

     // Range expiration
     if (this.distanceTraveled >= this.range) {
      const idx = projectiles.indexOf(this);
      if (idx !== -1) projectiles.splice(idx, 1);
     }
    }

    draw(ctx, camera) {
     const screenX = this.x - camera.x;
     const screenY = this.y - camera.y;

     ctx.save();
     ctx.translate(screenX, screenY);

     if (this.type === 'magicWand') {
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 10;
      ctx.fill();
     } else if (this.type === 'knife') {
      const angle = Math.atan2(this.vy, this.vx);
      ctx.rotate(angle);
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(-8, -2, 16, 4);
     }

     ctx.restore();
    }
   }

   class ExpGem {
    constructor(x, y, value) {
     this.x = x;
     this.y = y;
     this.value = value;
     this.radius = 5;
    }

    update(player, dt) {
     const currentMagnetRadius = player.magnetRadius * (1 + player.passives.magnet * 0.35);
     const dist = Math.hypot(player.x - this.x, player.y - this.y);

     // Magnet suction effect
     if (dist < currentMagnetRadius) {
      const angle = Math.atan2(player.y - this.y, player.x - this.x);
      const speed = 7 + (1 - dist / currentMagnetRadius) * 6;
      this.x += Math.cos(angle) * speed;
      this.y += Math.sin(angle) * speed;
     }

     // Picked up
     if (dist < player.radius + this.radius) {
      player.addExp(this.value);
      sfx.playGem();
      const idx = gems.indexOf(this);
      if (idx !== -1) gems.splice(idx, 1);
     }
    }

    draw(ctx, camera) {
     const screenX = this.x - camera.x;
     const screenY = this.y - camera.y;

     ctx.save();
     ctx.translate(screenX, screenY);
     ctx.rotate(Math.PI / 4);

     ctx.fillStyle = this.value >= 10 ? '#a855f7' : (this.value >= 3 ? '#38bdf8' : '#22c55e');
     ctx.fillRect(-4, -4, 8, 8);

     ctx.restore();
    }
   }

   class Particle {
    constructor(x, y, type, color = '#ffffff') {
     this.x = x;
     this.y = y;
     this.type = type;
     this.color = color;
     this.life = 1.0;
     this.decay = Math.random() * 0.05 + 0.03;
     this.vx = (Math.random() - 0.5) * 6;
     this.vy = (Math.random() - 0.5) * 6;
    }

    update() {
     this.x += this.vx;
     this.y += this.vy;
     this.life -= this.decay;
    }

    draw(ctx, camera) {
     if (this.life <= 0) return;
     const screenX = this.x - camera.x;
     const screenY = this.y - camera.y;

     ctx.save();
     ctx.globalAlpha = Math.max(0, this.life);

     if (this.type === 'lightning') {
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(screenX, screenY - 150);
      ctx.lineTo(screenX, screenY);
      ctx.stroke();
     } else {
      ctx.fillStyle = this.color;
      ctx.fillRect(screenX - 2, screenY - 2, 4, 4);
     }

     ctx.restore();
    }
   }

   class FloatingText {
    constructor(x, y, text, color) {
     this.x = x;
     this.y = y;
     this.text = text;
     this.color = color;
     this.life = 1.0;
     this.vy = -1.2;
    }

    update() {
     this.y += this.vy;
     this.life -= 0.025;
    }

    draw(ctx, camera) {
     if (this.life <= 0) return;
     const screenX = this.x - camera.x;
     const screenY = this.y - camera.y;

     ctx.save();
     ctx.globalAlpha = Math.max(0, this.life);
     ctx.font = 'bold 14px Rajdhani';
     ctx.fillStyle = this.color;
     ctx.fillText(this.text, screenX, screenY);
     ctx.restore();
    }
   }

   let player = new Player();
   let enemies = [];
   let projectiles = [];
   let gems = [];
   let particles = [];
   let floatingTexts = [];
   let camera = { x: 0, y: 0 };
   let spawnTimer = 0;
   let lastTimestamp = 0;

   function getClosestEnemy(x, y) {
    let closest = null;
    let minDist = Infinity;
    enemies.forEach(e => {
     const d = Math.hypot(e.x - x, e.y - y);
     if (d < minDist) {
      minDist = d;
      closest = e;
     }
    });
    return closest;
   }

   function getRandomEnemy() {
    if (enemies.length === 0) return null;
    return enemies[Math.floor(Math.random() * enemies.length)];
   }

   // Enemy Spawner System based on elapsed time
   function handleEnemySpawning(dt) {
    spawnTimer += dt;
    const spawnInterval = Math.max(0.15, 1.2 - (gameState.time / 180));

    if (spawnTimer >= spawnInterval) {
     spawnTimer = 0;

     // Determine spawn position around player screen boundaries
     const angle = Math.random() * Math.PI * 2;
     const spawnDist = Math.max(canvas.width, canvas.height) / 2 + 50;
     const spawnX = player.x + Math.cos(angle) * spawnDist;
     const spawnY = player.y + Math.sin(angle) * spawnDist;

     // Enemy Type Selection by timer
     let type = 'zombie';
     const rand = Math.random();

     if (gameState.time > 60 && rand < 0.3) {
      type = 'bat';
     } else if (gameState.time > 120 && rand < 0.25) {
      type = 'skeleton';
     }

     enemies.push(new Enemy(spawnX, spawnY, type));

     // Spawn Boss every 3 minutes
     if (Math.floor(gameState.time) > 0 && Math.floor(gameState.time) % 180 === 0 && rand < 0.05) {
      enemies.push(new Enemy(spawnX, spawnY, 'boss'));
     }
    }
   }

   function updateHpUI() {
    const hpBar = document.getElementById('hpBar');
    const hpText = document.getElementById('hpText');
    const percent = Math.max(0, (player.hp / player.maxHp) * 100);
    hpBar.style.width = `${percent}%`;
    hpText.textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;
   }

   function updateExpUI() {
    const expBar = document.getElementById('expBar');
    const levelValue = document.getElementById('levelValue');
    const percent = Math.min(100, (player.exp / player.nextExp) * 100);
    expBar.style.width = `${percent}%`;
    levelValue.textContent = player.level;
   }

   function updateKillUI() {
    document.getElementById('killText').textContent = gameState.kills;
   }

   function updateEquipmentUI() {
    const weaponsList = document.getElementById('weaponsList');
    const passivesList = document.getElementById('passivesList');

    weaponsList.innerHTML = '';
    passivesList.innerHTML = '';

    Object.entries(player.weapons).forEach(([id, lvl]) => {
     if (lvl > 0) {
      const badge = document.createElement('div');
      badge.className = 'w-7 h-7 bg-slate-800/90 border border-cyan-500/50 rounded-lg flex items-center justify-center text-xs shadow';
      badge.textContent = UPGRADES[id].icon;
      badge.title = `${UPGRADES[id].name} (Lvl ${lvl})`;
      weaponsList.appendChild(badge);
     }
    });

    Object.entries(player.passives).forEach(([id, lvl]) => {
     if (lvl > 0) {
      const badge = document.createElement('div');
      badge.className = 'w-7 h-7 bg-slate-800/90 border border-purple-500/50 rounded-lg flex items-center justify-center text-xs shadow';
      badge.textContent = UPGRADES[id].icon;
      badge.title = `${UPGRADES[id].name} (Lvl ${lvl})`;
      passivesList.appendChild(badge);
     }
    });
   }

   function showLevelUpModal() {
    gameState.isLevelUp = true;
    const container = document.getElementById('upgradeOptionsContainer');
    container.innerHTML = '';

    // Generate 3 random upgrade choices
    const availableKeys = Object.keys(UPGRADES);
    const shuffled = availableKeys.sort(() => 0.5 - Math.random());
    const choices = shuffled.slice(0, 3);

    choices.forEach(key => {
     const item = UPGRADES[key];
     const isWeapon = item.type === 'weapon';
     const currentLvl = isWeapon ? player.weapons[key] : player.passives[key];

     const card = document.createElement('div');
     card.className = `card-glow bg-slate-800/90 p-4 rounded-xl border ${isWeapon ? 'border-cyan-500/50' : 'border-purple-500/50'} cursor-pointer flex items-center gap-4`;

     card.innerHTML = `
                    <div class="text-3xl bg-slate-900 p-2.5 rounded-xl border border-slate-700">${item.icon}</div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-white text-base">${item.name}</h3>
                            <span class="text-xs px-2 py-0.5 rounded ${isWeapon ? 'bg-cyan-950 text-cyan-400 border border-cyan-800' : 'bg-purple-950 text-purple-400 border border-purple-800'}">
                                ${currentLvl === 0 ? '新規' : `Lvl ${currentLvl + 1}`}
                            </span>
                        </div>
                        <p class="text-xs text-slate-300 mt-1">${item.desc}</p>
                    </div>
                `;

     card.onclick = () => {
      if (isWeapon) {
       player.weapons[key]++;
      } else {
       player.passives[key]++;
      }
      updateEquipmentUI();
      document.getElementById('levelUpModal').classList.add('hidden');
      gameState.isLevelUp = false;
     };

     container.appendChild(card);
    });

    document.getElementById('levelUpModal').classList.remove('hidden');
   }

   function gameLoop(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = Math.min(0.1, (timestamp - lastTimestamp) / 1000);
    lastTimestamp = timestamp;

    if (gameState.started && !gameState.isGameOver && !gameState.isLevelUp) {
     gameState.time += dt;

     // Update Timer UI
     const mins = Math.floor(gameState.time / 60).toString().padStart(2, '0');
     const secs = Math.floor(gameState.time % 60).toString().padStart(2, '0');
     document.getElementById('timerText').textContent = `${mins}:${secs}`;

     // Update Entities
     player.update(dt);
     handleEnemySpawning(dt);

     enemies.forEach(e => e.update(player, dt));
     projectiles.forEach(p => p.update(dt));
     gems.forEach(g => g.update(player, dt));
     particles.forEach(p => p.update());
     floatingTexts.forEach(ft => ft.update());

     // Filter dead particles / floating texts
     particles = particles.filter(p => p.life > 0);
     floatingTexts = floatingTexts.filter(ft => ft.life > 0);

     // Update Camera to center player
     camera.x = player.x - canvas.width / 2;
     camera.y = player.y - canvas.height / 2;
    }

    // --- RENDER SECTION ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Background Grid Pattern
    ctx.save();
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    const gridSize = 64;
    const startX = -camera.x % gridSize;
    const startY = -camera.y % gridSize;

    for (let x = startX; x < canvas.width; x += gridSize) {
     ctx.beginPath();
     ctx.moveTo(x, 0);
     ctx.lineTo(x, canvas.height);
     ctx.stroke();
    }
    for (let y = startY; y < canvas.height; y += gridSize) {
     ctx.beginPath();
     ctx.moveTo(0, y);
     ctx.lineTo(canvas.width, y);
     ctx.stroke();
    }
    ctx.restore();

    // Render Entities
    gems.forEach(g => g.draw(ctx, camera));
    enemies.forEach(e => e.draw(ctx, camera));
    projectiles.forEach(p => p.draw(ctx, camera));
    if (gameState.started) player.draw(ctx, camera);
    particles.forEach(p => p.draw(ctx, camera));
    floatingTexts.forEach(ft => ft.draw(ctx, camera));

    // Render Touch Joystick Visualizer (if active)
    if (touchState.active && gameState.started) {
     ctx.save();
     ctx.beginPath();
     ctx.arc(touchState.startX, touchState.startY, 45, 0, Math.PI * 2);
     ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
     ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
     ctx.lineWidth = 2;
     ctx.fill();
     ctx.stroke();

     ctx.beginPath();
     ctx.arc(touchState.currentX, touchState.currentY, 20, 0, Math.PI * 2);
     ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
     ctx.fill();
     ctx.restore();
    }

    requestAnimationFrame(gameLoop);
   }

   function startGame() {
    sfx.init();
    player = new Player();
    enemies = [];
    projectiles = [];
    gems = [];
    particles = [];
    floatingTexts = [];

    gameState.time = 0;
    gameState.kills = 0;
    gameState.totalExpGained = 0;
    gameState.isGameOver = false;
    gameState.isLevelUp = false;
    gameState.started = true;

    updateHpUI();
    updateExpUI();
    updateKillUI();
    updateEquipmentUI();

    document.getElementById('startModal').classList.add('hidden');
    document.getElementById('gameOverModal').classList.add('hidden');
   }

   function triggerGameOver() {
    gameState.isGameOver = true;

    const mins = Math.floor(gameState.time / 60).toString().padStart(2, '0');
    const secs = Math.floor(gameState.time % 60).toString().padStart(2, '0');

    document.getElementById('finalTime').textContent = `${mins}:${secs}`;
    document.getElementById('finalKills').textContent = gameState.kills;
    document.getElementById('finalLevel').textContent = player.level;
    document.getElementById('finalExp').textContent = gameState.totalExpGained;

    document.getElementById('gameOverModal').classList.remove('hidden');
   }

   document.getElementById('startButton').onclick = startGame;
   document.getElementById('restartButton').onclick = startGame;

   // Kickoff game loop rendering
   requestAnimationFrame(gameLoop);
  </script>
