<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <!-- スマホでの拡大縮小を防止し、全画面にフィットさせる -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Survive the Swarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   body,
   html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1a202c;
    /* Tailwind bg-gray-900 */
    touch-action: none;
    /* スマホでのスワイプによるリロードやスクロールを無効化 */
    user-select: none;
    -webkit-user-select: none;
   }

   #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
   }

   /* UIオーバーレイのスタイル */
   .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    /* 基本はクリックを透過 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
   }

   .pointer-events-auto {
    pointer-events: auto;
   }

   /* ジョイスティックのスタイル */
   #joystick-zone {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 150px;
    height: 150px;
    pointer-events: auto;
    border-radius: 50%;
    display: none;
    /* PCでは非表示、スマホでタッチ時に表示 */
   }

   #joystick-base {
    position: absolute;
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: none;
    pointer-events: none;
   }

   #joystick-stick {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: none;
    pointer-events: none;
   }

   /* レベルアップカードのホバーエフェクト */
   .upgrade-card {
    transition: transform 0.1s, box-shadow 0.1s;
   }

   .upgrade-card:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
   }
  </style>
 </head>
 <body class="text-white font-sans antialiased">

  <!-- ゲームを描画するキャンバス -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI: トップバー (HP, レベル, 経験値, 時間) -->
  <div id="top-ui" class="absolute top-0 left-0 w-full p-4 flex flex-col gap-2 pointer-events-none z-10">
   <div class="flex justify-between items-center w-full">
    <div class="text-xl font-bold text-yellow-400 drop-shadow-md">LV. <span id="ui-level">1</span></div>
    <div class="text-2xl font-mono font-bold drop-shadow-md" id="ui-time">00:00</div>
    <div class="text-right">
     <div class="text-sm text-red-400 font-bold">HP</div>
     <div class="w-32 h-4 bg-gray-700 rounded overflow-hidden border border-gray-600">
      <div id="ui-hp-bar" class="h-full bg-red-500 transition-all duration-200" style="width: 100%;"></div>
     </div>
    </div>
   </div>
   <!-- 経験値バー -->
   <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden border border-gray-600 shadow-inner">
    <div id="ui-exp-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%;"></div>
   </div>
  </div>

  <!-- ジョイスティック (スマホ用) -->
  <div id="joystick-zone"></div>
  <div id="joystick-base"></div>
  <div id="joystick-stick"></div>

  <!-- UI: スタート画面 -->
  <div id="start-screen" class="ui-layer bg-black bg-opacity-80 pointer-events-auto z-50">
   <h1
    class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500 mb-8 drop-shadow-lg text-center">
    SURVIVE<br>THE SWARM</h1>
   <p class="mb-8 text-gray-300 text-center max-w-md px-4">
    PC: WASD または 矢印キー<br>
    スマホ: 画面左下をタッチ＆ドラッグ<br>
    攻撃は自動で行われます。経験値(青い宝石)を集めてレベルアップ！
   </p>
   <button id="start-btn"
    class="px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-full text-xl shadow-[0_0_15px_rgba(220,38,38,0.7)] transition-colors">
    GAME START
   </button>
  </div>

  <!-- UI: レベルアップ画面 -->
  <div id="levelup-screen" class="ui-layer bg-black bg-opacity-70 pointer-events-auto z-40 hidden backdrop-blur-sm">
   <h2 class="text-4xl font-bold text-yellow-400 mb-6 drop-shadow-md animate-bounce">LEVEL UP!</h2>
   <p class="text-white mb-6">アップグレードを選択してください</p>
   <div id="upgrade-container" class="flex flex-col md:flex-row gap-4 w-full max-w-3xl px-4">
    <!-- カードはJSで動的に生成 -->
   </div>
  </div>

  <!-- UI: ゲームオーバー画面 -->
  <div id="gameover-screen" class="ui-layer bg-black bg-opacity-90 pointer-events-auto z-50 hidden">
   <h1 class="text-6xl font-black text-red-600 mb-4 drop-shadow-[0_0_10px_rgba(220,38,38,0.8)]">GAME OVER</h1>
   <div class="text-2xl mb-2">生存時間: <span id="result-time" class="font-mono text-yellow-400">00:00</span></div>
   <div class="text-xl mb-8">到達レベル: <span id="result-level" class="text-blue-400">1</span></div>
   <button id="restart-btn"
    class="px-8 py-4 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-full text-xl shadow-lg transition-colors border border-gray-500">
    もう一度プレイ
   </button>
  </div>

  <script>
   const canvas = document.getElementById('gameCanvas');
   const ctx = canvas.getContext('2d');

   // UI Elements
   const uiHpBar = document.getElementById('ui-hp-bar');
   const uiExpBar = document.getElementById('ui-exp-bar');
   const uiLevel = document.getElementById('ui-level');
   const uiTime = document.getElementById('ui-time');
   const startScreen = document.getElementById('start-screen');
   const levelupScreen = document.getElementById('levelup-screen');
   const gameoverScreen = document.getElementById('gameover-screen');
   const upgradeContainer = document.getElementById('upgrade-container');

   // Game State Enum
   const STATE = { START: 0, PLAYING: 1, LEVELUP: 2, GAMEOVER: 3 };
   let gameState = STATE.START;

   // Global Game Variables
   let lastTime = 0;
   let gameTime = 0;
   let camera = { x: 0, y: 0 };
   let frameCount = 0;

   // Entities
   let player;
   let enemies = [];
   let gems = [];
   let projectiles = [];
   let particles = [];
   let damageTexts = [];

   // Input
   const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
   let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0, touchId: null };

   // Constants
   const MAP_SIZE = 4000; // 仮想マップの広さ（これを超えると敵が再配置されるなど、無限ループのように見せる）
   const TILE_SIZE = 100;

   function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
   }
   window.addEventListener('resize', resize);
   resize();

   // Keyboard Input
   window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
   });
   window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
   });

   // Joystick Input (Touch)
   const joyBase = document.getElementById('joystick-base');
   const joyStick = document.getElementById('joystick-stick');

   // タッチ操作は画面全体で受け付けるが、左半分でジョイスティック起動
   document.addEventListener('touchstart', (e) => {
    if (gameState !== STATE.PLAYING) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
     const touch = e.changedTouches[i];
     if (!joystick.active && touch.clientX < window.innerWidth / 2) {
      joystick.active = true;
      joystick.touchId = touch.identifier;
      joystick.originX = touch.clientX;
      joystick.originY = touch.clientY;

      joyBase.style.display = 'block';
      joyStick.style.display = 'block';
      joyBase.style.left = `${joystick.originX}px`;
      joyBase.style.top = `${joystick.originY}px`;
      joyStick.style.left = `${joystick.originX}px`;
      joyStick.style.top = `${joystick.originY}px`;
      joystick.dx = 0;
      joystick.dy = 0;
     }
    }
   }, { passive: false });

   document.addEventListener('touchmove', (e) => {
    if (gameState !== STATE.PLAYING || !joystick.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
     const touch = e.changedTouches[i];
     if (touch.identifier === joystick.touchId) {
      e.preventDefault(); // スクロール防止
      let dx = touch.clientX - joystick.originX;
      let dy = touch.clientY - joystick.originY;
      const distance = Math.hypot(dx, dy);
      const maxDist = 50; // ジョイスティックの最大可動範囲

      if (distance > maxDist) {
       dx = (dx / distance) * maxDist;
       dy = (dy / distance) * maxDist;
      }

      joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

      // 正規化して-1.0 ~ 1.0の範囲にする
      joystick.dx = dx / maxDist;
      joystick.dy = dy / maxDist;
     }
    }
   }, { passive: false });

   const endTouch = (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
     if (e.changedTouches[i].identifier === joystick.touchId) {
      joystick.active = false;
      joystick.touchId = null;
      joystick.dx = 0;
      joystick.dy = 0;
      joyBase.style.display = 'none';
      joyStick.style.display = 'none';
     }
    }
   };
   document.addEventListener('touchend', endTouch);
   document.addEventListener('touchcancel', endTouch);

   class Player {
    constructor() {
     this.x = 0;
     this.y = 0;
     this.radius = 16;
     this.speed = 200; // pixels per second
     this.maxHp = 100;
     this.hp = this.maxHp;
     this.level = 1;
     this.exp = 0;
     this.expToNext = 10;
     this.magnetRadius = 80;
     this.vx = 0;
     this.vy = 0;
     this.facing = 1; // 1 for right, -1 for left
     this.weapons = {
      wand: { level: 1, cooldown: 1.5, timer: 0, damage: 10, speed: 400, pierce: 1 },
      aura: { level: 0, radius: 80, damage: 5, timer: 0, cooldown: 0.5 }, // 0 means inactive
      whip: { level: 0, cooldown: 2.0, timer: 0, damage: 20, range: 120 }
     };
     this.damageFlash = 0;
    }

    update(dt) {
     // Movement
     this.vx = 0;
     this.vy = 0;

     if (keys.w || keys.ArrowUp) this.vy -= 1;
     if (keys.s || keys.ArrowDown) this.vy += 1;
     if (keys.a || keys.ArrowLeft) this.vx -= 1;
     if (keys.d || keys.ArrowRight) this.vx += 1;

     if (joystick.active) {
      this.vx = joystick.dx;
      this.vy = joystick.dy;
     } else {
      // 正規化 (斜め移動時の速度補正)
      const length = Math.hypot(this.vx, this.vy);
      if (length > 0) {
       this.vx /= length;
       this.vy /= length;
      }
     }

     if (this.vx > 0) this.facing = 1;
     else if (this.vx < 0) this.facing = -1;

     this.x += this.vx * this.speed * dt;
     this.y += this.vy * this.speed * dt;

     // ダメージフラッシュ減衰
     if (this.damageFlash > 0) this.damageFlash -= dt * 5;

     // 武器の更新と発射
     this.updateWeapons(dt);

     // UI更新
     uiHpBar.style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;
     uiExpBar.style.width = `${(this.exp / this.expToNext) * 100}%`;
    }

    updateWeapons(dt) {
     // Magic Wand: Nearest target
     if (this.weapons.wand.level > 0) {
      this.weapons.wand.timer -= dt;
      if (this.weapons.wand.timer <= 0) {
       this.weapons.wand.timer = this.weapons.wand.cooldown;
       let target = this.getNearestEnemy(300);
       if (target) {
        let angle = Math.atan2(target.y - this.y, target.x - this.x);
        // レベルに応じて複数発射
        let count = 1 + Math.floor(this.weapons.wand.level / 3);
        for (let i = 0; i < count; i++) {
         setTimeout(() => {
          if (gameState === STATE.PLAYING) {
           projectiles.push(new WandProjectile(this.x, this.y, angle, this.weapons.wand));
          }
         }, i * 150);
        }
       }
      }
     }

     // Garlic (Aura): Constant area damage around player
     if (this.weapons.aura.level > 0) {
      this.weapons.aura.timer -= dt;
      if (this.weapons.aura.timer <= 0) {
       this.weapons.aura.timer = this.weapons.aura.cooldown;
       // 円内の敵にダメージ
       enemies.forEach(enemy => {
        const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
        if (dist < this.weapons.aura.radius + enemy.radius) {
         enemy.takeDamage(this.weapons.aura.damage);
         createHitEffect(enemy.x, enemy.y, '#a855f7');
        }
       });
      }
     }

     // Whip: Horizontal slash
     if (this.weapons.whip.level > 0) {
      this.weapons.whip.timer -= dt;
      if (this.weapons.whip.timer <= 0) {
       this.weapons.whip.timer = this.weapons.whip.cooldown;
       projectiles.push(new WhipSlash(this.x, this.y, this.facing, this.weapons.whip));
       // レベルが高い場合は後ろにも発射
       if (this.weapons.whip.level >= 4) {
        projectiles.push(new WhipSlash(this.x, this.y, -this.facing, this.weapons.whip));
       }
      }
     }
    }

    getNearestEnemy(range) {
     let nearest = null;
     let minDist = range;
     enemies.forEach(enemy => {
      const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
      if (dist < minDist) {
       minDist = dist;
       nearest = enemy;
      }
     });
     return nearest;
    }

    draw(ctx) {
     // オーラ(Garlic)の描画
     if (this.weapons.aura.level > 0) {
      ctx.beginPath();
      ctx.arc(this.x - camera.x, this.y - camera.y, this.weapons.aura.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(168, 85, 247, 0.2)`; // 紫色の半透明
      ctx.fill();
      ctx.strokeStyle = `rgba(168, 85, 247, 0.5)`;
      ctx.lineWidth = 2;
      ctx.stroke();
     }

     // プレイヤー自身の描画 (絵文字で代用)
     ctx.save();
     ctx.translate(this.x - camera.x, this.y - camera.y);
     if (this.facing === -1) ctx.scale(-1, 1); // 左向き時は反転

     ctx.font = '30px Arial';
     ctx.textAlign = 'center';
     ctx.textBaseline = 'middle';

     // ダメージ時の赤フラッシュ
     if (this.damageFlash > 0) {
      ctx.filter = 'brightness(200%) sepia(100%) hue-rotate(-50deg) saturate(500%)';
     }

     ctx.fillText('🧙‍♂️', 0, 0); // 魔法使い
     ctx.restore();
    }

    takeDamage(amount) {
     if (this.damageFlash > 0) return; // 無敵時間(短)
     this.hp -= amount;
     this.damageFlash = 1;
     createDamageText(this.x, this.y - 20, Math.ceil(amount), '#ef4444');
     if (this.hp <= 0) {
      gameOver();
     }
    }

    addExp(amount) {
     this.exp += amount;
     if (this.exp >= this.expToNext) {
      this.exp -= this.expToNext;
      this.levelUp();
     }
    }

    levelUp() {
     this.level++;
     this.expToNext = Math.floor(this.expToNext * 1.5);
     uiLevel.innerText = this.level;

     // 少しHP回復
     this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.2);

     triggerLevelUpMenu();
    }
   }

   class Enemy {
    constructor(x, y, type) {
     this.x = x;
     this.y = y;
     this.type = type;

     // 種類によるステータス設定
     if (type === 'zombie') {
      this.emoji = '🧟';
      this.radius = 14;
      this.speed = 40 + Math.random() * 20;
      this.maxHp = 15 + Math.floor(gameTime / 60) * 10;
      this.damage = 10;
     } else if (type === 'bat') {
      this.emoji = '🦇';
      this.radius = 12;
      this.speed = 100 + Math.random() * 30;
      this.maxHp = 5 + Math.floor(gameTime / 60) * 5;
      this.damage = 5;
     } else if (type === 'boss') {
      this.emoji = '👹';
      this.radius = 24;
      this.speed = 60;
      this.maxHp = 200 + Math.floor(gameTime / 60) * 100;
      this.damage = 30;
     }

     this.hp = this.maxHp;
     this.flash = 0;
     this.facing = 1;
    }

    update(dt) {
     // プレイヤーに向かって移動
     const dx = player.x - this.x;
     const dy = player.y - this.y;
     const dist = Math.hypot(dx, dy);

     if (dist > 0) {
      this.x += (dx / dist) * this.speed * dt;
      this.y += (dy / dist) * this.speed * dt;
      this.facing = dx > 0 ? 1 : -1;
     }

     if (this.flash > 0) this.flash -= dt * 10;

     // プレイヤーとの衝突(ダメージ)
     if (dist < this.radius + player.radius) {
      player.takeDamage(this.damage);
      // ノックバック
      this.x -= (dx / dist) * 10;
      this.y -= (dy / dist) * 10;
     }
    }

    draw(ctx) {
     ctx.save();
     ctx.translate(this.x - camera.x, this.y - camera.y);
     if (this.facing === -1) ctx.scale(-1, 1);

     if (this.flash > 0) {
      ctx.filter = 'brightness(200%)';
     }

     ctx.font = `${this.radius * 2}px Arial`;
     ctx.textAlign = 'center';
     ctx.textBaseline = 'middle';
     ctx.fillText(this.emoji, 0, 0);

     // Boss HP Bar
     if (this.type === 'boss' && this.hp < this.maxHp) {
      ctx.fillStyle = 'black';
      ctx.fillRect(-20, -30, 40, 5);
      ctx.fillStyle = 'red';
      ctx.fillRect(-20, -30, 40 * (this.hp / this.maxHp), 5);
     }
     ctx.restore();
    }

    takeDamage(amount) {
     this.hp -= amount;
     this.flash = 1;
     createDamageText(this.x, this.y - this.radius, Math.ceil(amount), '#ffffff');
     if (this.hp <= 0) {
      this.die();
     }
    }

    die() {
     // 経験値ジェムをドロップ
     const expVal = this.type === 'boss' ? 20 : (this.type === 'zombie' ? 2 : 1);
     gems.push(new Gem(this.x, this.y, expVal));
     createHitEffect(this.x, this.y, '#ef4444');
    }
   }

   class Gem {
    constructor(x, y, value) {
     this.x = x;
     this.y = y;
     this.value = value;
     this.radius = value > 5 ? 8 : 5;
     this.color = value > 5 ? '#ef4444' : '#3b82f6'; // 赤ジェムか青ジェム
     this.isMagnetic = false;
     this.speed = 0;
    }

    update(dt) {
     const dx = player.x - this.x;
     const dy = player.y - this.y;
     const dist = Math.hypot(dx, dy);

     if (dist < player.magnetRadius) {
      this.isMagnetic = true;
     }

     if (this.isMagnetic) {
      this.speed += 500 * dt; // 加速してプレイヤーに向かう
      if (dist > 0) {
       this.x += (dx / dist) * this.speed * dt;
       this.y += (dy / dist) * this.speed * dt;
      }
     }

     // 回収
     if (dist < player.radius + this.radius + 10) {
      player.addExp(this.value);
      return true; // 削除フラグ
     }
     return false;
    }

    draw(ctx) {
     ctx.beginPath();
     ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
     ctx.fillStyle = this.color;
     ctx.fill();
     ctx.shadowBlur = 10;
     ctx.shadowColor = this.color;
     ctx.shadowBlur = 0; // 他の描画に影響しないように戻す
    }
   }

   class WandProjectile {
    constructor(x, y, angle, stats) {
     this.x = x;
     this.y = y;
     this.vx = Math.cos(angle) * stats.speed;
     this.vy = Math.sin(angle) * stats.speed;
     this.damage = stats.damage + (stats.level * 2);
     this.pierce = stats.pierce + Math.floor(stats.level / 3);
     this.hitList = []; // 同じ敵に複数回当たらないように
     this.lifeTime = 2.0;
     this.radius = 6;
    }

    update(dt) {
     this.x += this.vx * dt;
     this.y += this.vy * dt;
     this.lifeTime -= dt;

     // 衝突判定
     for (let i = 0; i < enemies.length; i++) {
      let enemy = enemies[i];
      if (this.hitList.includes(enemy)) continue;

      if (Math.hypot(enemy.x - this.x, enemy.y - this.y) < enemy.radius + this.radius) {
       enemy.takeDamage(this.damage);
       createHitEffect(this.x, this.y, '#60a5fa');
       this.hitList.push(enemy);
       this.pierce--;
       if (this.pierce <= 0) return true; // 消滅
      }
     }
     return this.lifeTime <= 0;
    }

    draw(ctx) {
     ctx.beginPath();
     ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
     ctx.fillStyle = '#60a5fa'; // 水色
     ctx.fill();
     ctx.shadowBlur = 10;
     ctx.shadowColor = '#60a5fa';
     ctx.shadowBlur = 0;
    }
   }

   class WhipSlash {
    constructor(x, y, dir, stats) {
     this.x = x + (dir * 40); // プレイヤーの少し前
     this.y = y;
     this.dir = dir; // 1 or -1
     this.damage = stats.damage + (stats.level * 5);
     this.width = stats.range + (stats.level * 10);
     this.height = 40;
     this.lifeTime = 0.2; // 0.2秒だけ判定が存在
     this.maxLife = 0.2;
     this.hitList = [];
    }

    update(dt) {
     // プレイヤーに追従
     this.x = player.x + (this.dir * 40);
     this.y = player.y;

     // 矩形による衝突判定
     const left = this.x - this.width / 2;
     const right = this.x + this.width / 2;
     const top = this.y - this.height / 2;
     const bottom = this.y + this.height / 2;

     enemies.forEach(enemy => {
      if (this.hitList.includes(enemy)) return;

      if (enemy.x + enemy.radius > left && enemy.x - enemy.radius < right &&
       enemy.y + enemy.radius > top && enemy.y - enemy.radius < bottom) {
       enemy.takeDamage(this.damage);
       createHitEffect(enemy.x, enemy.y, '#f87171');
       this.hitList.push(enemy);
      }
     });

     this.lifeTime -= dt;
     return this.lifeTime <= 0;
    }

    draw(ctx) {
     const alpha = this.lifeTime / this.maxLife;
     ctx.save();
     ctx.translate(this.x - camera.x, this.y - camera.y);
     ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
     // スラッシュの軌跡のような形
     ctx.beginPath();
     ctx.ellipse(0, 0, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
    }
   }

   // 視覚エフェクトとテキスト
   function createHitEffect(x, y, color) {
    for (let i = 0; i < 5; i++) {
     particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 100,
      vy: (Math.random() - 0.5) * 100,
      life: 0.2 + Math.random() * 0.2,
      color: color
     });
    }
   }

   function createDamageText(x, y, text, color) {
    damageTexts.push({
     x: x + (Math.random() - 0.5) * 20,
     y: y,
     text: text,
     color: color,
     life: 0.8,
     vy: -30
    });
   }

   function spawnEnemies() {
    // 画面外にスポーンさせる
    const maxEnemies = 150 + Math.floor(gameTime / 30) * 10; // 時間経過で最大数増加 (上限を設けて重くならないように)
    if (enemies.length >= Math.min(maxEnemies, 300)) return;

    // スポーン頻度
    const spawnRate = Math.max(0.1, 1.0 - (gameTime / 120)); // 最小0.1秒に1回
    if (frameCount % Math.max(1, Math.floor(spawnRate * 60)) !== 0) return;

    const angle = Math.random() * Math.PI * 2;
    // 画面の少し外側にスポーン (対角線より少し長いくらい)
    const dist = Math.hypot(canvas.width, canvas.height) / 2 + 100;
    const sx = player.x + Math.cos(angle) * dist;
    const sy = player.y + Math.sin(angle) * dist;

    let type = 'zombie';
    if (gameTime > 30 && Math.random() < 0.3) type = 'bat';

    enemies.push(new Enemy(sx, sy, type));
   }

   function spawnBoss() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 600;
    const sx = player.x + Math.cos(angle) * dist;
    const sy = player.y + Math.sin(angle) * dist;
    enemies.push(new Enemy(sx, sy, 'boss'));
   }

   // 時間フォーマット (MM:SS)
   function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
   }

   function update(dt) {
    gameTime += dt;
    frameCount++;

    // 1分ごとにボススポーン
    if (Math.floor(gameTime) > 0 && Math.floor(gameTime) % 60 === 0 && Math.floor(gameTime - dt) % 60 !== 0) {
     spawnBoss();
    }

    uiTime.innerText = formatTime(gameTime);

    player.update(dt);

    // カメラの追従
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;

    // 敵の更新
    for (let i = enemies.length - 1; i >= 0; i--) {
     enemies[i].update(dt);
     if (enemies[i].hp <= 0) {
      enemies[i].die();
      enemies.splice(i, 1);
     } else {
      // プレイヤーから離れすぎた敵は消す(リソース節約)
      if (Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y) > 2000) {
       enemies.splice(i, 1);
      }
     }
    }

    // 敵同士の重なり解消 (簡易的)
    for (let i = 0; i < enemies.length; i++) {
     for (let j = i + 1; j < enemies.length; j++) {
      const dx = enemies[i].x - enemies[j].x;
      const dy = enemies[i].y - enemies[j].y;
      const dist = Math.hypot(dx, dy);
      const minDist = enemies[i].radius + enemies[j].radius;
      if (dist < minDist && dist > 0) {
       const overlap = (minDist - dist) / 2;
       const nx = (dx / dist) * overlap;
       const ny = (dy / dist) * overlap;
       enemies[i].x += nx; enemies[i].y += ny;
       enemies[j].x -= nx; enemies[j].y -= ny;
      }
     }
    }

    // ジェムの更新
    for (let i = gems.length - 1; i >= 0; i--) {
     if (gems[i].update(dt)) {
      gems.splice(i, 1);
     } else {
      // 離れすぎたジェムを消す
      if (Math.hypot(gems[i].x - player.x, gems[i].y - player.y) > 3000) {
       gems.splice(i, 1);
      }
     }
    }

    // 発射物の更新
    for (let i = projectiles.length - 1; i >= 0; i--) {
     if (projectiles[i].update(dt)) {
      projectiles.splice(i, 1);
     }
    }

    // パーティクルの更新
    for (let i = particles.length - 1; i >= 0; i--) {
     particles[i].x += particles[i].vx * dt;
     particles[i].y += particles[i].vy * dt;
     particles[i].life -= dt;
     if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // ダメージテキストの更新
    for (let i = damageTexts.length - 1; i >= 0; i--) {
     damageTexts[i].y += damageTexts[i].vy * dt;
     damageTexts[i].life -= dt;
     if (damageTexts[i].life <= 0) damageTexts.splice(i, 1);
    }

    spawnEnemies();
   }

   function draw() {
    // 背景のクリア
    ctx.fillStyle = '#1a202c'; // bg-gray-900
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // タイル状の背景（動いている感を出すため）
    ctx.strokeStyle = '#2d3748'; // bg-gray-800
    ctx.lineWidth = 2;
    const offsetX = -(camera.x % TILE_SIZE);
    const offsetY = -(camera.y % TILE_SIZE);

    ctx.beginPath();
    for (let x = offsetX - TILE_SIZE; x < canvas.width; x += TILE_SIZE) {
     ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for (let y = offsetY - TILE_SIZE; y < canvas.height; y += TILE_SIZE) {
     ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    // プレイヤーが初期化される前（スタート画面など）はここで描画を終了
    if (!player) return;

    // 描画順：ジェム -> 敵 -> 発射物 -> プレイヤー -> エフェクト
    gems.forEach(g => g.draw(ctx));

    // 敵をY座標でソートして描画（奥のものが下になるように）
    enemies.sort((a, b) => a.y - b.y);
    enemies.forEach(e => e.draw(ctx));

    projectiles.forEach(p => p.draw(ctx));
    player.draw(ctx);

    // パーティクル
    particles.forEach(p => {
     ctx.globalAlpha = p.life * 2; // フェードアウト
     ctx.fillStyle = p.color;
     ctx.fillRect(p.x - camera.x, p.y - camera.y, 4, 4);
     ctx.globalAlpha = 1.0;
    });

    // ダメージテキスト
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    damageTexts.forEach(d => {
     ctx.globalAlpha = Math.max(0, d.life);
     ctx.fillStyle = d.color;
     ctx.strokeStyle = 'black';
     ctx.lineWidth = 3;
     ctx.strokeText(d.text, d.x - camera.x, d.y - camera.y);
     ctx.fillText(d.text, d.x - camera.x, d.y - camera.y);
     ctx.globalAlpha = 1.0;
    });
   }

   function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // max dt = 0.1s to prevent huge jumps
    lastTime = timestamp;

    if (gameState === STATE.PLAYING) {
     update(dt);
    }

    if (gameState === STATE.PLAYING || gameState === STATE.LEVELUP) {
     draw();
    }

    requestAnimationFrame(gameLoop);
   }


   const UPGRADES = [
    { id: 'wand', name: 'マジックワンド', desc: '近くの敵に魔法弾を放つ', icon: '🪄' },
    { id: 'aura', name: 'ニンニクオーラ', desc: '周囲の敵に継続ダメージ', icon: '🧄' },
    { id: 'whip', name: 'ムチ', desc: '前方に強力な薙ぎ払い', icon: '🪢' },
    { id: 'speed', name: '靴', desc: '移動速度アップ', icon: '👢' },
    { id: 'hp', name: '命の器', desc: '最大HPアップ & 全回復', icon: '❤️' },
    { id: 'magnet', name: '磁石', desc: '経験値の回収範囲アップ', icon: '🧲' }
   ];

   function triggerLevelUpMenu() {
    gameState = STATE.LEVELUP;
    levelupScreen.classList.remove('hidden');
    upgradeContainer.innerHTML = '';

    // ランダムに3つのアップグレードを選ぶ
    let shuffled = [...UPGRADES].sort(() => 0.5 - Math.random());
    let choices = shuffled.slice(0, 3);

    choices.forEach(upg => {
     const card = document.createElement('div');
     card.className = 'upgrade-card flex-1 bg-gray-800 border-2 border-gray-600 rounded-xl p-6 cursor-pointer flex flex-col items-center text-center';

     let currentLv = 0;
     if (upg.id === 'wand' || upg.id === 'aura' || upg.id === 'whip') currentLv = player.weapons[upg.id].level;

     let lvText = currentLv > 0 ? `Lv ${currentLv} ➔ ${currentLv + 1}` : '新規取得';
     if (['speed', 'hp', 'magnet'].includes(upg.id)) lvText = 'ステータスUP';

     card.innerHTML = `
            <div class="text-5xl mb-4">${upg.icon}</div>
            <h3 class="text-xl font-bold text-yellow-400 mb-2">${upg.name}</h3>
            <div class="text-sm text-blue-300 mb-4">${lvText}</div>
            <p class="text-sm text-gray-300">${upg.desc}</p>
        `;

     card.onclick = () => applyUpgrade(upg.id);
     upgradeContainer.appendChild(card);
    });
   }

   function applyUpgrade(id) {
    switch (id) {
     case 'wand':
      player.weapons.wand.level++;
      if (player.weapons.wand.cooldown > 0.3) player.weapons.wand.cooldown -= 0.1;
      break;
     case 'aura':
      player.weapons.aura.level++;
      player.weapons.aura.radius += 10;
      player.weapons.aura.damage += 2;
      break;
     case 'whip':
      player.weapons.whip.level++;
      break;
     case 'speed':
      player.speed += 20;
      break;
     case 'hp':
      player.maxHp += 20;
      player.hp = player.maxHp;
      break;
     case 'magnet':
      player.magnetRadius += 40;
      break;
    }

    // 再開
    levelupScreen.classList.add('hidden');
    gameState = STATE.PLAYING;
    // タッチ状態リセット
    joystick.active = false;
    joyBase.style.display = 'none';
    joyStick.style.display = 'none';
   }

   function initGame() {
    player = new Player();
    enemies = [];
    gems = [];
    projectiles = [];
    particles = [];
    damageTexts = [];
    gameTime = 0;
    frameCount = 0;
    camera = { x: 0, y: 0 };

    uiLevel.innerText = '1';
    uiHpBar.style.width = '100%';
    uiExpBar.style.width = '0%';

    gameState = STATE.PLAYING;
    lastTime = performance.now();

    // タッチ状態リセット
    joystick.active = false;
    joyBase.style.display = 'none';
    joyStick.style.display = 'none';
   }

   function gameOver() {
    gameState = STATE.GAMEOVER;
    document.getElementById('result-time').innerText = formatTime(gameTime);
    document.getElementById('result-level').innerText = player.level;
    gameoverScreen.classList.remove('hidden');
   }

   // Event Listeners for UI
   document.getElementById('start-btn').addEventListener('click', () => {
    startScreen.classList.add('hidden');
    initGame();
    requestAnimationFrame(gameLoop);
   });

   document.getElementById('restart-btn').addEventListener('click', () => {
    gameoverScreen.classList.add('hidden');
    initGame();
   });

   // 最初は描画だけしておく
   draw();

  </script>
 </body>
