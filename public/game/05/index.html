<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Voxel Craft 3D</title>
  <!-- Tailwind CSS for UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for 3D graphics rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- FontAwesome for Touch UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
   * {
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
   }

   body,
   html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
   }

   #game-canvas {
    width: 100%;
    height: 100%;
    display: block;
   }

   /* HUD Crosshair */
   .crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
   }

   .crosshair::before,
   .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
   }

   .crosshair::before {
    left: 7px;
    top: 0;
    width: 2px;
    height: 16px;
   }

   .crosshair::after {
    top: 7px;
    left: 0;
    width: 16px;
    height: 2px;
   }

   /* Custom Scrollbar */
   .no-scrollbar::-webkit-scrollbar {
    display: none;
   }

   .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
   }

   /* Underwater visual filter */
   #underwater-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 80, 160, 0.45);
    backdrop-filter: blur(1px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 5;
   }

   /* Red flash on damage */
   #damage-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 0, 0, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease-out;
    z-index: 6;
   }

   /* Touch Joystick styling */
   .joystick-zone {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(4px);
    touch-action: none;
   }

   .joystick-handle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    margin-top: -25px;
    margin-left: -25px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    pointer-events: none;
   }
  </style>
 </head>
 <body>

  <!-- Main Render Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Underwater Screen Overlay -->
  <div id="underwater-overlay"></div>

  <!-- Damage Overlay -->
  <div id="damage-overlay"></div>

  <!-- HUD Center Crosshair -->
  <div class="crosshair" id="crosshair"></div>

  <!-- Top UI (Status Bar & Time) -->
  <div class="absolute top-3 left-3 right-3 flex justify-between items-start pointer-events-none z-10">
   <!-- Hearts & Defense -->
   <div
    class="bg-black/60 backdrop-blur-md rounded-2xl p-3 border border-white/15 text-white flex flex-col gap-2 shadow-xl">
    <div class="flex items-center gap-1.5" id="hearts-container">
     <!-- Hearts filled dynamically -->
    </div>
    <div class="flex items-center justify-between gap-4 text-xs font-bold text-gray-200">
     <span><i class="fa-solid fa-trophy text-yellow-400 mr-1"></i>Score: <span id="score-val">0</span></span>
     <span><i class="fa-solid fa-skull text-red-400 mr-1"></i>Kills: <span id="kills-val">0</span></span>
    </div>
   </div>

   <!-- Mini Status / Daytime Info -->
   <div
    class="bg-black/60 backdrop-blur-md rounded-2xl px-4 py-2.5 border border-white/15 text-white flex items-center gap-3 shadow-xl">
    <i id="time-icon" class="fa-solid fa-sun text-yellow-400 text-xl"></i>
    <span id="time-text" class="text-xs font-bold uppercase tracking-wider">昼</span>
   </div>
  </div>

  <!-- Hotbar Bottom Controls -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-2 max-w-full px-2">
   <!-- Selected Item Title -->
   <div id="selected-item-name"
    class="bg-black/70 text-white px-4 py-1 rounded-full text-xs font-semibold backdrop-blur-sm border border-white/15 transition-all opacity-0">
    草ブロック
   </div>

   <!-- Hotbar Slots -->
   <div
    class="flex items-center gap-1.5 bg-black/65 p-2 rounded-2xl border border-white/20 backdrop-blur-md shadow-2xl overflow-x-auto max-w-full no-scrollbar"
    id="hotbar">
    <!-- Dynamically populated -->
   </div>
  </div>

  <!-- Mobile Touch Controls Overlay -->
  <div id="mobile-controls" class="absolute inset-0 pointer-events-none z-20 hidden">
   <!-- Joystick Zone -->
   <div id="joystick-container" class="joystick-zone pointer-events-auto">
    <div id="joystick-knob" class="joystick-handle"></div>
   </div>

   <!-- Right Action Buttons -->
   <div class="absolute bottom-6 right-6 flex flex-col gap-3 pointer-events-auto items-end">
    <div class="flex gap-3">
     <button id="btn-attack"
      class="w-14 h-14 bg-red-600/85 active:bg-red-500 text-white rounded-full border-2 border-white/40 flex items-center justify-center text-xl shadow-lg active:scale-95 transition-transform">
      <i class="fa-solid fa-hand-fist"></i>
     </button>
     <button id="btn-jump"
      class="w-16 h-16 bg-blue-600/85 active:bg-blue-500 text-white rounded-full border-2 border-white/40 flex items-center justify-center text-2xl shadow-lg active:scale-95 transition-transform">
      <i class="fa-solid fa-arrow-up"></i>
     </button>
    </div>
    <div class="flex gap-3">
     <button id="btn-mine"
      class="w-14 h-14 bg-amber-600/85 active:bg-amber-500 text-white rounded-full border-2 border-white/40 flex items-center justify-center text-sm font-bold shadow-lg active:scale-95 transition-transform">
      破壊
     </button>
     <button id="btn-place"
      class="w-14 h-14 bg-emerald-600/85 active:bg-emerald-500 text-white rounded-full border-2 border-white/40 flex items-center justify-center text-sm font-bold shadow-lg active:scale-95 transition-transform">
      設置
     </button>
    </div>
   </div>
  </div>

  <!-- Start / Pause Overlay Screen -->
  <div id="start-overlay"
   class="absolute inset-0 bg-gradient-to-b from-gray-950/95 via-black/85 to-gray-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center text-white p-6">
   <div class="max-w-md w-full text-center space-y-6 bg-white/5 border border-white/10 p-8 rounded-3xl shadow-2xl">
    <div class="space-y-2">
     <h1
      class="text-4xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-green-400 via-emerald-300 to-teal-400">
      VOXEL CRAFT 3D
     </h1>
     <p class="text-gray-400 text-sm">広大な3Dワールドを探索・建築・サバイバル！</p>
    </div>

    <!-- Controls Guide -->
    <div class="text-left bg-black/50 p-4 rounded-xl border border-white/10 text-xs space-y-2 text-gray-300">
     <div class="font-bold text-white mb-1 border-b border-white/10 pb-1">操作方法:</div>
     <div class="flex justify-between"><span>[PC] 移動:</span> <span class="text-emerald-400 font-mono">WASD / 矢印キー</span>
     </div>
     <div class="flex justify-between"><span>[PC] 視点移動:</span> <span class="text-emerald-400 font-mono">マウス移動</span>
     </div>
     <div class="flex justify-between"><span>[PC] 破壊 / 攻撃:</span> <span class="text-emerald-400 font-mono">左クリック</span>
     </div>
     <div class="flex justify-between"><span>[PC] ブロック設置:</span> <span class="text-emerald-400 font-mono">右クリック</span>
     </div>
     <div class="flex justify-between"><span>[PC] ジャンプ / 浮上:</span> <span
       class="text-emerald-400 font-mono">スペースキー</span></div>
     <div class="flex justify-between"><span>[スマホ]:</span> <span
       class="text-amber-400 font-mono">画面左ジョイスティック・右画面ドラッグ</span></div>
    </div>

    <button id="start-btn"
     class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-95 text-white font-bold rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 text-lg">
     <i class="fa-solid fa-play"></i> ワールドに入る
    </button>
   </div>
  </div>

  <script>
   /* --- GAME ENGINE & LOGIC --- */

   // Texture Canvas Generator (Generates pixel art textures for voxel blocks)
   const TextureGenerator = {
    createPixelTexture(drawFunc) {
     const canvas = document.createElement('canvas');
     canvas.width = 16;
     canvas.height = 16;
     const ctx = canvas.getContext('2d');
     drawFunc(ctx);
     const texture = new THREE.CanvasTexture(canvas);
     texture.magFilter = THREE.NearestFilter;
     texture.minFilter = THREE.NearestFilter;
     return texture;
    },

    grassTop() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#55a02e'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 45; i++) {
       ctx.fillStyle = Math.random() > 0.5 ? '#488e25' : '#62b335';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
      }
     });
    },
    grassSide() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 35; i++) {
       ctx.fillStyle = Math.random() > 0.5 ? '#6d4c33' : '#9c7252';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
      }
      ctx.fillStyle = '#55a02e';
      ctx.fillRect(0, 0, 16, 4);
      for (let x = 0; x < 16; x++) {
       if (Math.random() > 0.3) ctx.fillRect(x, 4, 1, Math.floor(Math.random() * 3) + 1);
      }
     });
    },
    dirt() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 45; i++) {
       ctx.fillStyle = Math.random() > 0.5 ? '#6d4c33' : '#9c7252';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
      }
     });
    },
    stone() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 45; i++) {
       ctx.fillStyle = Math.random() > 0.5 ? '#666666' : '#999999';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
      }
     });
    },
    wood() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#674d32'; ctx.fillRect(0, 0, 16, 16);
      ctx.fillStyle = '#4e3823';
      for (let x = 0; x < 16; x += 4) {
       ctx.fillRect(x, 0, 1, 16);
      }
     });
    },
    leaves() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#2d7d29'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 55; i++) {
       ctx.fillStyle = Math.random() > 0.5 ? '#1f5c1c' : '#3fa13a';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
      }
     });
    },
    water() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = 'rgba(28, 107, 202, 0.75)'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 25; i++) {
       ctx.fillStyle = 'rgba(60, 140, 230, 0.85)';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 2, 1);
      }
     });
    },
    sand() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#dcd39a'; ctx.fillRect(0, 0, 16, 16);
      for (let i = 0; i < 35; i++) {
       ctx.fillStyle = Math.random() > 0.5 ? '#c2b87f' : '#ede5b2';
       ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
      }
     });
    },
    brick() {
     return this.createPixelTexture(ctx => {
      ctx.fillStyle = '#a2412d'; ctx.fillRect(0, 0, 16, 16);
      ctx.fillStyle = '#d1cfcd';
      ctx.fillRect(0, 4, 16, 1); ctx.fillRect(0, 9, 16, 1); ctx.fillRect(0, 14, 16, 1);
      ctx.fillRect(4, 0, 1, 4); ctx.fillRect(12, 0, 1, 4);
      ctx.fillRect(8, 5, 1, 4);
      ctx.fillRect(4, 10, 1, 4); ctx.fillRect(12, 10, 1, 4);
     });
    }
   };

   // Web Audio Synthesizer for procedural retro sound effects
   const SoundFX = {
    ctx: null,
    init() {
     if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    },
    playHit() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'triangle';
     osc.frequency.setValueAtTime(160, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
     gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
     osc.connect(gain); gain.connect(this.ctx.destination);
     osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    },
    playBreak() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'square';
     osc.frequency.setValueAtTime(220, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.12);
     gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
     osc.connect(gain); gain.connect(this.ctx.destination);
     osc.start(); osc.stop(this.ctx.currentTime + 0.12);
    },
    playPlace() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sine';
     osc.frequency.setValueAtTime(320, this.ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.08);
     gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
     osc.connect(gain); gain.connect(this.ctx.destination);
     osc.start(); osc.stop(this.ctx.currentTime + 0.08);
    },
    playHurt() {
     if (!this.ctx) return;
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sawtooth';
     osc.frequency.setValueAtTime(130, this.ctx.currentTime);
     osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.2);
     gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
     gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
     osc.connect(gain); gain.connect(this.ctx.destination);
     osc.start(); osc.stop(this.ctx.currentTime + 0.2);
    }
   };

   // Block Definitions
   const BLOCKS = {
    EMPTY: 0,
    GRASS: 1,
    DIRT: 2,
    STONE: 3,
    WOOD: 4,
    LEAVES: 5,
    WATER: 6,
    SAND: 7,
    BRICK: 8,
    SWORD: 9
   };

   const BLOCK_INFO = [
    { id: 0, name: '空気', transparent: true, solid: false },
    { id: 1, name: '草ブロック', icon: '🌱', solid: true },
    { id: 2, name: '土ブロック', icon: '🤎', solid: true },
    { id: 3, name: '石ブロック', icon: '🪨', solid: true },
    { id: 4, name: '原木', icon: '🪵', solid: true },
    { id: 5, name: '葉っぱ', icon: '🍃', solid: true, transparent: true },
    { id: 6, name: '水', icon: '💧', solid: false, transparent: true, liquid: true },
    { id: 7, name: '砂ブロック', icon: '⏳', solid: true },
    { id: 8, name: 'レンガ', icon: '🧱', solid: true },
    { id: 9, name: '鉄の剣', icon: '🗡️', isTool: true }
   ];

   // Global Game Configuration (EXPANDED MAP SIZE)
   const WORLD_SIZE_X = 80;
   const WORLD_SIZE_Z = 80;
   const WORLD_HEIGHT = 28;
   const WATER_LEVEL = 7;

   const Perlin = {
    perm: [],
    init() {
     const p = [];
     for (let i = 0; i < 256; i++) p[i] = Math.floor(Math.random() * 256);
     this.perm = new Array(512);
     for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
    },
    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); },
    lerp(t, a, b) { return a + t * (b - a); },
    grad(hash, x, y) {
     const h = hash & 7;
     const u = h < 4 ? x : y;
     const v = h < 4 ? y : x;
     return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
    },
    noise(x, y) {
     if (this.perm.length === 0) this.init();
     const X = Math.floor(x) & 255;
     const Y = Math.floor(y) & 255;
     x -= Math.floor(x);
     y -= Math.floor(y);
     const u = this.fade(x);
     const v = this.fade(y);
     const A = this.perm[X] + Y, B = this.perm[X + 1] + Y;
     return this.lerp(v, this.lerp(u, this.grad(this.perm[A], x, y),
      this.grad(this.perm[B], x - 1, y)),
      this.lerp(u, this.grad(this.perm[A + 1], x, y - 1),
       this.grad(this.perm[B + 1], x - 1, y - 1)));
    }
   };

   // Engine & Scene Variables
   let scene, camera, renderer;
   let materials = {};
   let worldBlocks = {}; // key: "x,y,z", val: blockId
   let instancedMeshes = {}; // Key: blockTypeId, Val: THREE.InstancedMesh
   let isMobile = false;

   // Player State
   const player = {
    pos: new THREE.Vector3(WORLD_SIZE_X / 2, 16, WORLD_SIZE_Z / 2),
    vel: new THREE.Vector3(0, 0, 0),
    rot: new THREE.Vector2(0, 0),
    hp: 10,
    maxHp: 10,
    score: 0,
    kills: 0,
    selectedSlot: 0,
    inventory: [BLOCKS.GRASS, BLOCKS.DIRT, BLOCKS.STONE, BLOCKS.WOOD, BLOCKS.LEAVES, BLOCKS.WATER, BLOCKS.SAND, BLOCKS.BRICK, BLOCKS.SWORD],
    isGrounded: false,
    inWater: false,
    height: 1.6,
    radius: 0.3
   };

   // Mobs State
   let mobs = [];

   // Input Tracking
   const keys = {};
   const touchState = {
    joystickActive: false,
    moveDir: new THREE.Vector2(0, 0),
    lookTouchId: null,
    lastTouchX: 0,
    lastTouchY: 0,
    jumping: false
   };

   // Day/Night Cycle
   let timeOfDay = 0.2;
   let sunLight, ambientLight;

   // Raycaster & Target Wireframe Highlight
   const raycaster = new THREE.Raycaster();
   let highlightedBlockMesh = null;

   // Handheld weapon/item mesh
   let handMesh = null;
   let isSwingingHand = false;
   let swingProgress = 0;

   function initEngine() {
    // Mobile Detection (Check touch capability instead of screen width alone to allow small PC windows)
    const isTouchCapable = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) && isTouchCapable;

    if (isMobile) {
     document.getElementById('mobile-controls').classList.remove('hidden');
    }

    // Three.js Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.022);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Ambient & Sun Lighting
    ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
    sunLight.position.set(30, 50, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    const d = 40;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Generate Block Materials
    const texGrassTop = TextureGenerator.grassTop();
    const texGrassSide = TextureGenerator.grassSide();
    const texDirt = TextureGenerator.dirt();
    const texStone = TextureGenerator.stone();
    const texWood = TextureGenerator.wood();
    const texLeaves = TextureGenerator.leaves();
    const texWater = TextureGenerator.water();
    const texSand = TextureGenerator.sand();
    const texBrick = TextureGenerator.brick();

    materials[BLOCKS.GRASS] = [
     new THREE.MeshLambertMaterial({ map: texGrassSide }),
     new THREE.MeshLambertMaterial({ map: texGrassSide }),
     new THREE.MeshLambertMaterial({ map: texGrassTop }),
     new THREE.MeshLambertMaterial({ map: texDirt }),
     new THREE.MeshLambertMaterial({ map: texGrassSide }),
     new THREE.MeshLambertMaterial({ map: texGrassSide })
    ];
    materials[BLOCKS.DIRT] = new THREE.MeshLambertMaterial({ map: texDirt });
    materials[BLOCKS.STONE] = new THREE.MeshLambertMaterial({ map: texStone });
    materials[BLOCKS.WOOD] = new THREE.MeshLambertMaterial({ map: texWood });
    materials[BLOCKS.LEAVES] = new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 });
    materials[BLOCKS.WATER] = new THREE.MeshLambertMaterial({ map: texWater, transparent: true, opacity: 0.65 });
    materials[BLOCKS.SAND] = new THREE.MeshLambertMaterial({ map: texSand });
    materials[BLOCKS.BRICK] = new THREE.MeshLambertMaterial({ map: texBrick });

    // Target Wireframe Highlight Box
    const wireGeo = new THREE.BoxGeometry(1.02, 1.02, 1.02);
    const wireMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, wireframeLinewidth: 2 });
    highlightedBlockMesh = new THREE.Mesh(wireGeo, wireMat);
    highlightedBlockMesh.visible = false;
    scene.add(highlightedBlockMesh);

    // Hand / Item Setup
    setupHandMesh();

    // Build UI & World
    setupUI();
    generateWorld();

    // Setup Event Listeners
    setupEventListeners();

    // Spawn Mobs around the map
    spawnMob('zombie', 25, 12, 25);
    spawnMob('slime', 55, 12, 55);
    spawnMob('zombie', 30, 12, 60);
    spawnMob('slime', 65, 12, 25);

    // Game Loop
    let lastTime = performance.now();
    function animate(time) {
     requestAnimationFrame(animate);
     const dt = Math.min((time - lastTime) / 1000, 0.1);
     lastTime = time;

     updateDayNight(dt);
     updatePlayer(dt);
     updateMobs(dt);
     updateRaycast();
     updateHandAnimation(dt);

     renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
   }

   function findGroundY(x, z) {
    for (let y = WORLD_HEIGHT - 1; y >= 0; y--) {
     const b = getBlock(x, y, z);
     if (b !== BLOCKS.EMPTY && b !== BLOCKS.WATER) {
      return y + 1;
     }
    }
    return WATER_LEVEL + 2;
   }

   function spawnPlayerAtGround() {
    const spawnX = Math.floor(WORLD_SIZE_X / 2);
    const spawnZ = Math.floor(WORLD_SIZE_Z / 2);
    const spawnY = findGroundY(spawnX, spawnZ) + player.height;
    player.pos.set(spawnX + 0.5, spawnY, spawnZ + 0.5);
    player.vel.set(0, 0, 0);
    player.rot.set(0, 0); // Face forward straight
    player.hp = player.maxHp;
    updateHUD();
   }

   function generateWorld() {
    Perlin.init();
    worldBlocks = {};

    for (let x = 0; x < WORLD_SIZE_X; x++) {
     for (let z = 0; z < WORLD_SIZE_Z; z++) {
      // Smooth Perlin noise terrain height
      const n1 = Perlin.noise(x * 0.04, z * 0.04);
      const n2 = Perlin.noise(x * 0.1, z * 0.1) * 0.3;
      const height = Math.floor(9 + (n1 + n2) * 9);

      for (let y = 0; y < WORLD_HEIGHT; y++) {
       let blockType = BLOCKS.EMPTY;

       if (y < height - 3) {
        blockType = BLOCKS.STONE;
       } else if (y < height) {
        blockType = BLOCKS.DIRT;
       } else if (y === height) {
        blockType = (height <= WATER_LEVEL + 1) ? BLOCKS.SAND : BLOCKS.GRASS;
       } else if (y <= WATER_LEVEL) {
        blockType = BLOCKS.WATER;
       }

       if (blockType !== BLOCKS.EMPTY) {
        setBlock(x, y, z, blockType, false);
       }
      }

      // Tree Generation (Random chance on grass)
      if (height > WATER_LEVEL + 1 && Math.random() < 0.02 && x > 4 && x < WORLD_SIZE_X - 5 && z > 4 && z < WORLD_SIZE_Z - 5) {
       const treeH = 4 + Math.floor(Math.random() * 2);
       for (let ty = 0; ty < treeH; ty++) {
        setBlock(x, height + 1 + ty, z, BLOCKS.WOOD, false);
       }
       for (let lx = -2; lx <= 2; lx++) {
        for (let lz = -2; lz <= 2; lz++) {
         for (let ly = 0; ly <= 2; ly++) {
          if (Math.abs(lx) + Math.abs(lz) + ly <= 3) {
           setBlock(x + lx, height + treeH + ly, z + lz, BLOCKS.LEAVES, false);
          }
         }
        }
       }
      }
     }
    }

    // Build all visual 3D Instanced Meshes for the world
    updateWorldMeshes();

    // Set player safely on top of ground
    spawnPlayerAtGround();
   }

   // Rebuild or render visual 3D InstancedMeshes efficiently
   function updateWorldMeshes() {
    // Remove existing instanced meshes
    Object.values(instancedMeshes).forEach(mesh => scene.remove(mesh));
    instancedMeshes = {};

    // Group visible block positions by block type
    const blockGroups = {};
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);

    const keys = Object.keys(worldBlocks);
    for (let i = 0; i < keys.length; i++) {
     const key = keys[i];
     const type = worldBlocks[key];
     if (type === BLOCKS.EMPTY) continue;

     const [x, y, z] = key.split(',').map(Number);

     // Culling: Only render blocks with at least 1 non-solid or empty neighbor
     if (isBlockExposed(x, y, z)) {
      if (!blockGroups[type]) blockGroups[type] = [];
      blockGroups[type].push(new THREE.Vector3(x + 0.5, y + 0.5, z + 0.5));
     }
    }

    // Create InstancedMesh for each block type
    Object.keys(blockGroups).forEach(typeStr => {
     const type = parseInt(typeStr);
     const positions = blockGroups[type];
     const mat = materials[type];
     if (!mat) return;

     const imesh = new THREE.InstancedMesh(boxGeo, mat, positions.length);
     imesh.castShadow = true;
     imesh.receiveShadow = true;
     imesh.userData = { blockType: type };

     const dummy = new THREE.Object3D();
     for (let i = 0; i < positions.length; i++) {
      dummy.position.copy(positions[i]);
      dummy.updateMatrix();
      imesh.setMatrixAt(i, dummy.matrix);
     }
     imesh.instanceMatrix.needsUpdate = true;
     scene.add(imesh);
     instancedMeshes[type] = imesh;
    });
   }

   function isBlockExposed(x, y, z) {
    const neighbors = [
     [x + 1, y, z], [x - 1, y, z],
     [x, y + 1, z], [x, y - 1, z],
     [x, y, z + 1], [x, y, z - 1]
    ];
    for (let i = 0; i < neighbors.length; i++) {
     const [nx, ny, nz] = neighbors[i];
     const nb = getBlock(nx, ny, nz);
     if (nb === BLOCKS.EMPTY || BLOCK_INFO[nb]?.transparent) {
      return true;
     }
    }
    return false;
   }

   function getBlock(x, y, z) {
    return worldBlocks[`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`] || BLOCKS.EMPTY;
   }

   function setBlock(x, y, z, type, refreshVisuals = true) {
    const key = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
    if (type === BLOCKS.EMPTY) {
     delete worldBlocks[key];
    } else {
     worldBlocks[key] = type;
    }
    if (refreshVisuals) {
     updateWorldMeshes();
    }
   }

   function setupHandMesh() {
    const handGroup = new THREE.Group();

    // Arm Mesh
    const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
    const armMat = new THREE.MeshLambertMaterial({ color: 0xe0a080 });
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(0.35, -0.35, -0.5);
    arm.rotation.x = -Math.PI / 6;
    handGroup.add(arm);

    // Block / Tool Item in Hand
    const toolGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
    const toolMat = new THREE.MeshLambertMaterial({ color: 0x55a02e });
    const itemMesh = new THREE.Mesh(toolGeo, toolMat);
    itemMesh.position.set(0.35, -0.2, -0.65);
    itemMesh.name = "handItem";
    handGroup.add(itemMesh);

    camera.add(handGroup);
    scene.add(camera);
    handMesh = handGroup;
   }

   function updateHandMeshItem() {
    if (!handMesh) return;
    const itemMesh = handMesh.getObjectByName("handItem");
    if (!itemMesh) return;

    const selectedType = player.inventory[player.selectedSlot];
    const info = BLOCK_INFO[selectedType];

    if (info.isTool) {
     itemMesh.geometry.dispose();
     itemMesh.geometry = new THREE.BoxGeometry(0.08, 0.5, 0.08);
     itemMesh.material = new THREE.MeshLambertMaterial({ color: 0xd1cfcd });
    } else {
     itemMesh.geometry.dispose();
     itemMesh.geometry = new THREE.BoxGeometry(0.22, 0.22, 0.22);
     itemMesh.material = materials[selectedType] || new THREE.MeshBasicMaterial({ color: 0xffffff });
    }
   }

   function triggerHandSwing() {
    if (!isSwingingHand) {
     isSwingingHand = true;
     swingProgress = 0;
    }
   }

   function updateHandAnimation(dt) {
    if (!handMesh) return;
    if (isSwingingHand) {
     swingProgress += dt * 14;
     const swing = Math.sin(swingProgress);
     handMesh.rotation.x = -swing * 0.85;
     handMesh.rotation.y = swing * 0.45;
     if (swingProgress >= Math.PI) {
      isSwingingHand = false;
      handMesh.rotation.set(0, 0, 0);
     }
    } else {
     const time = performance.now() * 0.0025;
     handMesh.position.y = Math.sin(time * 2) * 0.015;
     handMesh.position.x = Math.cos(time) * 0.01;
    }
   }

   function spawnMob(type, x, y, z) {
    const mobGroup = new THREE.Group();

    if (type === 'zombie') {
     const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0x3d7033 }));
     head.position.y = 0.85;
     mobGroup.add(head);

     const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshLambertMaterial({ color: 0x2e5c8a }));
     body.position.y = 0.3;
     mobGroup.add(body);

     const armL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.55, 0.18), new THREE.MeshLambertMaterial({ color: 0x3d7033 }));
     armL.position.set(-0.35, 0.3, -0.2);
     armL.rotation.x = -Math.PI / 2;
     mobGroup.add(armL);

     const armR = armL.clone();
     armR.position.x = 0.35;
     mobGroup.add(armR);

     const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.2), new THREE.MeshLambertMaterial({ color: 0x1b2838 }));
     legL.position.set(-0.15, -0.25, 0);
     legL.name = "legL";
     mobGroup.add(legL);

     const legR = legL.clone();
     legR.position.x = 0.15;
     legR.name = "legR";
     mobGroup.add(legR);

    } else if (type === 'slime') {
     const outer = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshLambertMaterial({ color: 0x55ff55, transparent: true, opacity: 0.75 }));
     outer.position.y = 0.35;
     mobGroup.add(outer);

     const inner = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshLambertMaterial({ color: 0x22aa22 }));
     inner.position.y = 0.35;
     mobGroup.add(inner);
    }

    mobGroup.position.set(x, y, z);
    scene.add(mobGroup);

    mobs.push({
     type: type,
     mesh: mobGroup,
     pos: mobGroup.position,
     hp: type === 'zombie' ? 20 : 10,
     speed: type === 'zombie' ? 2.4 : 1.7,
     attackCooldown: 0,
     animTimer: Math.random() * 10
    });
   }

   function updateMobs(dt) {
    mobs.forEach((mob) => {
     mob.animTimer += dt * 5;
     mob.attackCooldown = Math.max(0, mob.attackCooldown - dt);

     const distToPlayer = mob.pos.distanceTo(player.pos);

     if (distToPlayer < 20) {
      const dir = new THREE.Vector3().subVectors(player.pos, mob.pos);
      dir.y = 0;
      dir.normalize();

      mob.pos.addScaledVector(dir, mob.speed * dt);
      mob.mesh.rotation.y = Math.atan2(dir.x, dir.z);

      if (mob.type === 'zombie') {
       const legL = mob.mesh.getObjectByName('legL');
       const legR = mob.mesh.getObjectByName('legR');
       if (legL && legR) {
        legL.rotation.x = Math.sin(mob.animTimer) * 0.6;
        legR.rotation.x = -Math.sin(mob.animTimer) * 0.6;
       }
      } else if (mob.type === 'slime') {
       mob.mesh.scale.y = 1 + Math.sin(mob.animTimer * 2) * 0.25;
      }

      if (distToPlayer < 1.4 && mob.attackCooldown <= 0) {
       playerHurt(2);
       mob.attackCooldown = 1.2;
      }
     }

     const blockUnder = getBlock(mob.pos.x, mob.pos.y - 0.1, mob.pos.z);
     if (BLOCK_INFO[blockUnder]?.solid) {
      mob.pos.y = Math.floor(mob.pos.y) + 1;
     } else {
      mob.pos.y = Math.max(1, mob.pos.y - 9.8 * dt);
     }
    });
   }

   function damageMob(mobIndex, amount) {
    const mob = mobs[mobIndex];
    if (!mob) return;

    mob.hp -= amount;
    SoundFX.playHit();

    const kb = new THREE.Vector3().subVectors(mob.pos, player.pos).normalize().multiplyScalar(0.9);
    mob.pos.add(kb);

    if (mob.hp <= 0) {
     scene.remove(mob.mesh);
     mobs.splice(mobIndex, 1);
     player.score += 100;
     player.kills += 1;
     updateHUD();

     setTimeout(() => {
      const rx = Math.random() * (WORLD_SIZE_X - 10) + 5;
      const rz = Math.random() * (WORLD_SIZE_Z - 10) + 5;
      spawnMob(Math.random() > 0.5 ? 'zombie' : 'slime', rx, 12, rz);
     }, 4000);
    }
   }

   function updatePlayer(dt) {
    if (player.pos.y < -5) {
     spawnPlayerAtGround();
    }

    const currentBlock = getBlock(player.pos.x, player.pos.y - 0.5, player.pos.z);
    const headBlock = getBlock(player.pos.x, player.pos.y, player.pos.z);

    player.inWater = (currentBlock === BLOCKS.WATER || headBlock === BLOCKS.WATER);

    document.getElementById('underwater-overlay').style.opacity = (headBlock === BLOCKS.WATER) ? '1' : '0';

    const gravity = player.inWater ? 3.0 : 22.0;
    const moveSpeed = player.inWater ? 3.2 : 5.2;

    let inputX = 0;
    let inputZ = 0;

    if (keys['KeyW'] || keys['ArrowUp']) inputZ -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) inputZ += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;

    if (touchState.joystickActive) {
     inputX = touchState.moveDir.x;
     inputZ = touchState.moveDir.y;
    }

    const moveVec = new THREE.Vector3(inputX, 0, inputZ);
    if (moveVec.lengthSq() > 0) {
     moveVec.normalize();
     moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rot.y);
     player.vel.x = moveVec.x * moveSpeed;
     player.vel.z = moveVec.z * moveSpeed;
    } else {
     player.vel.x *= 0.8;
     player.vel.z *= 0.8;
    }

    if (keys['Space'] || touchState.jumping) {
     if (player.inWater) {
      player.vel.y = 3.6;
     } else if (player.isGrounded) {
      player.vel.y = 8.2;
      player.isGrounded = false;
     }
    }

    player.vel.y -= gravity * dt;
    if (player.inWater) {
     player.vel.y = Math.max(player.vel.y, -2.5);
    }

    movePlayerWithCollision(player.vel.x * dt, 0, 0);
    movePlayerWithCollision(0, player.vel.y * dt, 0);
    movePlayerWithCollision(0, 0, player.vel.z * dt);

    camera.position.copy(player.pos);
    camera.rotation.order = "YXZ";
    camera.rotation.y = player.rot.y;
    camera.rotation.x = player.rot.x;
   }

   function movePlayerWithCollision(dx, dy, dz) {
    player.pos.x += dx;
    player.pos.y += dy;
    player.pos.z += dz;

    const pMinX = player.pos.x - player.radius;
    const pMaxX = player.pos.x + player.radius;
    const pMinY = player.pos.y - player.height;
    const pMaxY = player.pos.y;
    const pMinZ = player.pos.z - player.radius;
    const pMaxZ = player.pos.z + player.radius;

    for (let x = Math.floor(pMinX); x <= Math.floor(pMaxX); x++) {
     for (let y = Math.floor(pMinY); y <= Math.floor(pMaxY); y++) {
      for (let z = Math.floor(pMinZ); z <= Math.floor(pMaxZ); z++) {
       const b = getBlock(x, y, z);
       if (BLOCK_INFO[b]?.solid) {
        if (dy < 0 && player.pos.y - player.height < y + 1) {
         player.pos.y = y + 1 + player.height;
         player.vel.y = 0;
         player.isGrounded = true;
        } else if (dy > 0 && player.pos.y > y) {
         player.pos.y = y - 0.1;
         player.vel.y = 0;
        }
        if (dx !== 0) player.pos.x -= dx;
        if (dz !== 0) player.pos.z -= dz;
       }
      }
     }
    }
   }

   function playerHurt(damage) {
    player.hp = Math.max(0, player.hp - damage);
    SoundFX.playHurt();
    updateHUD();

    const overlay = document.getElementById('damage-overlay');
    overlay.style.opacity = '1';
    setTimeout(() => overlay.style.opacity = '0', 200);

    if (player.hp <= 0) {
     setTimeout(() => {
      spawnPlayerAtGround();
     }, 100);
    }
   }

   function updateRaycast() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const activeMeshes = Object.values(instancedMeshes);
    const intersects = raycaster.intersectObjects(activeMeshes);

    if (intersects.length > 0 && intersects[0].distance < 6.0) {
     const hit = intersects[0];
     const normal = hit.face.normal;

     // Calculate target block coordinate
     const bx = Math.floor(hit.point.x - normal.x * 0.4);
     const by = Math.floor(hit.point.y - normal.y * 0.4);
     const bz = Math.floor(hit.point.z - normal.z * 0.4);

     highlightedBlockMesh.position.set(bx + 0.5, by + 0.5, bz + 0.5);
     highlightedBlockMesh.visible = true;
    } else {
     highlightedBlockMesh.visible = false;
    }
   }

   function performAction(isMineAction) {
    triggerHandSwing();

    // Check Mob Hits First
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    let mobHitIndex = -1;
    mobs.forEach((mob, idx) => {
     const mobBounds = new THREE.Box3().setFromObject(mob.mesh);
     if (raycaster.ray.intersectsBox(mobBounds) && mob.pos.distanceTo(player.pos) < 3.8) {
      mobHitIndex = idx;
     }
    });

    if (mobHitIndex !== -1) {
     const isSword = BLOCK_INFO[player.inventory[player.selectedSlot]].isTool;
     damageMob(mobHitIndex, isSword ? 8 : 3);
     return;
    }

    // Terrain Block Interaction
    const activeMeshes = Object.values(instancedMeshes);
    const intersects = raycaster.intersectObjects(activeMeshes);

    if (intersects.length > 0 && intersects[0].distance < 5.8) {
     const hit = intersects[0];
     const normal = hit.face.normal;

     const bx = Math.floor(hit.point.x - normal.x * 0.4);
     const by = Math.floor(hit.point.y - normal.y * 0.4);
     const bz = Math.floor(hit.point.z - normal.z * 0.4);

     if (isMineAction) {
      setBlock(bx, by, bz, BLOCKS.EMPTY);
      SoundFX.playBreak();
     } else {
      const px = bx + Math.round(normal.x);
      const py = by + Math.round(normal.y);
      const pz = bz + Math.round(normal.z);

      const selectedType = player.inventory[player.selectedSlot];
      if (BLOCK_INFO[selectedType] && !BLOCK_INFO[selectedType].isTool) {
       setBlock(px, py, pz, selectedType);
       SoundFX.playPlace();
      }
     }
    }
   }

   function updateDayNight(dt) {
    timeOfDay += dt * 0.012;
    if (timeOfDay > 1) timeOfDay = 0;

    const angle = timeOfDay * Math.PI * 2;
    sunLight.position.x = Math.cos(angle) * 50 + WORLD_SIZE_X / 2;
    sunLight.position.y = Math.sin(angle) * 50;
    sunLight.position.z = Math.sin(angle) * 30 + WORLD_SIZE_Z / 2;

    const isDay = sunLight.position.y > 0;
    const skyColor = isDay ? new THREE.Color(0x87ceeb) : new THREE.Color(0x0a0a1a);
    scene.background.lerp(skyColor, 0.05);
    scene.fog.color.lerp(skyColor, 0.05);

    ambientLight.intensity = Math.max(0.18, Math.sin(angle) * 0.75);

    const timeIcon = document.getElementById('time-icon');
    const timeText = document.getElementById('time-text');
    if (isDay) {
     timeIcon.className = "fa-solid fa-sun text-yellow-400 text-xl";
     timeText.innerText = "昼";
    } else {
     timeIcon.className = "fa-solid fa-moon text-blue-300 text-xl";
     timeText.innerText = "夜";
    }
   }

   function setupEventListeners() {
    let isMouseDown = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let dragDistance = 0;

    document.getElementById('start-btn').addEventListener('click', () => {
     SoundFX.init();
     document.getElementById('start-overlay').classList.add('hidden');
     spawnPlayerAtGround();
     if (!isMobile) {
      try { document.body.requestPointerLock(); } catch (e) { }
     }
    });

    document.getElementById('game-canvas').addEventListener('click', () => {
     if (!isMobile && document.getElementById('start-overlay').classList.contains('hidden')) {
      if (document.pointerLockElement !== document.body) {
       try { document.body.requestPointerLock(); } catch (e) { }
      }
     }
    });

    document.addEventListener('mousedown', (e) => {
     // Ignore clicks on UI elements
     if (e.target.closest('#start-overlay') || e.target.closest('#hotbar') || e.target.closest('#mobile-controls')) return;

     isMouseDown = true;
     lastMouseX = e.clientX;
     lastMouseY = e.clientY;
     dragDistance = 0;

     // Request Pointer Lock if available
     if (!isMobile && document.getElementById('start-overlay').classList.contains('hidden')) {
      if (document.pointerLockElement !== document.body) {
       try { document.body.requestPointerLock(); } catch (err) { }
      }
     }

     // If locked, immediately trigger action
     if (document.pointerLockElement === document.body) {
      if (e.button === 0) performAction(true);
      if (e.button === 2) performAction(false);
     }
    });

    document.addEventListener('mouseup', (e) => {
     if (e.target.closest('#start-overlay') || e.target.closest('#hotbar') || e.target.closest('#mobile-controls')) return;

     // If pointer lock is not active, trigger action on quick click/tap
     if (document.pointerLockElement !== document.body && dragDistance < 8 && isMouseDown) {
      if (e.button === 0) performAction(true);
      if (e.button === 2) performAction(false);
     }
     isMouseDown = false;
    });

    document.addEventListener('mousemove', (e) => {
     // Case 1: Pointer Lock mode active
     if (document.pointerLockElement === document.body) {
      const dx = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
      const dy = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
      player.rot.y -= dx * 0.0025;
      player.rot.x -= dy * 0.0025;
      player.rot.x = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, player.rot.x));
     }
     // Case 2: Mouse Drag mode fallback (works even if pointer lock is blocked by iframe/browser)
     else if (isMouseDown) {
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      dragDistance += Math.abs(dx) + Math.abs(dy);

      player.rot.y -= dx * 0.0035;
      player.rot.x -= dy * 0.0035;
      player.rot.x = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, player.rot.x));

      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
     }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keydown', (e) => {
     keys[e.code] = true;
     if (e.key >= '1' && e.key <= '9') {
      const idx = parseInt(e.key) - 1;
      if (idx < player.inventory.length) {
       selectHotbarSlot(idx);
      }
     }
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('resize', () => {
     camera.aspect = window.innerWidth / window.innerHeight;
     camera.updateProjectionMatrix();
     renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Touch Joystick
    const joyZone = document.getElementById('joystick-container');
    const joyKnob = document.getElementById('joystick-knob');

    joyZone.addEventListener('touchstart', (e) => {
     touchState.joystickActive = true;
    });

    joyZone.addEventListener('touchmove', (e) => {
     if (!touchState.joystickActive) return;
     const touch = e.touches[0];
     const rect = joyZone.getBoundingClientRect();
     const centerX = rect.left + rect.width / 2;
     const centerY = rect.top + rect.height / 2;

     let dx = touch.clientX - centerX;
     let dy = touch.clientY - centerY;
     const dist = Math.sqrt(dx * dx + dy * dy);
     const maxDist = rect.width / 2;

     if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
     }

     joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
     touchState.moveDir.set(dx / maxDist, dy / maxDist);
    });

    const resetJoystick = () => {
     touchState.joystickActive = false;
     touchState.moveDir.set(0, 0);
     joyKnob.style.transform = 'translate(0px, 0px)';
    };

    joyZone.addEventListener('touchend', resetJoystick);
    joyZone.addEventListener('touchcancel', resetJoystick);

    // Touch Camera Drag
    window.addEventListener('touchstart', (e) => {
     for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.clientX > window.innerWidth / 2 && touchState.lookTouchId === null) {
       touchState.lookTouchId = touch.identifier;
       touchState.lastTouchX = touch.clientX;
       touchState.lastTouchY = touch.clientY;
      }
     }
    });

    window.addEventListener('touchmove', (e) => {
     for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.identifier === touchState.lookTouchId) {
       const dx = touch.clientX - touchState.lastTouchX;
       const dy = touch.clientY - touchState.lastTouchY;

       player.rot.y -= dx * 0.005;
       player.rot.x -= dy * 0.005;
       player.rot.x = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, player.rot.x));

       touchState.lastTouchX = touch.clientX;
       touchState.lastTouchY = touch.clientY;
      }
     }
    });

    const endTouchLook = (e) => {
     for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchState.lookTouchId) {
       touchState.lookTouchId = null;
      }
     }
    };
    window.addEventListener('touchend', endTouchLook);
    window.addEventListener('touchcancel', endTouchLook);

    // Mobile Buttons
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); touchState.jumping = true; });
    document.getElementById('btn-jump').addEventListener('touchend', (e) => { e.preventDefault(); touchState.jumping = false; });
    document.getElementById('btn-mine').addEventListener('touchstart', (e) => { e.preventDefault(); performAction(true); });
    document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); performAction(false); });
    document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); performAction(true); });
   }

   function setupUI() {
    updateHUD();

    const hotbarEl = document.getElementById('hotbar');
    hotbarEl.innerHTML = '';

    player.inventory.forEach((itemType, idx) => {
     const info = BLOCK_INFO[itemType];
     const slot = document.createElement('button');
     slot.className = `w-12 h-12 rounded-xl flex items-center justify-center text-xl transition-all border-2 shrink-0 ${idx === player.selectedSlot ? 'border-amber-400 bg-white/30 scale-105 shadow-lg' : 'border-white/10 bg-black/40'}`;
     slot.innerText = info.icon || '📦';

     slot.addEventListener('click', () => selectHotbarSlot(idx));
     slot.addEventListener('touchstart', (e) => {
      e.preventDefault();
      selectHotbarSlot(idx);
     });

     hotbarEl.appendChild(slot);
    });

    updateSelectedItemLabel();
   }

   function selectHotbarSlot(idx) {
    player.selectedSlot = idx;
    const slots = document.getElementById('hotbar').children;
    for (let i = 0; i < slots.length; i++) {
     if (i === idx) {
      slots[i].className = 'w-12 h-12 rounded-xl flex items-center justify-center text-xl transition-all border-2 border-amber-400 bg-white/30 scale-105 shadow-lg shrink-0';
     } else {
      slots[i].className = 'w-12 h-12 rounded-xl flex items-center justify-center text-xl transition-all border-2 border-white/10 bg-black/40 shrink-0';
     }
    }
    updateSelectedItemLabel();
    updateHandMeshItem();
   }

   function updateSelectedItemLabel() {
    const info = BLOCK_INFO[player.inventory[player.selectedSlot]];
    const label = document.getElementById('selected-item-name');
    label.innerText = info.name;
    label.style.opacity = '1';
    clearTimeout(label.hideTimer);
    label.hideTimer = setTimeout(() => label.style.opacity = '0', 2000);
   }

   function updateHUD() {
    const container = document.getElementById('hearts-container');
    container.innerHTML = '';
    for (let i = 0; i < player.maxHp / 2; i++) {
     const heart = document.createElement('i');
     const hpVal = (i + 1) * 2;
     if (player.hp >= hpVal) {
      heart.className = "fa-solid fa-heart text-red-500 text-base drop-shadow";
     } else if (player.hp >= hpVal - 1) {
      heart.className = "fa-solid fa-heart-crack text-red-500 text-base drop-shadow";
     } else {
      heart.className = "fa-regular fa-heart text-gray-500 text-base";
     }
     container.appendChild(heart);
    }

    document.getElementById('score-val').innerText = player.score;
    document.getElementById('kills-val').innerText = player.kills;
   }

   // Initialize Engine on load
   window.addEventListener('load', () => {
    initEngine();
   });
  </script>
 </body>
