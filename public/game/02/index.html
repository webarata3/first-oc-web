<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Chess VS CPU</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chess.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
   @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

   body {
    font-family: 'Inter', sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
   }

   /* Chessboard styling */
   .board-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1 / 1;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
   }

   .square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.15s ease;
   }

   /* Square Colors (Classic Wood/Modern Minimalist) */
   .square-light {
    background-color: #f0d9b5;
    color: #b58863;
   }

   .square-dark {
    background-color: #b58863;
    color: #f0d9b5;
   }

   /* Highlights */
   .square.selected {
    background-color: #7b61ff !important;
   }

   .square.last-move {
    background-color: rgba(255, 255, 0, 0.4) !important;
   }

   .square.in-check {
    background-color: #ff4d4d !important;
    animation: pulse-red 1s infinite alternate;
   }

   @keyframes pulse-red {
    from {
     background-color: #ff4d4d;
    }

    to {
     background-color: #cc0000;
    }
   }

   /* Move indicators */
   .move-indicator {
    position: absolute;
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background-color: rgba(20, 83, 45, 0.4);
    pointer-events: none;
    z-index: 5;
   }

   .capture-indicator {
    position: absolute;
    width: 88%;
    height: 88%;
    border-radius: 50%;
    border: 4px solid rgba(220, 38, 38, 0.5);
    pointer-events: none;
    z-index: 5;
   }

   /* Chess Piece SVGs */
   .piece {
    width: 85%;
    height: 85%;
    z-index: 10;
    filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.3));
    transition: transform 0.1s ease;
   }

   .square:active .piece {
    transform: scale(1.1);
   }

   /* Custom Scrollbar for move history */
   .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
   }

   .custom-scrollbar::-webkit-scrollbar-track {
    background: #1f2937;
   }

   .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #4b5563;
    border-radius: 3px;
   }
  </style>
 </head>
 <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 py-3 px-4 shadow-md">
   <div class="max-w-4xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-3">
     <i class="fa-solid fa-chess-king text-amber-500 text-2xl"></i>
     <h1 class="font-bold text-lg sm:text-xl text-slate-100">Web Chess VS CPU</h1>
    </div>
    <button id="btn-settings"
     class="text-slate-400 hover:text-amber-400 transition-colors p-2 rounded-lg hover:bg-slate-700">
     <i class="fa-solid fa-gear text-lg"></i>
    </button>
   </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col lg:flex-row gap-4 items-center justify-center">

   <!-- Left Column: Game Area -->

    <!-- Opponent Status (CPU) -->
    <div id="opponent-card"
     class="w-full bg-slate-800 rounded-t-xl p-3 flex justify-between items-center border-b border-slate-700">
     <div class="flex items-center space-x-3">
      <div class="relative">
       <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center border-2 border-slate-600">
        <i class="fa-solid fa-robot text-amber-400 text-lg"></i>
       </div>
       <span id="cpu-thinking-spinner" class="hidden absolute -top-1 -right-1 flex h-4 w-4">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-4 w-4 bg-amber-500"></span>
       </span>
      </div>
      <div>
       <div class="flex items-center space-x-2">
        <span class="font-semibold text-sm sm:text-base" id="cpu-name">CPU (中級)</span>
        <span id="turn-badge-cpu"
         class="hidden text-[10px] bg-amber-500 text-slate-950 font-bold px-2 py-0.5 rounded-full">THINKING</span>
       </div>
       <!-- Captured by CPU -->
       <div id="captured-by-cpu" class="flex flex-wrap text-xs h-5 items-center text-slate-400 space-x-1"></div>
      </div>
     </div>
     <div id="eval-score"
      class="text-xs font-mono bg-slate-900 px-2.5 py-1 rounded-md border border-slate-700 text-slate-300">
      +0.0
     </div>
    </div>

    <!-- CHESS BOARD -->
    <div id="chessboard" class="board-grid w-full rounded-b-none rounded-t-none overflow-hidden relative">
     <!-- Squares dynamically rendered via JS -->
    </div>

    <!-- Player Status (User) -->
    <div id="player-card"
     class="w-full bg-slate-800 rounded-b-xl p-3 flex justify-between items-center border-t border-slate-700 shadow-md">
     <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center border-2 border-slate-600">
       <i class="fa-solid fa-user text-sky-400 text-lg"></i>
      </div>
      <div>
       <div class="flex items-center space-x-2">
        <span class="font-semibold text-sm sm:text-base">あなた</span>
        <span id="turn-badge-player"
         class="text-[10px] bg-sky-500 text-slate-950 font-bold px-2 py-0.5 rounded-full">YOUR TURN</span>
       </div>
       <!-- Captured by Player -->
       <div id="captured-by-player" class="flex flex-wrap text-xs h-5 items-center text-slate-400 space-x-1"></div>
      </div>
     </div>
    </div>

    <!-- Action Toolbar -->
    <div class="w-full grid grid-cols-4 gap-2 mt-3">
     <button id="btn-undo"
      class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs sm:text-sm font-medium flex items-center justify-center space-x-1 transition shadow border border-slate-700">
      <i class="fa-solid fa-rotate-left"></i>
      <span>待った</span>
     </button>
     <button id="btn-hint"
      class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs sm:text-sm font-medium flex items-center justify-center space-x-1 transition shadow border border-slate-700">
      <i class="fa-solid fa-lightbulb text-amber-400"></i>
      <span>ヒント</span>
     </button>
     <button id="btn-resign"
      class="bg-slate-800 hover:bg-rose-900/40 text-rose-300 py-2 rounded-lg text-xs sm:text-sm font-medium flex items-center justify-center space-x-1 transition shadow border border-slate-700">
      <i class="fa-solid fa-flag"></i>
      <span>投了</span>
     </button>
     <button id="btn-restart"
      class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2 rounded-lg text-xs sm:text-sm flex items-center justify-center space-x-1 transition shadow">
      <i class="fa-solid fa-arrows-rotate"></i>
      <span>再開</span>
     </button>
    </div>

   </div>

   <!-- Right Column: Move History & Info -->
   <div class="w-full max-w-[500px] lg:w-72 flex flex-col gap-3">
    <div
     class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md flex-1 flex flex-col max-h-[250px] lg:max-h-[480px]">

     </div>
    </div>
   </div>

  </main>

  <!-- SETTINGS & NEW GAME MODAL -->

      <button id="btn-color-white"

       <i class="fa-solid fa-chess-king text-slate-100"></i>
       <span>先手 (白)</span>

       <span>後手 (黒)</span>

  </div>

  </div>

  <footer class="bg-slate-950 py-2 text-center text-[11px] text-slate-500 border-t border-slate-800">

    -5, 0, 5, 5, 5, 5, 0, -5,
    0, 0, 5, 5, 5, 5, 0, -5,
    -10, 5, 5, 5, 5, 5, 0, -10,
    -10, 0, 5, 0, 0, 0, 0, -10,
    -20, -10, -10, -5, -5, -10, -10, -20
   ];

   const KING_MID_TABLE = [
    -30, -40, -40, -50, -50, -40, -40, -30,
    -30, -40, -40, -50, -50, -40, -40, -30,
    -30, -40, -40, -50, -50, -40, -40, -30,
    -30, -40, -40, -50, -50, -40, -40, -30,
    -20, -30, -30, -40, -40, -30, -30, -20,
    -10, -20, -20, -20, -20, -20, -20, -10,
    20, 20, 0, 0, 0, 0, 20, 20,
    20, 30, 10, 0, 0, 10, 30, 20
   ];

   const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

   /* --- AI LOGIC (Minimax + Alpha-Beta Pruning) --- */
   function evaluateBoard(board) {
    let totalEvaluation = 0;
    for (let i = 0; i < 8; i++) {
     for (let j = 0; j < 8; j++) {
      const piece = board[i][j];
      if (piece) {
       const val = getPieceValue(piece, i, j);
       totalEvaluation += piece.color === 'w' ? val : -val;
      }
     }
    }
    return totalEvaluation;
   }

   function getPieceValue(piece, x, y) {
    if (!piece) return 0;
    const absoluteValue = PIECE_VALUES[piece.type];
    let pstValue = 0;

    const rX = piece.color === 'w' ? x : 7 - x;
    const rY = y;
    const index = rX * 8 + rY;

    switch (piece.type) {
     case 'p': pstValue = PAWN_TABLE[index]; break;
     case 'n': pstValue = KNIGHT_TABLE[index]; break;
     case 'b': pstValue = BISHOP_TABLE[index]; break;
     case 'r': pstValue = ROOK_TABLE[index]; break;
     case 'q': pstValue = QUEEN_TABLE[index]; break;
     case 'k': pstValue = KING_MID_TABLE[index]; break;
    }
    return absoluteValue + pstValue;
   }

   // Minimax with Alpha-Beta
   function minimax(gameInstance, depth, alpha, beta, isMaximizing) {
    if (depth === 0 || gameInstance.game_over()) {
     return evaluateBoard(gameInstance.board());
    }

    const moves = gameInstance.moves({ verbose: true });

    // Move ordering (captures first for faster alpha-beta pruning)
    moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));

    if (isMaximizing) {
     let maxEval = -Infinity;
     for (let move of moves) {
      gameInstance.move(move);
      let evaluation = minimax(gameInstance, depth - 1, alpha, beta, false);
      gameInstance.undo();
      maxEval = Math.max(maxEval, evaluation);
      alpha = Math.max(alpha, evaluation);
      if (beta <= alpha) break;
     }
     return maxEval;
    } else {
     let minEval = Infinity;
     for (let move of moves) {
      gameInstance.move(move);
      let evaluation = minimax(gameInstance, depth - 1, alpha, beta, true);
      gameInstance.undo();
      minEval = Math.min(minEval, evaluation);
      beta = Math.min(beta, evaluation);
      if (beta <= alpha) break;
     }
     return minEval;
    }
   }

   function getBestCpuMove() {
    const moves = game.moves({ verbose: true });
    if (moves.length === 0) return null;

    // Level 1: Random + Basic Capture Priority
    if (cpuLevel === 1) {
     if (Math.random() < 0.4) {
      return moves[Math.floor(Math.random() * moves.length)];
     }
    }

    const searchDepth = cpuLevel === 1 ? 1 : (cpuLevel === 2 ? 2 : (cpuLevel === 3 ? 3 : 3));
    let bestMove = null;
    let isMaximizing = game.turn() === 'w';
    let bestValue = isMaximizing ? -Infinity : Infinity;

    // Shuffle moves slightly to avoid deterministic repetitive plays
    moves.sort(() => Math.random() - 0.5);

    for (let move of moves) {
     game.move(move);
     let boardVal = minimax(game, searchDepth - 1, -Infinity, Infinity, !isMaximizing);
     game.undo();

     if (isMaximizing) {
      if (boardVal > bestValue) {
       bestValue = boardVal;
       bestMove = move;
      }
     } else {
      if (boardVal < bestValue) {
       bestValue = boardVal;
       bestMove = move;
      }
     }
    }
    return bestMove || moves[Math.floor(Math.random() * moves.length)];
   }

   /* --- RENDER BOARD & UI --- */
   function renderBoard() {
    const boardEl = document.getElementById('chessboard');
    boardEl.innerHTML = '';

    const board = game.board();
    const lastMove = game.history({ verbose: true }).slice(-1)[0];
    const inCheck = game.in_check();
    const turn = game.turn();

    // Orientation flip if playing Black
    const rows = playerColor === 'w' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];
    const cols = playerColor === 'w' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];

    for (let r of rows) {
     for (let c of cols) {
      const squareName = String.fromCharCode(97 + c) + (8 - r);
      const piece = board[r][c];

      const squareEl = document.createElement('div');
      const isLight = (r + c) % 2 === 0;
      squareEl.className = `square ${isLight ? 'square-light' : 'square-dark'}`;
      squareEl.dataset.square = squareName;

      // Last move highlight
      if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
       squareEl.classList.add('last-move');
      }

      // Selected highlight
      if (selectedSquare === squareName) {
       squareEl.classList.add('selected');
      }

      // King in check highlight
      if (inCheck && piece && piece.type === 'k' && piece.color === turn) {
       squareEl.classList.add('in-check');
      }

      // Render Piece
      if (piece) {
       const pieceKey = piece.color + piece.type.toUpperCase();
       squareEl.innerHTML = PIECE_SVGS[pieceKey] || '';
      }

      // Render Move Markers
      const moveMatch = possibleMoves.find(m => m.to === squareName);
      if (moveMatch) {
       const indicator = document.createElement('div');
       indicator.className = moveMatch.captured ? 'capture-indicator' : 'move-indicator';
       squareEl.appendChild(indicator);
      }

      // Click listener
      squareEl.addEventListener('click', () => handleSquareClick(squareName));

      boardEl.appendChild(squareEl);
     }
    }

    updateUI();
   }

   /* --- GAME CONTROL LOGIC --- */
   function handleSquareClick(square) {
    if (isThinking || game.game_over() || game.turn() !== playerColor) return;

    const piece = game.get(square);

    // Select piece
    if (selectedSquare === null) {
     if (piece && piece.color === playerColor) {
      selectedSquare = square;
      possibleMoves = game.moves({ square: square, verbose: true });
      renderBoard();
     }
     return;
    }

    // Click same square -> Deselect
    if (selectedSquare === square) {
     selectedSquare = null;
     possibleMoves = [];
     renderBoard();
     return;
    }

    // Click another own piece -> Switch selection
    if (piece && piece.color === playerColor) {
     selectedSquare = square;
     possibleMoves = game.moves({ square: square, verbose: true });
     renderBoard();
     return;
    }

    // Attempt Move
    const moveTarget = possibleMoves.find(m => m.to === square);
    if (moveTarget) {
     // Check if promotion
     if (moveTarget.flags.includes('p')) {
      pendingPromotionMove = { from: selectedSquare, to: square };
      showPromotionModal();
      return;
     }

     makePlayerMove({ from: selectedSquare, to: square });
    } else {
     selectedSquare = null;
     possibleMoves = [];
     renderBoard();
    }
   }

   function makePlayerMove(move) {
    const res = game.move(move);
    selectedSquare = null;
    possibleMoves = [];
    renderBoard();

    if (checkGameOver()) return;

    // Trigger CPU Move
    if (game.turn() !== playerColor) {
     triggerCpuTurn();
    }
   }

   function triggerCpuTurn() {
    isThinking = true;
    document.getElementById('cpu-thinking-spinner').classList.remove('hidden');
    document.getElementById('turn-badge-cpu').classList.remove('hidden');
    document.getElementById('turn-badge-player').classList.add('hidden');

    const delay = Math.min(600, Math.max(200, 100 * cpuLevel));

    setTimeout(() => {
     const bestMove = getBestCpuMove();
     if (bestMove) {
      game.move(bestMove);
     }

     isThinking = false;
     document.getElementById('cpu-thinking-spinner').classList.add('hidden');
     document.getElementById('turn-badge-cpu').classList.add('hidden');
     document.getElementById('turn-badge-player').classList.remove('hidden');

     renderBoard();
     checkGameOver();
    }, delay);
   }

   function updateUI() {
    // Captured Pieces Calculation
    const history = game.history({ verbose: true });
    const capturedPlayer = []; // Pieces captured by player
    const capturedCpu = [];    // Pieces captured by CPU

    for (let move of history) {
     if (move.captured) {
      const capPiece = (move.color === 'w' ? 'b' : 'w') + move.captured.toUpperCase();
      if (move.color === playerColor) {
       capturedPlayer.push(capPiece);
      } else {
       capturedCpu.push(capPiece);
      }
     }
    }

    document.getElementById('captured-by-player').innerHTML = capturedPlayer.map(p => PIECE_SVGS[p]).join('');
    document.getElementById('captured-by-cpu').innerHTML = capturedCpu.map(p => PIECE_SVGS[p]).join('');

    // Evaluation score
    const evalVal = evaluateBoard(game.board()) / 100;
    const adjustedVal = playerColor === 'w' ? evalVal : -evalVal;
    const evalStr = (adjustedVal >= 0 ? '+' : '') + adjustedVal.toFixed(1);
    document.getElementById('eval-score').textContent = evalStr;

    // Move History List
    const moveHistoryEl = document.getElementById('move-history');
    moveHistoryEl.innerHTML = '';
    const historyMoves = game.history();
    let count = 0;

    for (let i = 0; i < historyMoves.length; i += 2) {
     count++;
     const moveNum = Math.floor(i / 2) + 1;
     const whiteMove = historyMoves[i] || '';
     const blackMove = historyMoves[i + 1] || '';

     const row = document.createElement('div');
     row.className = "col-span-2 flex justify-between py-0.5 border-b border-slate-800/50";
     row.innerHTML = `<span class="text-slate-500 w-6">${moveNum}.</span><span class="text-slate-200 flex-1">${whiteMove}</span><span class="text-slate-400 flex-1 text-right">${blackMove}</span>`;
     moveHistoryEl.appendChild(row);
    }

    document.getElementById('move-count').textContent = `${historyMoves.length} 手`;
    moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
   }

   /* --- MODAL & BUTTON LISTENERS --- */
   function checkGameOver() {
    if (!game.game_over()) return false;

    const modal = document.getElementById('modal-gameover');
    const title = document.getElementById('gameover-title');
    const reason = document.getElementById('gameover-reason');
    const icon = document.getElementById('gameover-icon');

    modal.classList.remove('hidden');

    if (game.in_checkmate()) {
     const winner = game.turn() === 'w' ? '黒 (後手)' : '白 (先手)';
     const isPlayerWinner = (game.turn() !== playerColor);
     title.textContent = isPlayerWinner ? 'あなたの勝利！' : 'CPUの勝利';
     reason.textContent = `チェックメイトで ${winner} の勝利です。`;
     icon.className = isPlayerWinner ? "fa-solid fa-trophy text-amber-400" : "fa-solid fa-skull text-rose-500";
    } else if (game.in_draw()) {
     title.textContent = '引き分け';
     reason.textContent = game.in_stalemate() ? 'ステイルメイト（指し手なし）です。' : '規定により引き分けです。';
     icon.className = "fa-solid fa-handshake text-sky-400";
    }
    return true;
   }

   function showPromotionModal() {
    const modal = document.getElementById('modal-promotion');
    const container = document.getElementById('promotion-options');
    container.innerHTML = '';

    const pieces = ['q', 'r', 'b', 'n'];
    for (let p of pieces) {
     const pieceKey = playerColor + p.toUpperCase();
     const btn = document.createElement('button');
     btn.className = "w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-xl p-1 flex items-center justify-center border border-slate-500 shadow transition";
     btn.innerHTML = PIECE_SVGS[pieceKey];
     btn.onclick = () => {
      modal.classList.add('hidden');
      makePlayerMove({ ...pendingPromotionMove, promotion: p });
      pendingPromotionMove = null;
     };
     container.appendChild(btn);
    }
    modal.classList.remove('hidden');
   }

   // Settings Modal
   document.getElementById('btn-settings').onclick = () => {
    document.getElementById('modal-settings').classList.remove('hidden');
   };
   document.getElementById('btn-close-settings').onclick = () => {
    document.getElementById('modal-settings').classList.add('hidden');
   };

   // Difficulty selectors
   document.querySelectorAll('.btn-diff').forEach(btn => {
    btn.onclick = (e) => {
     document.querySelectorAll('.btn-diff').forEach(b => {
      b.className = "btn-diff p-2 rounded-lg border border-slate-600 bg-slate-700 text-xs font-medium text-center hover:bg-slate-600 transition";
     });
     e.currentTarget.className = "btn-diff p-2 rounded-lg border border-amber-500 bg-amber-500/20 text-amber-300 text-xs font-bold text-center transition";
     cpuLevel = parseInt(e.currentTarget.dataset.level);
    };
   });

   // Color selector
   document.getElementById('btn-color-white').onclick = (e) => {
    playerColor = 'w';
    document.getElementById('btn-color-white').className = "btn-color p-3 rounded-xl border-2 border-amber-500 bg-slate-700 flex items-center justify-center space-x-2 font-semibold text-sm";
    document.getElementById('btn-color-black').className = "btn-color p-3 rounded-xl border-2 border-transparent bg-slate-700 text-slate-400 flex items-center justify-center space-x-2 font-semibold text-sm hover:bg-slate-600";
   };
   document.getElementById('btn-color-black').onclick = (e) => {
    playerColor = 'b';
    document.getElementById('btn-color-black').className = "btn-color p-3 rounded-xl border-2 border-amber-500 bg-slate-700 flex items-center justify-center space-x-2 font-semibold text-sm";
    document.getElementById('btn-color-white').className = "btn-color p-3 rounded-xl border-2 border-transparent bg-slate-700 text-slate-400 flex items-center justify-center space-x-2 font-semibold text-sm hover:bg-slate-600";
   };

   // Start / Restart Game
   function startNewGame() {
    game = new Chess();
    selectedSquare = null;
    possibleMoves = [];
    isThinking = false;

    document.getElementById('modal-settings').classList.add('hidden');
    document.getElementById('modal-gameover').classList.add('hidden');
    document.getElementById('cpu-name').textContent = `CPU (${DIFF_NAMES[cpuLevel]})`;

    renderBoard();

    if (playerColor === 'b') {
     triggerCpuTurn();
    }
   }

   document.getElementById('btn-start-game').onclick = startNewGame;
   document.getElementById('btn-restart').onclick = startNewGame;
   document.getElementById('btn-gameover-new').onclick = () => {
    document.getElementById('modal-settings').classList.remove('hidden');
   };

   // Undo move (Undo twice to revert CPU move as well)
   document.getElementById('btn-undo').onclick = () => {
    if (isThinking) return;
    game.undo(); // Undo CPU move
    if (game.turn() !== playerColor) {
     game.undo(); // Undo Player move
    }
    selectedSquare = null;
    possibleMoves = [];
    renderBoard();
   };

   // Hint Button
   document.getElementById('btn-hint').onclick = () => {
    if (isThinking || game.game_over() || game.turn() !== playerColor) return;
    const hintMove = getBestCpuMove();
    if (hintMove) {
     selectedSquare = hintMove.from;
     possibleMoves = game.moves({ square: hintMove.from, verbose: true });
     renderBoard();
    }
   };

   // Resign
   document.getElementById('btn-resign').onclick = () => {
    if (game.game_over()) return;
    const modal = document.getElementById('modal-gameover');
    document.getElementById('gameover-title').textContent = '投了';
    document.getElementById('gameover-reason').textContent = 'あなたが投了しました。CPUの勝利です。';
    document.getElementById('gameover-icon').className = "fa-solid fa-flag text-rose-500";
    modal.classList.remove('hidden');
   };

   // On Page Load
   window.onload = () => {
    renderBoard();
   };
  </script>
